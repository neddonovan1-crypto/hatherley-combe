<script>
/* Hatherley Combe: the almanack. Prices, weather, people, news. */
const SEASONS = ['Spring', 'Summer', 'Autumn', 'Winter'];
const QUARTER = ['Lady Day', 'Midsummer', 'Michaelmas', 'Christmas'];
const FIRST_YEAR = 1795, LAST_YEAR = 1815;

// Wheat, shillings the Winchester quarter. Annual averages, near enough to the record.
const PRICES = {1795:75,1796:78,1797:53,1798:51,1799:69,1800:113,1801:119,1802:69,1803:58,1804:62,1805:89,1806:79,1807:75,1808:81,1809:97,1810:106,1811:95,1812:126,1813:109,1814:74,1815:65};
// The harvest, as a fraction of a fair one.
const WEATHER = {1795:0.78,1796:1.0,1797:1.05,1798:1.1,1799:0.74,1800:0.7,1801:0.98,1802:1.05,1803:1.0,1804:0.95,1805:0.95,1806:1.0,1807:1.0,1808:0.95,1809:0.85,1810:0.9,1811:0.88,1812:0.8,1813:1.28,1814:1.05,1815:1.1};

const PEOPLE = {
  henrietta: {name:'Henrietta', role:() => 'Your wife', r:1, met:true},
  kitty: {name:'Kitty', role:() => kittyRole(), r:2, met:true},
  edmund: {name:'Edmund', role:() => edmundRole(), r:1, met:true},
  crabbe: {name:'Mr Crabbe', role:() => F('crabbeGone') ? 'Late your steward, now of Newbury' : 'Your steward', r:0, met:true},
  gall: {name:'Dr Septimus Gall', role:() => F('gallDead') ? 'Late vicar of Hatherley' : 'Vicar, magistrate, tithe-owner', r:0, met:true},
  cullerne: {name:'Lord Cullerne', role:() => 'Earl. Owns most of Wyvern', r:0, met:true},
  pryor: {name:'Jem Pryor', role:() => 'Cottager on the common', r:0, met:true},
  hartopp: {name:'Mr Hartopp', role:() => 'Neighbour, mad on turnips', r:1, met:true},
  thorne: {name:'Abigail Thorne', role:() => F('nephewFarm') ? 'Late of Long Barrow Farm' : 'Of Long Barrow Farm', r:0, met:false},
  vane: {name:'Captain Vane', role:() => S.flags.kitty === 'vane' ? 'Your son-in-law, alas' : 'Northamptonshire Militia', r:0, met:false},
  pinch: {name:'Mr Lumley Pinch', role:() => S.flags.kitty === 'pinch' ? 'Your son-in-law. Sugar' : 'Of Bristol. Sugar', r:0, met:false},
  oakes: {name:'Mr Oakes', role:() => F('oakesVicar') ? 'Vicar of Hatherley' : 'The curate, on forty pounds', r:1, met:false},
  dubreuil: {name:'Lieutenant Dubreuil', role:() => 'French officer on parole', r:0, met:false}
};
const REGARD = ['Implacable','Hostile','Cold','Wary','Cool','Civil','Cordial','Warm','Fond','Devoted','Would die for you'];

const STANDING_W = ['A laughing-stock','Overlooked','Respectable','Well regarded','A man of weight','First man in the county'];
const GOODWILL_W = ['Hated','Resented','Tolerated','Liked','Trusted','Toasted at the Bell'];
const FAMILY_W = ['At open war','Frosty','Civil','Contented','Happy','Doting'];

// County intelligence. Keyed year-season.
const NEWS = {
  '1795-0':'Bread riots at Newbury, Chichester and Wells. The quartern loaf at elevenpence.',
  '1795-1':'The Prince of Wales has married his cousin Caroline. He is said to have called for brandy on first seeing her.',
  '1795-2':'A stone thrown at the King’s coach on his way to open Parliament. The harvest the worst in thirty years.',
  '1795-3':'Parliament passes the Two Acts against treasonable practices and seditious meetings.',
  '1796-0':'General Bonaparte, aged twenty-six, has crossed into Italy.',
  '1796-1':'A general election. Dr Jenner of Berkeley has put cow-pox into a gardener’s boy, to see what happens.',
  '1796-3':'A French fleet with fifteen thousand men sails for Ireland and is scattered by a gale in Bantry Bay.',
  '1797-0':'The French land at Fishguard. The Bank of England stops payment in gold.',
  '1797-1':'The fleet has mutinied at Spithead, and again at the Nore. The men ask a shilling a day.',
  '1797-3':'Admiral Duncan has beaten the Dutch at Camperdown. Mr Pitt trebles the assessed taxes.',
  '1798-1':'Rebellion in Ireland. Bonaparte has sailed from Toulon, nobody knows whither.',
  '1798-2':'Nelson has found the French fleet at the mouth of the Nile and destroyed it.',
  '1799-1':'The wettest summer in memory. Corn sprouting in the ear.',
  '1799-3':'Bonaparte makes himself First Consul. Mr Pitt’s tax on incomes comes into force.',
  '1800-1':'Wheat past a hundred shillings. Riots at Banbury, Oxford and Nottingham.',
  '1800-2':'The Brown Bread Act forbids the miller to dress fine white flour. It is evaded by Tuesday.',
  '1801-0':'Union with Ireland. Mr Pitt has resigned and Mr Addington, a doctor’s son, is Minister.',
  '1801-1':'The first Census of the people. Nelson at Copenhagen puts the glass to his blind eye.',
  '1802-0':'Peace signed at Amiens. The income tax is to be repealed and the returns burnt.',
  '1803-1':'War again. Bonaparte has seized every Englishman of military age found in France.',
  '1803-3':'The Army of England is encamped at Boulogne. Three hundred and eighty thousand Volunteers under arms at home.',
  '1804-1':'Mr Pitt returns. Bonaparte has had himself voted Emperor of the French.',
  '1805-2':'The French camp at Boulogne has broken up and marched east. Nobody knows why.',
  '1805-3':'A great victory off Cape Trafalgar. Lord Nelson killed.',
  '1806-0':'Mr Pitt is dead, at forty-six. His last words concerned either his country or a veal pie; accounts differ.',
  '1806-3':'Bonaparte, at Berlin, forbids all Europe to trade with Britain.',
  '1807-0':'The slave trade is abolished by two hundred and eighty-three votes to sixteen.',
  '1807-2':'The fleet bombards Copenhagen and carries off the Danish navy.',
  '1808-2':'Sir Arthur Wellesley has beaten the French at Vimeiro, in Portugal.',
  '1809-0':'Sir John Moore killed at Corunna. The Duke of York’s mistress examined at the bar of the House.',
  '1809-3':'The King’s Jubilee. The expedition to Walcheren dying of fever in the Dutch marshes.',
  '1810-3':'The Princess Amelia is dead, and the King’s mind has given way with grief.',
  '1811-0':'The Prince of Wales sworn in as Regent. Frame-breakers at work in Nottinghamshire.',
  '1811-2':'A great comet, with a tail like a peacock. The vintage in France is said to be superb.',
  '1812-1':'Mr Perceval, the Prime Minister, shot dead in the lobby of the House. War with America.',
  '1812-3':'Bonaparte has entered Moscow and found it on fire.',
  '1813-1':'Lord Wellington’s victory at Vitoria. King Joseph’s baggage taken, including his chamber pot.',
  '1813-2':'The greatest harvest in living memory. Corn falling at every market.',
  '1814-0':'The Thames frozen at London. An elephant led across the ice below Blackfriars.',
  '1814-1':'Bonaparte has abdicated and gone to govern the island of Elba.',
  '1815-0':'The Corn Bill before Parliament. Bonaparte has left Elba and landed in France.',
  '1815-1':'A great battle near Brussels, at a village called Waterloo.',
  '1815-3':'Bonaparte is landed on St Helena. Wheat at fifty-six shillings and the farmers ruined by plenty.'
};

// Quiet seasons. One is drawn when nothing else demands you.
const VIGNETTES = [
  [ // spring
    `A late frost. The blossom on the orchard wall goes brown overnight and Mrs Bunce takes it as an omen, though she declines to say of what.`,
    `In your pocket-book: “Rooks building in the tops of the Elms. Mudge says it is the Sign of a dry Summer. Gave him 0. 1. 0. We finished sowing Barley this Afternoon. Dinner to day, a boiled Leg of Mutton and Capers &c. Wind N.E. and cold.”`,
    `Lambing on the Down. The shepherd has not slept in a bed for three weeks and has begun to answer questions in the voice he uses for ewes.`,
    `The rent audit dinner. Eleven farmers eat a round of beef between them and each explains, separately, that he alone is being ruined.`,
    `In your pocket-book: “April 14. Heard the Cuckoo in the Copse about 7 this Morn’. To the Mole-catcher for his Quarter paid 0. 10. 6. He shewed me 41 Tails. Dinner to day, a Couple of Rabbits smothered with Onions, a Gooseberry Tart &c.”`
  ],
  [ // summer
    `Haymaking. The whole parish is in Kennet Meadow with rakes, and the beer goes out to them in buckets. By evening nobody can say with certainty whose child is whose.`,
    `In your pocket-book: “We washed 900 Sheep in the Lambourn to day. To the Washers, Beer, Bread and Cheese, and gave among them 0. 5. 0. The Shepherd stood to his Middle in the River from 6 till Noon. Sent him a Glass of Rum. Very hot. Wind S.”`,
    `In your pocket-book: “Hatherley played Kintbury on the Common for eleven Pair of Gloves. Kintbury beat us by 14 Notches. The Smith bowled. He hit the Wicket once and the Kintbury Long-stop three times. Lost to Mr. Hartopp on the Match 0. 10. 6.”`,
    `Three weeks without rain. The pond shrinks to a green plate and something is found in the middle of it that your uncle was known to have lost in 1771.`,
    `A travelling show at Wyvern exhibits a Learned Pig that tells the time and picks out the greatest rogue in the company. It picks out Crabbe. Crabbe laughs longest.`
  ],
  [ // autumn
    `Harvest home. The last load comes in with a boy on top of it dressed in ribbons, and you make the same speech your uncle made, because nobody would forgive a new one.`,
    `The gleaners are out on Long Barrow at first light, bent double, women and children in a line. A good gleaning family will carry home six bushels, and know to the ear who took more.`,
    `Wyvern Michaelmas Fair. Servants stand for hire in the market place: carters with whipcord in their hats, shepherds with a lock of wool, and one man with a turnip, whom nobody likes to ask.`,
    `In your pocket-book: “Octbr. 1. Out by 8 this Morn’ with Mudge and both Spaniels. We killed 4 Brace of Pheasants and a Hare. Three of the Birds fell over Mr. Hartopp’s Hedge. His Man came for them before we had loaded again. Let him have a Brace. Dinner to day, the Hare rosted.”`,
    `In your pocket-book: “Thick Mist in the Combe till 10. A great many Mushrooms on the Down. Mrs. Bunce made 11 Bottles of Catchup. Recd. of Farmer Dewey for half a Year’s Rent 62. 10. 0. Gave him back as usual 0. 2. 6. My Uncle always did.”`
  ],
  [ // winter
    `In your pocket-book: “Snow as high as the Hedge Tops. No Mail these 9 Days. Read Prayers in the Hall, the Church Path being stopped. Sent Widow Harris a Sack of Coals and 0. 2. 6. At Backgammon this Evening with H. lost 0. 1. 6. Bitter cold. Wind N.”`,
    `The mummers come to the Hall on Christmas Eve. Saint George is killed by the Turkish Knight and raised by the Doctor, who is the wheelwright, and drunk, and has to be raised himself.`,
    `In your pocket-book: “We killed two Pigs this Morn’. They weighed 16 Score the Pair. Sent a Spare-rib to the Vicarage and the Chitterlings to the Lodge. Gave the Pryor Children the Bladder. It was in the Carp Pond by 3 o’clock. Dinner to day, the Fry &c.”`,
    `A hard frost. The carp pond bears, and the footmen skate on it after dark when they think the house is asleep.`,
    `Plough Monday. The plough boys drag a plough from door to door, asking for pennies, and drawing a furrow across the gravel of anyone who refuses. Your gravel is spared, at a price.`
  ]
];

function fmt(n){ const a = Math.abs(Math.round(n)).toLocaleString('en-GB'); return (n < 0 ? '−' : '') + '£' + a; }
function clamp(v, a, b){ return Math.max(a, Math.min(b, v)); }
function pick(a){ return a[Math.floor(Math.random() * a.length)]; }
function chance(p){ return Math.random() < p; }
/* The engine: seasons, ledger, undertakings, and the reckoning. */
let S = null;
const SAVE_KEY = 'hatherley-combe-save-v1';

const F = k => S.flags[k];
function fl(k, v = true){ S.flags[k] = v; }
function add(d){ for (const k in d){ if (k === 'money') S.money += d[k]; else S[k] = clamp(S[k] + d[k], 0, 100); } }
function meet(id){ S.chars[id].met = true; }
function reg(id, n, note){ const c = S.chars[id]; c.met = true; c.r = clamp(c.r + n, -5, 5); if (note) c.notes.push(note + ', ' + S.year); }
function later(id, delay){ S.queue.push({id, at: S.t + delay}); }

function kittyRole(){ const k = S.flags.kitty || 'free';
  if (k === 'vane') return 'Mrs Vane, wherever the regiment is';
  if (k === 'pinch') return F('kittyWidow') ? 'Mr Pinch’s widow, and rich' : 'Mrs Pinch, at Clifton';
  if (k === 'oakes') return F('oakesVicar') ? 'Mrs Oakes, at the vicarage' : 'Mrs Oakes, over the schoolhouse';
  if (k === 'dubreuil') return 'Madame Dubreuil, near Saint-Malo';
  return 'Your daughter, ' + (17 + S.year - 1795) + (F('kittyBotanist') ? ', botanist' : ''); }
function edmundRole(){ const e = S.flags.edmund, y = S.year;
  if (F('edmundDead')) return 'Killed at Waterloo, June 1815';
  if (!e) return 'Your son, ' + (19 + y - 1795);
  if (e === 'army') return (F('major') ? 'Major' : y < 1800 ? 'Ensign' : y < 1807 ? 'Lieutenant' : 'Captain') + ', 52nd Foot';
  if (e === 'navy') return (y < 1801 ? 'Master’s mate' : y < 1811 ? 'Lieutenant' : 'Commander') + ', Royal Navy';
  if (e === 'church') return F('edmundVicar') ? 'Vicar of Hatherley' : y < 1800 ? 'Reading for orders at Oriel' : 'A curate in Hampshire, waiting';
  if (e === 'militia') return 'Captain, Berkshire Militia';
  if (e === 'farmer') return 'Farming Kennet Bottom';
  return 'At home, learning the estate'; }

  fourcourse:{ name:'Put the home farm under the Norfolk four-course', seasons:1, cost:() => F('hartoppFriend') ? 200 : 260,

  cottages:{ name:'Build six brick cottages on the Kintbury lane', seasons:2, cost:() => 360,

  oaks:{ name:'Plant forty acres of oak for the Navy', seasons:1, cost:() => 120,
    done:() => { fl('oaks'); add({standing:2}); return `Forty acres of acorns are dibbled in on Gallows Piece, for the wooden walls of England. They will be fit for ship timber in about the year 1920. You find this very restful to think about.`; }},
  icehouse:{ name:'Sink an ice-house in the north shrubbery', seasons:1, cost:() => 140,
    done:() => { fl('icehouse'); add({family:5}); reg('henrietta',1); return `The ice-house is sunk: a brick egg under a mound of earth. It is filled in January from the carp pond, and in July Henrietta serves a lemon ice to the Tamworths with the face of a general accepting a surrender.`; }}
};
function startProject(id){ const p = PROJECTS[id]; const cost = p.cost(); S.project = {id, left:p.seasons, per:Math.round(cost / p.seasons)}; S.projectsDone[id] = 'begun'; }

function newGame(first, sur){
  S = { name:(first + ' ' + sur).trim(), sur, t:0, year:FIRST_YEAR, season:0, phase:'ledger',
    money:900, mortgage:4000, standing:40, goodwill:50, family:60,
    improve:0, rentPolicy:1, rentAdj:1, poorMult:1, game:3, canal:0, yearIncome:0,
    flags:{}, chars:{}, queue:[], seen:{}, journal:[], project:null, projectsDone:{}, dead:null,
    ledger:[], notes:[], pending:null, vignette:null, outcome:null, priceSeen:[] };
  for (const id in PEOPLE) S.chars[id] = {r:PEOPLE[id].r, met:PEOPLE[id].met, notes:[]};
  beginSeason();
}

function halfRent(){ return 810 * S.rentPolicy * S.rentAdj * (1 + 0.05 * S.improve) * (F('enclosed') ? 1.3 : 1); }

function beginSeason(){
  const y = S.year, q = S.season, P = PRICES[y], pi = P / 75;
  const L = []; S.notes = [];
  const line = (label, amt) => { amt = Math.round(amt); if (amt) { L.push([label, amt]); S.money += amt; } };
  if (q === 0) { S.yearIncome = 0; if (!S.priceSeen.includes(y)) S.priceSeen.push(y); }
  if (q === 0 && [1800, 1805, 1810].includes(y)) { S.rentAdj *= 1.12; S.notes.push('Leases fallen in have been re-let at war prices. The rental rises by an eighth.'); }
  if (q === 0 || q === 2) {
    let a = (S.rentPolicy - 1) * 0.7 + Math.max(0, 0.95 - pi) * 0.5 + (45 - S.goodwill) / 350;
    if (S.t >= 79 && !F('abated')) a += F('abatedHalf') ? 0.1 : 0.22;
    a = clamp(a, 0, 0.5);
    const due = halfRent(), got = due * (1 - a);
    line(QUARTER[q] + ' rents received', got); S.yearIncome += got;
    if (a > 0.04) S.notes.push('Rents in arrear this half-year: ' + fmt(due - got) + '.');
    if (S.rentPolicy > 1) add({goodwill:-4}); else if (S.rentPolicy < 1) add({goodwill:2});
  }
  if (q === 1) { const w = 100 + (F('merino') ? (y < 1811 ? 110 : 15) : 0) + (F('merinoRam') ? 15 : 0); line('The wool clip', w); S.yearIncome += w;
    if (F('merino') && y === 1811) S.notes.push('The merino mania has burst. Rams bought at forty guineas go to the butcher at forty shillings.'); }
  if (q === 2) { const qtrs = Math.round(140 * WEATHER[y] * (1 + 0.06 * S.improve)); const v = qtrs * P / 20; line('Home farm wheat, ' + qtrs + ' qrs at ' + P + 's.', v); S.yearIncome += v; }
  if (S.canal && y >= 1810) { line('Kennet & Avon dividend', 7 * S.canal); }
  line('Household, stables and servants', -((280 + S.standing * 1.6) * (1 + 0.022 * (y - 1795)) - (F('bricked') ? 3 : 0)));
  if (S.mortgage > 0) line('Interest on the mortgage', -S.mortgage * (F('cheapCredit') ? 0.04 : 0.05) / 4);
  if (F('wages')) line('Home farm wages above the common rate', -30);
  if (F('crabbeSkims') && !F('crabbeGone')) line('“Sundries” (Mr Crabbe)', -45);
  if (F('mp') && q === 0) line('Lodgings in Half Moon Street for the session', -160);
  if (S.project) { line(PROJECTS[S.project.id].name, -S.project.per); S.project.left--;
    if (S.project.left <= 0) { const id = S.project.id; S.project = null; S.projectsDone[id] = 'done'; S.notes.push(PROJECTS[id].done()); } }
  if (q === 3) {
    line('Poor rate', -130 * S.poorMult * pi * (F('speen') ? 1.6 : 1));
    line('Land tax', -110);
    if (y >= 1799 && y !== 1802) { const rate = y <= 1801 ? 0.1 : y <= 1805 ? 0.05 : 0.1; line('Income tax at ' + (rate * 100) + ' per cent', -S.yearIncome * rate * (F('taxDodge') ? 0.5 : 1)); }
  }
  if (S.money < 0) { line('Interest on tradesmen’s bills and notes of hand', S.money * 0.03); add({standing:-1}); S.notes.push('You are living on credit. Wyvern has noticed.'); }
  // Nothing keeps without tending: regard, like a hedge, grows out.
  if (S.t > 0) { const dear = P >= 95 && !F('soup') && !F('wages');
    add({standing: S.standing > 60 ? -2 : -1, goodwill: (S.goodwill > 60 ? -2 : -1) - (dear ? 1 : 0), family: S.family > 60 ? -2 : -1});
    if (dear && q === 3) S.notes.push('Bread at famine price. The parish looks at the Hall, and counts its chimneys.'); }
  S.ledger = L;
  S.news = NEWS[y + '-' + q] || null;
  S.pending = pickEvent();
  S.vignette = S.pending ? null : pick(VIGNETTES[q]);
  S.phase = 'ledger';
  if (S.money < -3000) { S.dead = 'ruin'; }
  save();
}

const FIXED = {};
function indexEvents(){ for (const e of EVENTS){ if (e.fixed) for (const k of [].concat(e.fixed)) (FIXED[k] = FIXED[k] || []).push(e); } }
const lab = c => typeof c.t === 'function' ? c.t() : c.t;
const byId = id => EVENTS.find(e => e.id === id);

function pickEvent(){
  const due = S.queue.filter(x => x.at <= S.t);
  for (const d of due){ S.queue.splice(S.queue.indexOf(d), 1); const e = byId(d.id); if (e && (!e.cond || e.cond())) { S.queue.forEach(x => { if (x.at <= S.t) x.at = S.t + 1; }); return e.id; } }
  const fx = FIXED[S.year + '-' + S.season];
  if (fx) for (const e of fx) if (!e.cond || e.cond()) return e.id;
  if (!chance(0.8)) return null;
  const pool = EVENTS.filter(e => !e.fixed && !e.follow && S.year >= (e.from || 0) && S.year <= (e.to || 9999)
    && (S.seen[e.id] === undefined || (e.repeatGap && S.t - S.seen[e.id] >= e.repeatGap)) && (!e.cond || e.cond()));
  if (!pool.length) return null;
  let tot = pool.reduce((a, e) => a + (e.weight || 1), 0), r = Math.random() * tot;
  for (const e of pool){ r -= (e.weight || 1); if (r <= 0) return e.id; }
  return pool[0].id;
}

function snapshot(){ const c = {}; for (const id in S.chars) c[id] = S.chars[id].r; return {money:S.money, standing:S.standing, goodwill:S.goodwill, family:S.family, c}; }
function deltas(b){ const out = [];
  const dm = Math.round(S.money - b.money); if (dm) out.push(['Purse ' + (dm > 0 ? '+' : '') + fmt(dm).replace('−', '−'), dm > 0]);
  for (const [k, label] of [['standing','Standing'],['goodwill','Goodwill'],['family','Household']]){ const d = S[k] - b[k]; if (d) out.push([label + (d > 0 ? ' rises' : ' falls') + (Math.abs(d) >= 8 ? ' sharply' : ''), d > 0]); }
  for (const id in S.chars){ const d = S.chars[id].r - b.c[id]; if (d) out.push([PEOPLE[id].name + (d > 0 ? (d > 2 ? ' is won over' : ' warms') : (d < -2 ? ' will not forget this' : ' cools')), d > 0]); }
  return out; }

function stamp(){ return SEASONS[S.season] + ' ' + S.year; }

function choose(i){
  const e = byId(S.pending); const ch = e.choices.filter(c => !c.if || c.if())[i]; const b = snapshot(); const did = lab(ch);
  S.seen[e.id] = S.t;
  const text = ch.go();
  S.journal.unshift({when:stamp(), title:e.title, did});
  S.outcome = {title:e.title, text, d:deltas(b)}; S.phase = 'outcome'; save(); render();
}

const UNDERTAKINGS = [
  { id:'ride', t:'Ride round the tenancies', hint:'Goodwill', go:() => { add({goodwill:4}); return pick([
      `You ride the eleven farms in a day and a half and are given, in order: cider, perry, a cold pie, more cider, advice about your horse, and a dog you did not ask for.`,
      `At Kennet Bottom the Widow Harris shows you the place where her roof lets in the rain, and then, that there may be no mistake, the rain. You promise a thatcher. She looks at you as one who has been promised thatchers before.`,
      `A wet week in the saddle learning the names of children. By Friday you have thirty-one, three of whom were christened after your uncle, which tells you something about your uncle.`,
      `You walk the bounds of Starveall with its tenant, who points out every gate that wants hanging and describes each as “your gate, sir”. The hedges, which are in good order, are “my hedges”.`]); }},
  { id:'dine', t:'Dine the county', note:'£70', hint:'Standing', go:() => { add({money:-70, standing:4}); return pick([
      `Three removes for sixteen. The Bishop’s chaplain eats like a man provisioning for a siege. Lady Cullerne calls your turbot “very brave”, and you lie awake wondering what she meant.`,
      `Dinner at the Tamworths’, at the Lovedays’, at Hartopp’s, and then at your own table, where Mrs Bunce sends up a haunch hung until it can very nearly speak. The county pronounces it excellent. The county has no sense of smell.`,

  { id:'sessions', t:'Sit on the bench at Quarter Sessions', hint:'Standing', go:() => { const g = pick([-2, 0, 2, 3]); add({standing:3, goodwill:g}); return pick([
      `You sentence a man to be whipped for stealing a goose and a woman to a month for stealing it back from him. The goose is produced in evidence, and bites the clerk.`,
      `A bastardy case, in which three men of Kintbury are each named as the father, and each swears upon oath that it was one of the other two. You order all three to pay. It is as near to justice as you will come this year.`,
      `A long day in the Shire Hall deciding who must mend a bridge that every parish in the hundred says belongs to the next. By evening it is settled that the bridge belongs to no one, which is what the bridge has always suspected.`,
      `You license eleven alehouses, refuse a twelfth, and remove a pauper to the parish of her birth, forty miles off, where they will prove that she was born in a wagon and send her back.`]); }},
  { id:'home', t:'Keep at home with the family', hint:'Household', go:() => { add({family:5}); const a = [
      `You stay at home and play backgammon with Henrietta, who cheats with such grace that you would not stop her for the world.`,
      `A week of wet afternoons in the library. You read Tom Jones for the sixth time; Henrietta nets a purse, and tells you between rows what is wrong with every family in Berkshire, beginning with the As.`,
      `You teach the dogs nothing, shoot nothing, decide nothing, and enjoy it more than anything since Christmas.`];
      if ((S.flags.kitty || 'free') === 'free') a.push(`Kitty reads Mrs Radcliffe aloud after dinner, doing all the voices. The wicked monk sounds exactly like ${F('gallDead') ? 'the late Dr Gall' : 'Dr Gall'}. Nobody remarks on it and everybody notices.`);
      return pick(a); }},
  { id:'town', t:'Go up to London for the Season', note:'£350', hint:'Standing, Household', if:() => S.season === 0, go:() => { add({money:-350, standing:6, family:4}); reg('henrietta',1); return pick([
      `A house in Upper Brook Street for ten weeks. You see Mrs Siddons as Lady Macbeth and are afraid of her for a fortnight. Henrietta is presented at a Drawing Room, in hoops and feathers, and comes home walking sideways out of habit.`,
      `London. You are jostled at the Opera, overcharged at Tattersall’s, and cut by a duke who mistook you for somebody else and, on finding out, cut you again in your own right. Henrietta has never been happier.`,
      `Ten weeks of routs, at which three hundred people stand on a staircase for two hours, in order to say that they were there. You say that you were there. It was very hot.`]); }},
  { id:'retrench', t:'Retrench', note:'+£130', hint:'Costs Standing and Household', go:() => { add({money:130, standing:-3, family:-3}); return pick([
      `You sell the second carriage, two hunters, and the claret your uncle laid down against a christening that never happened. Henrietta calls it “living like curates”, in a voice which suggests she has seen how curates live, and blames you for that too.`,
      `One footman is let go, the hot-house fires are put out, and the family dines on mutton four days in seven. The pine-apples die. Mrs Bunce wears black for them.`,
      `You shut up the east wing and sell the timber in Cuckoo Copse. The woodmen are a month about it, and the rooks, turned out, sit on the Hall roof and discuss you.`]); }}
];

function undertakingOptions(){
  const o = UNDERTAKINGS.filter(u => !u.if || u.if()).map(u => ({t:u.t, note:u.note, hint:u.hint, run:() => { const r = u.go(); return r; }}));
  if (!S.project) for (const id in PROJECTS){ const p = PROJECTS[id]; if (p.hidden || S.projectsDone[id]) continue;
    o.push({t:p.name, note:fmt(p.cost()) + (p.seasons > 1 ? ' over ' + p.seasons + ' seasons' : ''), hint:'A work', project:true, run:() => { startProject(id); return `The work is put in hand. ${F('crabbeGone') ? 'Lark' : 'Crabbe'} draws up the estimate in his best copperplate, and you sign it without reading the second page, as is traditional.`; }}); }
  return o;
}
function undertake(i){ const u = undertakingOptions()[i]; const b = snapshot(); const text = u.run();
  S.journal.unshift({when:stamp(), title:'The season’s undertaking', did:u.t});
  S.outcome = {title:u.t, text, d:deltas(b)}; S.phase = 'undone'; save(); render(); }

function next(){
  if (S.phase === 'ledger') { if (S.dead) return finish(); S.phase = S.pending ? 'event' : 'undertake'; }
  else if (S.phase === 'outcome') { if (S.dead) return finish(); S.phase = 'undertake'; }
  else if (S.phase === 'undone') { S.t++; if (S.t >= (LAST_YEAR - FIRST_YEAR + 1) * 4) return finish(); S.year = FIRST_YEAR + Math.floor(S.t / 4); S.season = S.t % 4; beginSeason(); }
  save(); render(); window.scrollTo({top:0, behavior:'smooth'});
}
function finish(){ S.phase = 'end'; save(); render(); window.scrollTo({top:0}); }

function setRent(v){ S.rentPolicy = v; save(); render(); }
function mortgage(d){ if (d < 0 && S.money >= 500 && S.mortgage >= 500) { S.mortgage -= 500; S.money -= 500; } if (d > 0 && S.mortgage < 9000) { S.mortgage += 500; S.money += 500; } save(); render(); }

/* ---------- the reckoning ---------- */
function reckoning(){
  const net = S.money - S.mortgage, k = S.flags.kitty || 'free', e = S.flags.edmund, P = [];
  if (S.dead === 'duel') { P.push(`DIED, on Thursday last, on Hatherley Down, by the visitation of a pistol ball, ${S.name}, Esquire, of Hatherley Combe in this county, in the ${S.year - 1795 + 46}th year of his age. The coroner’s jury, composed of gentlemen who understood the matter perfectly, returned a verdict of misadventure while shooting rooks.`);
    P.push(`Captain Vane has gone abroad for his health. The deceased is succeeded in his estates by his widow, who is said to have remarked that she had always told him so.`);
    return {title:'Shot at Dawn', P, score:null}; }
  if (S.dead === 'ruin') { P.push(`TO BE SOLD BY AUCTION, by Mr Skinner, at the George Inn, Wyvern: the capital freehold estate of HATHERLEY COMBE, comprising a mansion house of fifty-four windows, eleven farms, a water corn mill${F('enclosed') ? ', and four hundred acres of newly enclosed land' : ', with rights over an extensive common'}; by order of the mortgagees.`);
    P.push(`${S.name}, Esquire, late of that place, is understood to have removed with his family to Douglas, in the Isle of Man, where the King’s writ for debt does not run, and where he may be seen most mornings on the pier, looking at England.`);
    P.push(`The principal purchaser is expected to be the Earl of Cullerne.`);
    return {title:'Sold Up', P, score:null}; }

  P.push(`${S.name}, Esquire, has now held Hatherley Combe one-and-twenty years, and the county, which was not consulted at the time, has had leisure to form a view.`);
  P.push(net > 4000 ? `He is richer than his uncle was, which nobody had thought possible and several think indecent. The estate stands clear by some ${fmt(net)}.`
    : net > -1500 ? `His affairs balance, more or less, in the way that a man balances on a gate. Set the mortgage against the purse and there is ${net >= 0 ? fmt(net) + ' to the good' : fmt(-net) + ' wanting'}, which for a landed gentleman at the end of a great war is a species of triumph.`
    : `His debts are spoken of in Wyvern with something approaching awe: ${fmt(-net)} at the last computation, secured upon every acre, and Mr Tidmarsh’s successors are observed to raise their hats to him rather lower each year, as to a monument.`);
  P.push(S.goodwill >= 68 ? `In Hatherley, where memories are long and patience short, he is called a fair man, which is the highest thing they say there of anybody not yet dead.`
    : S.goodwill >= 42 ? `In Hatherley he is thought no worse than most and better than some. They touch their hats and mean about half of it, which is the customary proportion.`
    : `In Hatherley they have a song about him. It has nine verses and is not sung when he is in the room.`);
  if (F('enclosed')) P.push(F('allotments') ? `He enclosed the common, and left every cottage its acre; the cottagers, weighing the acre against the common, have decided to remember both.` : `He enclosed the common. The hedges are grown up now, and children are being born in the parish who do not know there was ever anything there but fields. Their grandmothers tell them.`);
  else P.push(`Hatherley Common lies open still, to the grief of every improver in Berkshire and the satisfaction of some forty cows.`);
  if (F('speen')) P.push(`He was of the party at the Pelican in the year ’95, and may live to hear the Speenhamland scale cursed by the men who pay it and the men who draw it, with equal warmth.`);
  if (F('wages')) P.push(`He paid his labourers nine shillings when his neighbours paid seven, and has been forgiven it by almost all of them.`);
  P.push(S.standing >= 70 ? `Among the gentry he is a man of weight. Lord Cullerne calls him “a coming man”, though he has been coming these twenty years.`
    : S.standing >= 40 ? `Among the gentry he is received everywhere and consulted nowhere, an enviable condition.`
    : `Among the gentry he is asked to large parties.`);
  if (F('mp')) P.push(`He sits for the borough of Wyvern, and has spoken in the House twice, once by mistake.`);
  // children
  const kl = {vane:`His daughter is Mrs Vane, ${F('kittySettled') ? 'living at Northampton on forty pounds a year that her husband cannot touch, which is the only circumstance in the marriage anybody praises' : 'and follows the Captain from garrison to garrison, one town ahead of his creditors'}.`,
    pinch:F('kittyManumit') ? `His daughter, the widow of Mr Pinch of Bristol, gave freedom to three hundred persons in Jamaica at the cost of most of her fortune, and is thought in Clifton to be out of her mind and in Hatherley to be the pick of the family.` : F('kittyWidow') ? `His daughter is the widow of Mr Pinch of Bristol, and very rich. She does not speak of how.` : `His daughter is Mrs Pinch, of Clifton, and has everything that money can buy her.`,
    oakes:`His daughter married the ${F('oakesVicar') ? 'vicar, who was then the curate' : 'curate, who is the curate still'}. She has five children, no carriage, and the look of a woman who was right.`,
    dubreuil:`His daughter is Madame Dubreuil, of Saint-Malo, and keeps bees. The county has almost forgiven it.`,
    free:F('kittyBotanist') ? `His daughter is unmarried, and has an orchid named for her in Sowerby’s Botany, which is more than can be said for the Miss Tamworths.` : `His daughter is unmarried and lives at home. She is thirty-eight. She is very good with the dogs.`};
  P.push(kl[k]);
  if (F('edmundDead')) P.push(`His son, ${F('major') ? 'Major' : 'Captain'} ${S.sur} of the 52nd, lies in the orchard of a farm in Brabant, with a great many others. There is a tablet in Hatherley church. His mother has had the pew moved so as to face it.`);
  else if (e === 'army') P.push(`His son, ${F('major') ? 'Major' : 'Captain'} ${S.sur}, ${S.flags.edmundFate || 'served through the Peninsula'}, and is home, on half-pay, teaching the Volunteers’ old serjeant how the thing is really done.`);
  else if (e === 'navy') P.push(`His son commands a sloop of war, at present laid up, there being nobody left to fight, and is ashore at Hatherley walking the terrace eight paces each way from habit.`);
  else if (e === 'church') P.push(F('edmundVicar') ? `His son is vicar of the parish, and preaches short.` : `His son is in orders, in Hampshire, and writes on Sundays.`);
  else if (e === 'farmer') P.push(`His son farms Kennet Bottom better than it has ever been farmed, and has given him three grandchildren, one of whom bites.`);
  else if (e === 'militia') P.push(`His son came home from the Militia a captain, with a straight back and an Irish wife.`);
  else P.push(`His son is at home still. He is forty, and manages everything, and is waiting.`);
  if (F('oaks')) P.push(`He planted forty acres of oak on Gallows Piece for the Royal Navy. It will be ready when the Navy, by all appearances, has gone over to iron.`);
  if (F('soldLiving')) P.push(`He sold the living of Hatherley to a wine merchant, and the Bishop has not dined with him since.`);
  if (F('vaccinated')) P.push(`There has been no smallpox in the parish these ten years, since he sat on a kitchen chair on the green and had his arm scratched before them all.`);
  if (F('soup')) P.push(`The old people still judge every soup they are given against the soup of 1800.`);
  if (F('hoarder')) P.push(`It is remembered in the cottages that his wheat left the parish in three wagons, in the dearth, in daylight.`);
  if (S.chars.pryor.r >= 3) P.push(`Jem Pryor, who has taken game off the estate for thirty years, has let it be known that anyone else who tries it will answer to him.`);
  else if (S.chars.pryor.r <= -3) P.push(`Jem Pryor has not been seen in the parish lately. Neither have a good many of the pheasants.`);
  if (F('cornFor')) P.push(`He put his name to the Corn Bill, and the loaf is dear.`);
  if (F('cornAgainst')) P.push(`He set his name against the Corn Bill, almost alone among the landed gentlemen of the county, and has been “the Loaf” at Cullerne Castle ever since.`);

  let score = Math.round(S.standing * 0.25 + S.goodwill * 0.4 + S.family * 0.35 + clamp(net / 400, -12, 12));
  score = clamp(score, 0, 100);
  let title = 'A Tolerable Squire';
  if (S.goodwill >= 68 && S.family >= 55) title = 'The Good Squire of Hatherley';
  else if (net > 8000 && S.goodwill < 36) title = 'The Rack-Renter';
  else if (S.standing >= 72 && S.goodwill < 50) title = 'A Coming Man';
  else if (S.goodwill < 30) title = 'The Man in the Song';
  else if (S.family < 30) title = 'Master of an Empty House';
  else if (S.goodwill >= 60) title = 'A Fair Man';
  P.push(`He is ${S.year - 1795 + 46}, and in tolerable health. He has been heard to say that the next twenty years cannot possibly be as troublesome as the last. We wish him joy of the opinion.`);
  return {title, P, score};
}

function wipe(){ try { localStorage.removeItem(SAVE_KEY); } catch (err) {} S = null; render(); }
/* The fixed calendar: what history brings to the door, and when. */
const EVENTS = [];
const ev = e => EVENTS.push(e);
const K = () => S.flags.kitty || 'free';
const E = () => S.flags.edmund || null;
const kittyAge = () => 17 + (S.year - 1795);

ev({ id:'speen', fixed:'1795-0', title:'The Pelican at Speen',
  text:() => `The Pelican at Speen, the sixth of May. The Berkshire bench sits down to a turbot.

The business is on a half-sheet beside each plate. Wheat is at seventy-five shillings. The quartern loaf is elevenpence in Newbury market. A labourer in this county has eight shillings a week. Dr Gall waits until the fish has been carried out before he stands.

“Gentlemen, I shall not ask the farmer for a penny. Let wages lie. Let the parish make each family up from the rates, by a table. When the gallon loaf is a shilling, three shillings to the man and eighteenpence to every mouth he feeds. When the loaf rises, the table rises.” He holds his paper out over the cloth. “Who is with me?”

Nobody moves. The Doctor turns his whole body in his chair until it faces you.

“Mr ${S.sur}?”`,
  choices:[
    {t:'Second him.', go:() => { fl('speen'); add({goodwill:4, standing:1}); reg('gall',2,'You seconded his bread scale at Speen');
      return `“Seconded.” The show of hands takes less time than the carving did. A clerk is called in to copy the table fair for the Reading Mercury.

Hartopp has a pencil out before the cheese comes. He writes on the back of his half-sheet, turns it round and pushes it across to you. “Parish makes a man up to 9s. I pay him 6s. Parish finds 3s.” Under that he has drawn a line. Under the line: “Why pay 6?”

Your name goes to Reading second on the list.`; }},
    {t:'Stand. Move that the bench fix a wage by the price of bread, and pay it at Hatherley yourself.', go:() => { fl('wages'); add({goodwill:9, standing:-3}); reg('gall',-1); reg('hartopp',-1,'Thinks your wages will ruin him'); reg('pryor',1);
      return `You stand. You say the bench has power under the statute of Elizabeth to fix a wage. You say it should fix one by the price of bread. You say the farmer who hires a man should be the one to feed him.

“Ruin,” says Hartopp. Somebody asks whether Mr ${S.sur} holds shares in Whitbread’s brewery. Dr Gall puts it to the vote out of politeness. Three hands go up.

On Monday you raise every man at Hatherley to nine shillings. On Sunday there are faces in church from Kintbury and Inkpen that you have never seen there before. They have walked over to look at you.`; }},
    {t:'Help yourself to the turbot.', go:() => { add({goodwill:-3, standing:1});
      return `You help yourself to the turbot. The table is carried round you.

Afterwards, in the yard, your horse is brought by an ostler you do not know. The taproom window stands open behind him. He holds the stirrup. He does not touch his hat until you are in the saddle and looking down at him.`; }}
  ]});

ev({ id:'flour', fixed:'1795-1', title:'The Old Price',
  text:() => `Wyvern, market day. You hear it from the bridge.

Pocock’s cart is stopped in the corn market with its tailboard down. A dozen Hatherley women have his sacks open on the cobbles. Sukey Pryor has the peck measure in one hand and her youngest on her hip. “Old price! Old price and honest measure!” A girl of ten takes the money. She carries each coin across to the miller and drops it into his hat.

Pocock holds the hat in both hands. He has not put it down and he has not put it on. He sees you over the heads. “Mr ${S.sur}! You are a magistrate, sir! I call on you!”

The selling stops. Sukey Pryor looks at you. She does not put down the measure.`,
  choices:[
    {t:'Read the Riot Act and send for the Volunteers.', go:() => { fl('riotAct'); add({standing:3, goodwill:-10}); reg('pryor',-2,'You read the Riot Act at his wife'); reg('gall',1);
      return `You climb the steps of the Corn Exchange and take off your hat. “Our Sovereign Lord the King chargeth and commandeth all persons, being assembled, immediately to disperse themselves.” It is done in under a minute. Your voice cracks on “habitations”.

They have one hour by law. Nobody goes. The selling starts again, faster. You stand on the steps for fifty minutes with the Act in your hand.

The Volunteers trot in at ten minutes to the hour. The cobbles are white. The sacks are folded on the cart. Pocock is counting. Sukey Pryor walks past the steps with her flour on her head and the child asleep. “Good day, sir.” Nobody else from Hatherley says it to you that week.`; }},
    {t:'Buy the whole cart yourself and let them carry on.', note:'£140', go:() => { add({money:-140, goodwill:8, standing:-2}); reg('cullerne',-1,'Thinks you bought off a mob'); reg('pryor',1,'You paid for his wife’s flour');
      return `“What is the load worth today, Pocock?” He tells you. “And at the old price?” He tells you that too. You write him a draft on Tidmarsh’s bank for the difference. One hundred and forty pounds.

Pocock folds it small and puts it inside his coat. He does not thank you. The women do, three cheers, and then they go back to the sacks.

Lord Cullerne’s groom is outside the George holding a horse. He has watched all of it. He will be at the Castle before you are home.`; }},
    {t:'Take Pocock aside and mention his lease.', go:() => { fl('millerCowed'); add({goodwill:4, standing:1});
      return `You get down and take Pocock by the elbow. Ten yards off, by the pump, you ask him when his lease falls in.

“Michaelmas, sir.”

“So I thought. It is a pretty mill.”

He looks at the pump for some time. Then he walks back to his cart. “Old price,” he tells the women. “This week. Out of Christian feeling.” He says it a second time, louder.

That evening he drives home past your gate. He keeps his eyes on the horse.`; }}
  ]});

ev({ id:'powder', fixed:'1795-2', title:'A Guinea a Head',
  text:() => `The collector’s paper comes with the morning post. “Certificate for Using Hair Powder. One Guinea.” One certificate for every powdered head in the house.

You count heads at breakfast. Henrietta has worn powder every day since she was twelve. Edmund has not had his hair dressed for a week. He wants it cut short, the way the Duke of Bedford’s friends are wearing it. The two footmen stand by the sideboard. Both are called John. Both are white to the collar.

Henrietta puts down her cup. “Well?”`,
  choices:[
    {t:'Pay for every head in the house, footmen and all.', note:'8 guineas', go:() => { add({money:-9, standing:3, family:2}); reg('henrietta',1);
      return `You send to Wyvern with eight guineas. Eight certificates come back.

On Sunday the names are pasted on the church door, by order. Yours is at the top. The footmen are at the bottom, entered as “John” and “John”.

The Morning Chronicle has a name for people who pay. Edmund reads it out at dinner. “Guinea-pigs.” Henrietta asks him to leave the table.`; }},
    {t:'Crop the lot of you.', go:() => { add({family:-4, standing:-2}); reg('henrietta',-2,'You cropped her footmen'); reg('edmund',1); reg('cullerne',-1); reg('hartopp',1);
      return `The barber walks up from Wyvern with his scissors. He does Edmund first, then you, then the Johns in the scullery. He sweeps up enough hair to stuff a bolster and asks if he may keep it.

Edmund spends the afternoon in front of the hall glass. Hartopp rides over, looks at you and says, “Sensible.” On Thursday Lord Cullerne passes you in Wyvern and does not seem to know you.

Henrietta has her dinner sent up for three days. On the fourth she comes down in a turban.`; }},
    {t:'Pay for Henrietta. Shear everyone else.', note:'1 guinea', go:() => { add({money:-1, family:1});
      return `One guinea. One certificate. “Mrs ${S.sur}, Hatherley Combe.”

The barber shears the rest of you on Saturday. The younger John cries in the scullery. Mrs Bunce gives him a jam tart.

At church Henrietta sits at the end of the pew with her head high and white. Everybody else in the pew has cold ears.`; }}
  ]});

ev({ id:'fenn', fixed:'1795-3', title:'A Citizen at the Bell',
  text:() => `There is a new man at the Bell. Absalom Fenn, shoemaker, walked down from London with a pack on his back. The pack is full of pamphlets.

Every evening at seven he stands on a settle and reads Tom Paine to the carters. He reads slowly. He stops at the long words and tells them what each one means.

Crabbe has been down to look. He stands in your library with his notebook open. “The new Act says fifty, sir. Fifty persons at a political meeting, and they must have a magistrate’s licence. I counted forty-nine. I counted on three nights.” He turns a page. “Forty-nine each night. The fiftieth waits in the yard.”`,
  choices:[
    {t:'Have Fenn taken up as a seditious person.', go:() => { fl('fennTaken'); add({standing:3, goodwill:-5}); reg('gall',2,'You gaoled the shoemaker'); reg('cullerne',1);
      return `The constable takes Fenn at the Bell on Friday, off the settle, with the book in his hand. He goes to Reading gaol in the carrier’s cart. Dr Gall shakes your hand after church.

The evidence is forty-nine men and a printed book. The Grand Jury throws it out.

Fenn walks back into Hatherley on a Tuesday. The carters stand him his beer. A boy asks him what “seditious” means. He climbs on the settle and tells them.`; }},
    {t:'Go down to the Bell and argue with him.', go:() => { fl('fennDebate'); add({goodwill:5, standing:-2}); reg('cullerne',-1); reg('pryor',1,'Saw you argue with Fenn and pay for the beer');
      return `You walk down to the Bell at seven and take the chair by the fire. Fenn nods to you and goes on reading. When he stops, you answer him.

You give them the Constitution. King, Lords and Commons. Fenn gives them your uncle: his rents, his game, his three votes in Wyvern, the year he stopped the footpath to the mill. He has every date.

It lasts two hours. The carters decide for Fenn. You pay for the beer, all forty-nine pots. Jem Pryor lifts his to you from the corner.`; }},
    {t:'Buy every copy of Paine in Wyvern and burn them.', note:'£15', go:() => { add({money:-15, standing:1});
      return `Mr Gosling the bookseller has nineteen copies of the Rights of Man. He asks fifteen pounds for the lot. You pay it.

You burn them on the green on Saturday night. Most of the parish comes. Fenn comes too and warms his hands.

On Monday Gosling’s boy is at the coach office with a letter for London. The order is for forty copies.`; }}
  ]});

ev({ id:'edmundFuture', fixed:'1796-0', title:'Edmund Wishes to Be Useful',
  text:() => `Edmund has the Gazette propped against the coffee pot. He has stopped eating.

“General Bonaparte is twenty-six, sir. He has beaten the Austrians twice in one week.”

“And how old are you?”

“Twenty.” He folds the paper. “I should like a commission.”

Henrietta sets down the teapot. “Dr Gall is an old man. The living is in your father’s gift. Three hundred a year and the vicarage, Edmund. You could ride over to dinner.”

They both look at you.`,
  choices:[
    {t:'Buy him an ensigncy in the 52nd Foot.', note:'£450', go:() => { fl('edmund','army'); add({money:-450, family:-1}); reg('edmund',3,'You bought him his colours'); reg('henrietta',-2,'You sent her son to the wars');
      return `Four hundred and fifty pounds to Mr Cox, the army agent in Craig’s Court. The Gazette prints it a month later. “52nd Foot. Edmund ${S.sur}, Gent., to be Ensign, by purchase.”

The coat comes from London in a box. Edmund puts it on in the hall. He looks at it in the drawing-room glass. He looks at it in the glass on the stairs. Mrs Bunce finds him in the dairy, in front of the small square one.

Henrietta does not come down to see it.`; }},
    {t:'Write to Captain Holloway for a berth in his frigate.', go:() => { fl('edmund','navy'); add({family:-1}); reg('edmund',2,'You got him to sea'); reg('henrietta',-2,'You sent her son to sea');
      return `You write to Captain Holloway of the Thetis, thirty-two guns. He served with your uncle.

The answer comes from Portsmouth in a week. “Sir, Send him. He is six years too old and will be ordered about by children. Good. Holloway.”

Edmund reads it three times. He packs that night. Henrietta sews his name into eleven shirts. She does not speak to you while she does it.`; }},
    {t:'Steer him into the Church.', go:() => { fl('edmund','church'); add({family:1}); reg('edmund',-3,'You steered him into the Church'); reg('henrietta',3); reg('gall',-1,'Dislikes being reminded he is mortal');
      return `Edmund goes up to Oriel to read for orders. He shakes your hand at the coach door. He does not look at you.

He writes every Sunday. The weather in Oxford. The text of the sermon. His duty to his mother. Each letter covers one side exactly.

Henrietta keeps them in her work-box. Dr Gall has heard why the boy was sent. He stops you at the vestry door and asks whether you find him looking ill.`; }},
    {t:'Keep him at home to learn the estate.', go:() => { fl('edmund','home'); add({family:2}); reg('edmund',-1); reg('henrietta',2);
      return `“You will stay here and learn the estate.”

“Yes, sir.”

He rides the farms. He learns a sound ewe from a rotten one. He learns which tenants pay and which explain. Henrietta has his chair moved nearer hers at dinner.

In the evenings he is in the gun room. You look in at eight. He is cleaning a fowling piece. You look in at ten. It is the same fowling piece. The Gazette is open on the bench beside him.`; }}
  ]});

function electionWin(){ return chance(clamp(0.3 + (S.standing - 40) / 110 + (S.goodwill - 50) / 250, 0.1, 0.85)); }

ev({ id:'election96', fixed:'1796-1', title:'Burgage Votes',
  text:() => `A cart from Cullerne Castle is at the kitchen door. In it, under a cloth, is a haunch of venison. The groom has a note.

“Lord Cullerne’s compliments to Mr ${S.sur}. Parliament is dissolved. His lordship’s nephew, Mr Fitzroy Bligh, offers himself for Wyvern. His lordship feels sure of Mr ${S.sur}’s three votes.”

Wyvern returns two Members. The votes go with thirty-one old burgage plots in the town. Most have pigs on them now. Lord Cullerne owns fourteen. Your uncle bought three.

The groom is waiting. Mrs Bunce has her hand on the haunch.`,
  choices:[
    {t:'Eat the venison. Vote for Fitzroy.', go:() => { fl('cullerneMan'); add({standing:3}); reg('cullerne',3,'You ate his venison and voted his nephew in');
      return `“Thank his lordship.” Mrs Bunce carries the haunch inside.

There is no poll. Mr Fitzroy Bligh is declared at the Town Hall at noon. He thanks the electors in four sentences. He reads all four from a card.

On Friday a card comes from the Castle. Dinner, the fourteenth. It is the first in three years.`; }},
    {t:'Stand yourself.', note:'£900 in beer, ribbons and inducements', go:() => { add({money:-900});
      if (electionWin()) { fl('mp'); add({standing:10}); reg('cullerne',-3,'You beat his nephew at Wyvern'); reg('henrietta',2);
        return `The haunch goes back. You send to Tidmarsh’s bank for nine hundred pounds. Beer at the George. Blue ribbons. Eleven conversations in back kitchens.

The poll is on Thursday. Sixteen votes for you. Fifteen for Mr Bligh. Six men carry you round the market place in a chair.

You are Member for Wyvern. Henrietta orders a London gown the same evening. The Castle gates are shut when you drive past.`; }
      add({standing:-4}); reg('cullerne',-4,'You stood against his nephew, and lost');
      return `The haunch goes back. You send to Tidmarsh’s bank for nine hundred pounds. Beer at the George. Blue ribbons. Eleven conversations in back kitchens.

On the morning of the poll Lord Cullerne’s agent takes breakfast at the Bell. Two of your eleven take it with him.

Fourteen votes for you. Seventeen for Mr Bligh. On Saturday your ribbons are still up in the market place. Nobody has troubled to take them down.`; }},
    {t:'Send the venison back.', go:() => { add({standing:-1, goodwill:2}); reg('cullerne',-3,'You returned his venison');
      return `“Take it back to the Castle. My compliments. I have venison of my own.”

The groom looks at Mrs Bunce. She takes her hand away. He covers the haunch and drives off.

Mr Bligh is returned on Thursday without your votes. At Quarter Sessions Lord Cullerne takes the chair. He does not see you all day.`; }}
  ]});

ev({ id:'bank', fixed:'1797-0', title:'Paper and Gold',
  text:() => `The coach brings two pieces of news. The French have landed in Wales. The Bank of England has stopped paying out gold.

By noon there is a line of people outside Tidmarsh’s bank in Wyvern. It runs down the High Street as far as the pump. Shopkeepers. Farmers’ wives. The saddler with his apron on. Each has a fistful of Tidmarsh’s notes.

Your own money is in there. So is the estate’s.

The blind moves at an upstairs window. Mr Tidmarsh looks down at the line. He is counting it.`,
  choices:[
    {t:'Join the queue and get your gold out.', go:() => { fl('ranOnBank'); fl('bankFailed'); add({standing:-4, goodwill:-5});
      return `You take your place. It is an hour to the counter. The clerk pays you in guineas, by weight. His hands shake on the scales.

You come out with both coat pockets full. They drag the coat down off your shoulders. The whole line watches you walk to your horse. More people join the end.

Tidmarsh puts up his shutters at four o’clock. The saddler was nine places from the door.`; }},
    {t:'Stand on the bank steps and declare you will take Tidmarsh’s paper.', go:() => { fl('backedBank'); add({standing:6, goodwill:3}); later('bankFate', 2);
      return `You climb the bank steps and turn round.

“My money is in this house. It is staying in this house. I will take Mr Tidmarsh’s paper for any debt owed to me, today or any day.”

Nobody cheers. The saddler looks at his notes. He puts them in his apron pocket and goes back to his shop. Others follow. By two o’clock the line is six people.

Tidmarsh comes down and holds your hand in both of his. You ride home. You have never seen the inside of his strong-room.`; }},
    {t:'Stay at home and read Cowper.', go:() => { add({standing:-1});
      return `You stay in the library with the door shut.

Mudge brings the story back from Wyvern at dusk. A farmer from Lambourn stood up on a cart at one o’clock. He shouted that he would take Tidmarsh’s paper at full value from any man there. The line broke up within the hour.

“They chaired him round the pump, sir. He’d never set foot in Wyvern before.”`; }}
  ]});

ev({ id:'bankFate', follow:true, title:'Mr Tidmarsh Calls',
  text:() => `A hired chaise is at the door. Mr Tidmarsh is shown into the library. He sits on the front two inches of the chair and holds his hat on his knees.`,
  choices:[
    {t:'Hear him.', go:() => {
      if (chance(0.72)) { fl('cheapCredit'); add({standing:2});
        return `“The house is safe, sir. We paid every note that came in. I know whose doing that was.”

He takes a paper from inside his hat. It is your mortgage deed. A line is ruled through “Five per Cent.” Above it somebody has written “Four”. The alteration is initialled.

He shakes your hand at the door for some time. His palm is wet.`; }
      fl('bankFailed'); add({money:-600, standing:-1});
      return `“Harman’s of Bristol stopped on Tuesday, sir. They owed us eleven thousand. We stopped on Wednesday.”

He has the figures on a half-sheet. The creditors will get seven shillings in the pound. Your loss comes to six hundred.

“I am very sorry, sir.” He stands. He has left something on the hall table. It is a pineapple.`; }}
  ]});

ev({ id:'nore', fixed:'1797-1', cond:() => E() === 'navy', title:'A Letter from the Nore',
  text:() => `The Mercury has it on the front page. The fleet at the Nore has run up the red flag. The paper prints the ships in a column. The Thetis is the ninth name down.

Henrietta reads the column twice and goes to the window. She is at that window for ten days. On the eleventh the post-boy brings a letter in Edmund’s hand. You pay eightpence for it at the door.

“Sheerness, Sunday night.

My dear Father, I am on shore and not hurt. Tell my mother first.

They sent the officers away on Friday. Nobody was struck. The cook has the ship. He carried my chest to the side himself and asked me to mind the wet step. The men want a shilling a day. They want sixteen ounces to the pound from the purser. He gives fourteen and keeps two. That is all they want. I have turned it over for two nights. I cannot make them wrong.

Burn this. Captain Holloway dines with people you know.

Your dutiful son, Edmund.”`,
  choices:[
    {t:'Write to the Admiralty. Ask mercy for the men.', go:() => { add({standing:-2}); reg('edmund',2,'You wrote to the Admiralty for his shipmates');
      return `You write to Lord Spencer at the Admiralty. A clerk replies. “Sir, I am commanded by their Lordships to acknowledge the receipt of your letter.”

The red flags come down in June. Richard Parker is hanged from the yardarm of the Sandwich. Twenty-eight more follow him. The cook of the Thetis is flogged round the fleet. He lives.

Edmund’s next letter is about a gale off the Texel. He does not mention yours. He signs it “Your affectionate son”.`; }},
    {t:'Write to Edmund. Mutiny is mutiny.', go:() => { add({standing:1}); reg('edmund',-1);
      return `You fill four sides. Duty. The King. What your uncle would have said. You copy it fair and send it.

The answer is one side long. The wind has been in the east. He has had a cold. He is, sir, your obedient son.

Parker hangs in June with twenty-eight others. In the same month Parliament votes the seamen their shilling.`; }}
  ]});

ev({ id:'defence', fixed:'1798-1', title:'In Case of the French',
  text:() => `A printed schedule has come from the Lord Lieutenant. It has eleven columns.

If the French land, every parish is to drive its cattle inland, break its mills and burn its ricks. Reading wants to know what Hatherley has. Oxen. Sheep. Wagons. Spades. Axes. Men between fifteen and sixty. Each man is to be entered under one of three heads: pioneers, guides, or “to remove live stock and destroy”.

${F('crabbeGone') ? 'Lark has ruled a sheet ready and sharpened two pens.' : 'Crabbe has read it before you. “I have put myself down as a guide, sir. I know the roads.”'}`,
  choices:[
    {t:'Make honest returns, to the last spade.', go:() => { add({standing:2, goodwill:-2});
      return `You count for a week. Two hundred and six oxen. Forty-one wagons. Nine hundred and twelve sheep. Eighty-three men. Against eleven of the men the overseer has pencilled: “Able, in a way.”

The return goes to Reading on Saturday.

On Sunday nobody stays to talk in the churchyard. Old Dewey stops you at the gate. He asks whether his wagon is the King’s now.`; }},
    {t:'Raise and equip the Hatherley Volunteers.', note:'£300', go:() => { fl('volunteers'); add({money:-300, standing:7, goodwill:2}); reg('cullerne',1);
      return `Forty men come forward. You buy green cloth for forty coats, and a drum. Three hundred pounds.

There are no muskets to be had in England. The blacksmith makes forty pike-heads in a fortnight.

They drill on the common on Sunday afternoons. On the first Sunday the drummer puts his foot through the drum. On the fourth they march the length of the common in step. You find you are standing very straight.`; }},
    {t:'Leave it all to Crabbe.', if:() => !F('crabbeGone'), go:() => { reg('crabbe',1); later('crabbeList', 3);
      return `“See to it, Crabbe.”

“With pleasure, sir.”

He works at it for three evenings. The return is four sheets in his best hand, tied with green tape. He holds it out to you. You are going in to dinner. You tell him to send it.`; }}
  ]});

ev({ id:'crabbeList', follow:true, cond:() => !F('crabbeGone'), title:'Wagons of a Spiritual Character',
  text:() => `A clerk from the Lord Lieutenant’s office is in the yard with a list. He has come to see the wagons.

“Fifty-two, sir, by your return.”

You walk him round. Forty-one.

He shows you the list. Eleven wagons are entered at Hatherley Home Farm that you have never owned. Against each is a government allowance. Sixpence a day, for exercise. Payable to Mr Crabbe, steward.

Crabbe is sent for. He looks at the list. He looks at the clerk.

“A reserve, sir. One does not show the enemy everything.”`,
  choices:[
    {t:'Dismiss him on the spot.', go:() => { fl('crabbeGone'); add({standing:2, goodwill:2}); reg('crabbe',-5,'Dismissed over eleven wagons that did not exist');
      return `“You will be out of the steward’s house by Saturday.”

He bows. On Saturday a cart takes his boxes to Newbury. Your uncle’s writing desk is on the cart. Within the month a brass plate goes up in Northbrook Street. “Crabbe. Land Agent.”

The new steward is a Scot of twenty-six named Lark. On his first morning you hand him the office key. He writes you a receipt for it.`; }},
    {t:'Repay the allowance quietly and keep him where you can see him.', note:'£70', go:() => { fl('crabbeWatched'); add({money:-70}); reg('crabbe',-1,'Knows that you know about the wagons');
      return `You count seventy pounds on to the clerk’s list. He writes “Error” against the eleven wagons and rides away.

Crabbe has not moved. “I am obliged to you, sir.”

“I shall read the accounts myself from now on.”

“I should welcome it, sir.”

For a month every page of the ledger is ruled twice and totalled in red.`; }},
    {t:'Tell the clerk the wagons are out on exercise.', go:() => { fl('crabbeSkims'); add({standing:-2}); reg('crabbe',2,'You lied to the Lord Lieutenant for him');
      return `“The other eleven are out,” you say. “At exercise.”

The clerk looks at you. He looks at Crabbe. He writes in his book for some time and does not show you the page. Then he rides away.

Crabbe sees him to the gate. He comes back across the yard without hurrying. He does not thank you. He asks whether you still want the Lady Day accounts on Friday, or whether next week would do.`; }}
  ]});

ev({ id:'incomeTax', fixed:'1799-3', title:'Ten Per Centum',
  text:() => `The form is four pages. Crown paper, printed in London. “An Act for granting to His Majesty certain Duties upon Income.”

Two shillings in the pound. You are to state what you have from land, from the funds and from every other source. You are to state it to the commissioners for this division. They are ${F('gallDead') ? 'Lord Cullerne’s agent' : 'Dr Gall'}, Mr Hartopp, and Mr Spurling, the attorney.

You dined with two of them last week.

The last line of the last page is blank, for a name. The words printed above it are “I do solemnly declare”.`,
  choices:[
    {t:'Declare every half-crown.', go:() => { fl('taxHonest'); add({standing:2});
      return `You write down the rents, the home farm, the timber, the three per cents. You add it up twice and sign.

Spurling reads it at the George with his spectacles pushed up. He reads it again. Then he sends his clerk to the tithe map to look for a farm you have left out.

There is none. It takes him a fortnight to believe it.`; }},
    {t:'Declare what the estate was worth in your uncle’s day.', go:() => { fl('taxDodge'); later('taxCaught', 5 + Math.floor(Math.random() * 6));
      return `Your uncle’s rent book for 1785 is in the bottom drawer. You copy the figures from that.

You sign. For a week you turn the lamp down early and tell Henrietta the claret must last.

A note comes from Spurling. One line. “Received, with interest.”`; }},
    {t:'Pay in full, and denounce it at the Bell.', go:() => { fl('taxHonest'); add({goodwill:3, standing:-1});
      return `You pay to the last shilling. Then you walk down to the Bell.

You stand on a settle and give them twenty minutes. Englishmen. Liberty. A tax-gatherer in every man’s desk. The landlord fills your glass twice and forgets to chalk it.

The carters cheer you. Not one of them earns enough to be taxed. Jem Pryor asks you, very civil, how much it came to.`; }}
  ]});

ev({ id:'taxCaught', follow:true, cond:() => F('taxDodge'), title:'A Ferret in a Good Coat',
  text:() => `Mr Spurling is in the hall. He has a clerk with him. The clerk has a tin box.

He lays two papers side by side on your library table. One is your return. The other is older. “Particulars of the Hatherley Estate, 1791.” Lord Cullerne’s lawyers drew it up when his lordship tried to buy the place from your uncle. It gives the rental, farm by farm.

Spurling puts a finger on each total.

“Nine hundred a year between them, sir. I make it nine hundred.” He smiles at you. “I do enjoy a discrepancy.”`,
  choices:[
    {t:'Pay the arrears and the surcharge.', note:'£420', go:() => { fl('taxDodge', false); fl('taxHonest'); add({money:-420, standing:-5});
      return `You write the draft. Four hundred and twenty pounds, arrears and surcharge. Spurling locks it in the tin box.

“The commissioners’ proceedings are secret by statute, sir.”

By Thursday the butcher in Wyvern knows the figure. He sends in his account that week. He has not sent one before Christmas in ten years.`; }},
    {t:'Offer Spurling fifty guineas for his trouble.', note:'£52', go:() => { add({money:-52});
      if (chance(0.5)) { return `You put a purse on the table between the two papers. Fifty guineas.

Spurling looks at the clerk. The clerk goes to look out of the window.

When you look down again the purse is gone. Spurling is closing the tin box. “Rents do fluctuate,” he says. He takes the 1791 paper away with him.`; }
      fl('taxDodge', false); fl('taxHonest'); add({money:-420, standing:-9});
      return `You put a purse on the table between the two papers. Fifty guineas.

Spurling stands up. “Mr Hobbs. You will note the time.” The clerk notes it. The purse goes into the tin box, labelled.

You pay the four hundred and twenty as well. Spurling tells the story at the George that night. By Saturday it is a hundred guineas. By Quarter Sessions you were on your knees.`; }}
  ]});

ev({ id:'dearth', fixed:'1800-2', title:'A Proclamation Concerning Bread',
  text:() => `Wheat is a hundred and thirteen shillings the quarter. There has been no harvest worth the name for two years.

In the cottages they are baking with barley and bran. At the Pryors’ there are nettles drying on a string across the hearth.

Dr Gall reads the King’s Proclamation from the pulpit. Every household that can afford wheat is to eat a third less of it. No pastry. No flour in puddings.

Mrs Bunce is in the back pew. She walks out before the blessing.`,
  choices:[
    {t:'Sign the pledge. No pastry at the Hall.', go:() => { add({family:-4, goodwill:5, standing:2}); reg('henrietta',-1);
      return `You sign the pledge and nail a copy to the kitchen door.

Mrs Bunce sends up rice pudding on Monday. Rice pudding on Tuesday. On Wednesday there are potatoes in the bread. Henrietta leaves the table and has a tray in her room.

On Sunday three cottage children stand in the lane under the kitchen chimney with their noses up. There is no pie. They go home and tell their mothers.`; }},
    {t:'Open a soup kitchen in the old brewhouse.', note:'£250', go:() => { fl('soup'); add({money:-250, goodwill:11, standing:3}); meet('thorne'); reg('thorne',1); reg('gall',-1); reg('pryor',1);
      return `You have the old brewhouse copper scoured. Count Rumford’s receipt is in the Mercury: barley, pease, potatoes, stale bread, one beef bone, water. Two hundred and fifty pounds will carry it to the spring.

Two hundred quarts a day. The children come at noon with jugs. Abigail Thorne comes on the second day and stays to ladle.

Dr Gall preaches against it. “Teach a poor man to expect soup and he will expect it.” On Monday his housekeeper is at the brewhouse door with a quart jug.`; }},
    {t:'Sell the home farm wheat while the price holds.', note:'+£460', go:() => { fl('hoarder'); add({money:460, goodwill:-11}); reg('pryor',-1,'Counted your wheat wagons leaving in the dearth'); later('rickFire', 2);
      return `A corn factor comes out from Reading. He offers a hundred and fifteen shillings. You take it. Four hundred and sixty pounds.

His three wagons load at the great barn at ten in the morning. The only road out runs through the village.

Doors open along the street. Nobody speaks. Jem Pryor stands at his gate with his youngest on his shoulders. His lips move as each sack goes by.`; }}
  ]});

ev({ id:'census', fixed:'1801-1', title:'The Numbering of the People',
  text:() => `Mr Nokes the overseer is at the estate office with a printed form and an inkhorn on a string. Parliament wants every person in Hatherley counted.

He has been at it three days.

“Hannah Gurney has barred her door, sir. She says King David numbered Israel and the Lord sent a plague. The Coxes, the Dances and the Lovegroves have all gone to cousins at Shefford. And then there is the smith.”

He turns the form round. Under “Children” the blacksmith has had him write “Enough”.`,
  choices:[
    {t:'Go round with Nokes yourself.', go:() => { add({goodwill:4, standing:1});
      return `You go round with him, door to door. You carry a basket of oranges from the hot-house.

One orange for each child counted. By the second day children are being fetched home from Shefford.

Hannah Gurney opens her door a hand’s width. She takes an orange and shuts it again. Nokes puts her down.

Six hundred and four. He lost count twice in Mill Lane. You do not ask how he made it up.`; }},
    {t:'Tell Nokes to estimate and be done.', go:() => { add({goodwill:1});
      return `“Reckon it as near as you can, Nokes.”

He walks the village once and counts chimneys. He writes “590” and sends it to Reading.

Hannah Gurney dies within the year. She was ninety. Half the village says it was the winter. The other half looks at Nokes.`; }},
    {t:'Have the constable count the absentees as vagrants.', go:() => { add({goodwill:-4, standing:1});
      return `You send the constable to Shefford with a message. Any Hatherley family not at home by Friday will be entered as vagrants.

They are home on Thursday. Nokes counts them at their doors. Nobody asks him in.

Five hundred and ninety-seven. This time the smith gives his children, all nine. Under “Occupation” he has Nokes write “Numbered”.`; }}
  ]});

ev({ id:'paris', fixed:'1802-1', title:'Everyone Is Going to Paris',
  text:() => `The Tamworths have gone to Paris. So have the Lovedays. Lady Cullerne left on Monday with nine trunks.

There has been peace since March. The packets are running from Dover again.

Henrietta has a letter from Mrs Tamworth open by her plate. It is about bonnets in the Palais Royal. ${K() === 'free' ? 'Kitty wants to see Bonaparte. She has said so twice since the fish. ' : ''}${F('gallDead') ? 'The new curate' : 'Dr Gall'} is dining with you. He has not been further than Bath in his life.

“They eat frogs, madam,” he tells Henrietta. “I have it from a man who saw it done.”`,
  choices:[
    {t:'Take the family.', note:'£500', go:() => { fl('paris'); add({money:-500, family:10, standing:3}); reg('henrietta',2,'You took her to Paris in the peace'); if (K() === 'free') reg('kitty',2);
      return `Dover to Calais in four hours. Calais to Paris in three days. Five hundred pounds before you are home.

On Sunday there is a review in the Place du Carrousel. You stand in the crowd. A small sallow man rides down the line on a white horse. He looks along the faces as he passes. He looks at yours.

Henrietta buys eleven bonnets. You catch a cold on the packet home. At Dover you tell her it will be war again within the year.`; }},
    {t:'Send Henrietta with your sister Selina.', note:'£220', go:() => { fl('paris'); add({money:-220, family:4}); reg('henrietta',1);
      return `Your sister Selina goes with her. Two hundred and twenty pounds.

They are back in six weeks. Henrietta says “Mon Dieu” when the tea is cold. Selina has been shown Madame Récamier’s bed. She describes it at dinner.

Selina has also seen the First Consul. “Common,” she says. She says it at the Tamworths’ and again at the Castle.`; }},
    {t:'Refuse. The French are not to be trusted.', go:() => { add({family:-6}); reg('henrietta',-2,'You kept her from Paris'); if (!F('gallDead')) reg('gall',1);
      return `“The French are not to be trusted. We stay at home.”

Henrietta folds Mrs Tamworth’s letter and puts it in her sleeve.

All summer there are letters from Paris in the neighbourhood. They are read aloud after dinner at every house you visit. At the Lovedays’ you hear about the Louvre twice in one evening.`; }}
  ]});

ev({ id:'boulogne', fixed:'1803-2', title:'The Army of England',
  text:() => `The war began again in May.

The Mercury prints a letter from Dover. On a clear day the tents at Boulogne can be seen from the cliff. A hundred and fifty thousand men. Two thousand flat boats. Bonaparte has told his admirals he needs six hours of fog.

At the Tamworths’ the nurse has a new way of getting the children to bed. “Boney will have you.” It works on the first night.

There is a handbill on the church door. “BRITONS! To Arms!”`,
  choices:[
    {t:'Drill the Hatherley Volunteers yourself, twice a week.', if:() => F('volunteers'), go:() => { add({standing:5, goodwill:2, family:-2});
      return `You buy the drill book and read it on Saturday nights. On Sundays and Wednesdays you take them on the common.

Form line. Form square. Charge pikes. By November they can do all three. One man has been stuck in the leg.

The blacksmith is serjeant. He stands six foot four with a pike in his fist. The men watch him and do what he does.`; }},
    {t:'Raise a corps of Volunteers now.', note:'£320', if:() => !F('volunteers'), go:() => { fl('volunteers'); add({money:-320, standing:6, goodwill:2});
      return `Forty men give their names at the vestry. Three hundred and twenty pounds for green coats, a drum and forty pike-heads.

The ladies of the parish work a flag. It shows a yellow animal on a green field. Henrietta says it is a lion.

The men asked for muskets. There are none. The blacksmith is serjeant. “A pike,” he tells them, “is a musket with the nonsense left out.”`; }},
    {t:'Send a hundred pounds to the Patriotic Fund at Lloyd’s.', note:'£100', go:() => { add({money:-100, standing:3}); reg('cullerne',1);
      return `You send a hundred pounds to the Patriotic Fund at Lloyd’s Coffee House.

The list of subscribers is in the Times on Tuesday. A duke, fifty pounds. Then you. Then a soap-boiler of Wapping, two hundred.

Lord Cullerne has seen it. He says so across the room at the Wyvern assembly, with his hand on your shoulder.`; }},
    {t:'Set Henrietta at the head of a flannel committee.', go:() => { add({family:3, goodwill:1, standing:1}); reg('henrietta',1);
      return `Henrietta calls the ladies of the parish to the drawing-room. Flannel shirts for the troops. Tuesdays at eleven.

You pass the door each week. Fourteen women and one pair of scissors.

By Christmas there are nine shirts in the basket. Miss Loveday is engaged to a lieutenant of Militia.`; }}
  ]});

ev({ id:'beacon', fixed:'1804-0', title:'The Beacon on Hatherley Down',
  text:() => `The church bell wakes you. It is two in the morning.

There is fire on Hatherley Down. There is fire on Inkpen Hill behind it. From the landing window you count five more along the valley.

The Volunteers are falling in on the green. Some have coats. The smith has a pike and a nightshirt. Henrietta is on the stairs with the silver in a pillowcase.

${F('gallDead') ? 'The sexton comes up the drive at a run. He has buried the communion plate in the vicarage asparagus bed. He wants you to know which row, in case he is killed. He cannot remember which row.' : 'Dr Gall comes up the drive in his dressing-gown. He has buried the communion plate in his asparagus bed. He wants you to know which row, in case he is killed. He cannot remember which row.'}`,
  choices:[
    {t:'Mount, and lead the men towards the coast.', go:() => { add({standing:6, goodwill:4, family:-2});
      return `You mount and take them down the Newbury road. Forty men in the dark, in step for the first mile.

Fourteen miles on, the Bath mail comes up behind with its lamps lit. The guard leans down. “No French, sir. Some fool lit a beacon at Inkpen.”

They sit down in the road. Three of them have one boot. Then the smith starts to laugh. You march them home by daylight, singing. Every cottage door is open.`; }},
    {t:'Ride up to the beacon and find out.', go:() => { add({standing:2, goodwill:1});
      return `You ride up the Down in your nightshirt and greatcoat.

Billy Coombes is beside the beacon. It is burning well. He is crying. He saw fire on Inkpen, as he was told to. You ride on to Inkpen. A charcoal burner is asleep beside his stack.

You are in bed again by four. The Volunteers are out till noon. On Sunday nobody on the green will look at you.`; }},
    {t:'Stay, and guard the house.', go:() => { add({family:4, standing:-5}); reg('henrietta',1);
      return `You take your uncle’s sword down from the hall chimney-piece and stand at the head of the stairs. Henrietta sits on the top step with the pillowcase.

At first light the Bath mail brings the truth through Wyvern. No French.

You try to draw the sword. It has not been out of the scabbard since the Forty-Five. It will not move. One of the Johns is at the foot of the stairs. He has been there some time.`; }}
  ]});

ev({ id:'trafalgar', fixed:'1805-3', title:'Laurel on the Mail',
  text:() => `The London mail comes into Wyvern at noon. There is laurel tied round the lamps. The horses have black crape on their bridles.

The guard stands up on the roof and shouts it. A battle off Cape Trafalgar. Nineteen ships taken. Lord Nelson is killed.

The ringers run to the tower. They ring a peal. Somebody stops them and one bell tolls. Then the peal again.${E() === 'navy' && !F('edmundDead') ? `

There is a letter from Edmund in the bag. The writing slopes uphill. “The Thetis repeated signals. We hardly fired. I saw the Victory go into their line. I was not afraid until it was over. Then I was sick into the hammock nettings. The boatswain says everybody is.”` : ''}`,
  choices:[
    {t:'Illuminate the Hall.', note:'£40', go:() => { add({money:-40, standing:3});
      return `A candle in every window of the Hall. Fifty-four windows. Forty pounds in wax and lamp oil.

People walk out from Wyvern to stand in the road and look. Somebody starts “Rule, Britannia”.

Henrietta walks the gallery with a snuffer. She counts the candles aloud. At ten o’clock she begins putting them out.`; }},
    {t:'Roast a sheep for the village.', note:'£60', go:() => { add({money:-60, goodwill:6});
      return `You give a sheep and three barrels. It is roasted on the common.

They drink to Lord Nelson first. Nobody says a word. Then they drink confusion to the French. The noise can be heard at the Hall.

The fiddler plays “Hearts of Oak” nine times. Old Dewey is crying by the fire. A boy starts to laugh at him. The boy’s mother cuffs him.`; }},
    {t:'Order the bells tolled, and put the household in black.', go:() => { add({standing:1, family:-1}); if (!F('gallDead')) reg('gall',1);
      return `One bell, tolled for an hour. The household is in black by evening.

No other parish for ten miles has thought of it. ${F('gallDead') ? 'The rector of Kintbury' : 'Dr Gall'} calls it very proper.

The ringers come to the kitchen door afterwards. They stand there. Mrs Bunce asks what they want. They want to know if it is beer for tolling, the same as for ringing.`; }}
  ]});

ev({ id:'abolition', fixed:'1807-0', title:'A Petition from the Chapel',
  text:() => { meet('thorne'); meet('pinch');
