“I was very well received.”`; }
      add({standing:-3});
      return `You say that no man loves the King better than he who would spare him a war.

“Which way do you vote, sir?” calls a hatter from the gallery.

You say it again. The hall begins to stamp. The Sheriff calls the next man.`; }}
  ]});

ev({ id:'tFigures', from:1797, to:1808, weight:5, cond:() => T('figures'), title:'The Overseer’s Book',
  text:() => `The Easter vestry. Mr Nokes the overseer lays the poor book on the table for the ratepayers to pass, as he has done these nine years. Nobody opens it. Nobody ever has.

You open it.

“To Widow Gurney, 2s. weekly, 52 weeks.” Hannah Gurney was buried in March of last year. “To shoes for Jno. Coombes’s boy, 4s. 6d.” Five times.

You add the right-hand column, upward. It comes to thirty-eight pounds more than the parish has paid out.

Nokes is the Wyvern grocer. Half the vestry owe at his shop. He is watching your pencil.`,
  choices:[
    {t:'Read the column out to the vestry.', go:() => { fl('nokesOut'); S.poorMult *= 0.9; add({standing:2, goodwill:4});
      return `You read it out, line by line. You come to Widow Gurney.

“She’s dead,” says the blacksmith.

“She has had five pound four since.”

Nokes stands up. He says he keeps the book as his father kept it. He sits down.

The vestry votes Farmer Dewey overseer for the year. The rate comes down a penny in the pound.`; }},
    {t:'Close the book, and call at the shop tomorrow.', go:() => { S.poorMult *= 0.95; add({goodwill:1});
      return `You call at nine. Nokes takes you through to the back, among the candles.

You put the paper on the tea chest. He reads it and takes off his apron.

“I can find twenty by Midsummer.”

“Thirty-eight. And I shall add the book each Easter.”

He finds it. The dead come off the list.`; }},
    {t:'Pass the book with the rest.', go:() => {
      return `You close it and slide it down the table. It is passed.

Nokes sends a Stilton up to the Hall on Saturday, with his duty. Nothing has been ordered.`; }}
  ]});

/* ---- his failing ---- */

ev({ id:'tPlay', from:1796, to:1810, weight:5, repeatGap:22, cond:() => T('play'), title:'Faro at the Tamworths’',
  text:() => `The Tamworths’ card room, past midnight. A Major Cathcart of the Militia has set up a faro bank on the green table and is dealing from a box.

You came with forty pounds in your pocket-book. You have eleven.

The queen has lost four times together. She cannot lose a fifth.

Cathcart squares the pack.

“Do you go on, sir? I can take your note.”

Henrietta is in the doorway with her cloak on.`,
  choices:[
    {t:'Go on, upon a note of hand.', go:() => { if (chance(0.35)) { add({money:310, family:-2});
        return `You put two hundred on the queen, on paper.

She wins. She wins again.

You get up three hundred and ten pounds to the good. Cathcart pays in Bank notes. He is quite as civil as before.

“You will give me my revenge on Thursday.”

Henrietta counts it in the carriage. She keeps it.`; }
      add({money:-260, family:-5}); reg('henrietta',-1,'Stood in the Tamworths’ doorway while you lost two hundred and sixty pounds');
      return `You put two hundred on the queen, on paper.

She loses. You put fifty on the knave to fetch it back.

You sign for two hundred and sixty pounds at the corner of the table. Cathcart sands the note for you.

Henrietta has gone out to the carriage. She has taken the rug.`; }},
    {t:'Give Henrietta the pocket-book and get up.', go:() => { add({family:3}); reg('henrietta',1);
      return `You hand it to her across the room. She puts it in her muff.

“Mrs ${S.sur} does not play?” says Cathcart.

“Mrs ${S.sur} has eleven pounds, sir, and means to keep them.”

In the carriage she gives you back the book. There are eleven pounds in it. She has counted.`; }},
    {t:'Ask Cathcart to let you cut the pack.', go:() => { if (chance(0.5)) { add({standing:3});
        return `“Before you deal, Major. Oblige me.”

He holds the box out. You turn it over. The queens are all four at the bottom, together.

Nobody speaks. Tamworth rings for the Major’s horse.

Your twenty-nine pounds are returned to you by the Colonel of the regiment, with a letter.`; }
      add({standing:-4});
      return `“Before you deal, Major. Oblige me.”

He hands you the pack. It is as honest as a prayer book.

“Are you satisfied, sir?”

You say that you are. The table hears you say it. Tamworth asks if you will take a glass of something before you go.`; }}
  ]});

ev({ id:'tEnemy', from:1796, to:1806, weight:5, cond:() => T('enemy'), title:'A Pointer in Cuckoo Copse',
  text:() => `Mudge is at the gun room door. He has a pointer bitch on a length of cord. She is liver and white, and the collar is brass.

“Took her in Cuckoo Copse, sir. She had a hen pheasant.”

You turn the collar to the light. “CULLERNE.” Under it, smaller: “Duchess.”

It is the third of that name. You shot the first in 1768.

“I could lose her, sir,” says Mudge. “Nobody saw.”

She sits down on your foot.`,
  choices:[
    {t:'Walk her up to the Castle yourself.', go:() => { add({standing:1}); reg('cullerne',3,'You brought his pointer home on a cord, on foot');
      return `It is four miles. You go on foot, with the cord round your wrist.

His lordship is on the steps in a shooting jacket. He looks at the bitch. He looks at you.

“You ain’t shot her, then.”

“No, my lord.”

“Hm.” He takes the cord. “You’d better have some sherry.”

It is the first time you have been inside the house.`; }},
    {t:'Send her home with Mudge, and a note.', go:() => { reg('cullerne',1);
      return `“Mr ${S.sur}’s compliments, and he returns Lord Cullerne’s pointer, found straying.”

Mudge is given a shilling at the stable door.

There is no answer. At church on Sunday his lordship nods, an inch.`; }},
    {t:'Keep her in the kennel till she is asked for.', go:() => { add({standing:-2}); reg('cullerne',-1,'You kept his pointer nine days');
      return `She is nine days in your kennel. On the tenth a groom rides over.

“His lordship’s compliments, and is his bitch here?”

“She is. She has had a hen pheasant of mine.”

The groom puts half a crown on the mounting block and takes the dog.`; }}
  ]});

ev({ id:'tWhig', from:1797, to:1800, weight:8, cond:() => T('whig') && S.season === 3, title:'Mr Fox’s Birthday',
  text:() => `A card, by hand, from the Crown at Reading.

“The Friends of Freedom in the County of Berks will dine together on the 24th of January, being the Birth-Day of the Right Hon. C. J. FOX. Dinner on Table at Four. Tickets 10s. 6d., Wine included.”

Hartopp has written on the back. “You will come. We are thirty.”

Last year, at the dinner in London, the Duke of Norfolk gave the toast “Our Sovereign, the People”. The King struck him off as Lord Lieutenant within the week. The names of those who dine at Reading will be in the Mercury.`,
  choices:[
    {t:'Dine, and drink every toast.', note:'10s. 6d.', go:() => { fl('foxite'); add({money:-1, standing:-5, goodwill:4}); reg('hartopp',2,'You drank “the People” at Mr Fox’s dinner'); reg('cullerne',-1);
      return `Thirty-one sit down. The chairman is a brewer.

“Gentlemen. Our Sovereign: the People.”

You stand and drink it. So does Hartopp. A clergyman at the bottom of the table drinks it in water.

The Mercury gives the list on Monday. You are sixth. Dr Gall preaches on the thirteenth of Romans. The Bell drinks your health the same evening, by name.`; }},
    {t:'Dine, and keep your seat for that one.', note:'10s. 6d.', go:() => { add({money:-1, standing:-1}); reg('hartopp',-1);
      return `Thirty-one sit down. The chairman is a brewer.

“Gentlemen. Our Sovereign: the People.”

Thirty stand. You look at your plate.

The Mercury prints your name with the rest. Hartopp rides home without waiting for you.`; }},
    {t:'Send the half-guinea, and a cold.', note:'10s. 6d.', go:() => { add({money:-1}); reg('hartopp',-1);
      return `You send the money and your regrets. You have a cold.

Hartopp returns the half-guinea the next morning in a twist of paper. There is nothing written on the paper.`; }}
  ]});

ev({ id:'tGout', from:1798, to:1810, weight:5, cond:() => T('gout') && !F('goutEased'), title:'The Left Foot',
  text:() => `The gout came on at Quarter Sessions. You were carried out of the Shire Hall between two constables and have lain eleven days with the foot on a stool.

Ferris the surgeon has been. He looked at the foot. He looked at the decanter.

“No port for a twelvemonth, sir. No red meat after noon. Water.”

There is also a bottle on the table, sent over by Lord Cullerne’s housekeeper. “L’Eau Médicinale d’Husson. One Guinea.” It is brown. Nobody will say what is in it.

Mrs Bunce has sent up a beefsteak.`,
  choices:[
    {t:'Do as Ferris says.', go:() => { fl('goutEased'); add({family:-2, standing:-1});
      return `You drink water for a year. You dine out on boiled fowl.

The county thinks you unwell. Henrietta thinks you a changed man and tells you so at breakfast.

The foot goes into a boot at Michaelmas. You walk to church.`; }},
    {t:'Take the French water.', note:'A guinea a bottle', go:() => { add({money:-12}); if (chance(0.55)) { fl('goutEased');
        return `You take a wineglass of it at night.

By morning the pain is gone out of the foot. So is everything else out of you. Ferris is sent for at four and sits by the bed with his watch.

“Meadow saffron,” he says, smelling the cork. “It will cure you or kill you. I should not take the second glass.”

You take it in halves, for a year. The foot holds.`; }
      return `You take a wineglass of it at night.

You are extremely ill for three days. The foot is exactly as it was.

Ferris smells the cork and says nothing. He sends in his bill for the three days.`; }},
    {t:'Eat the beefsteak.', go:() => { add({family:1});
      return `You eat it. You send down for the port.

The foot is on the stool until Lady Day. John learns to carry you upstairs without touching it.`; }}
  ]});
/* The rent roll. The squire does not farm these acres. He sets the terms on which other people do.
   Numbers and reasoning: docs/economy/DESIGN.md. The paper model they were balanced on: tools/econsim.js. */

// Wheat before the game opens. It only feeds the trailing averages.
const WHEAT_BEFORE = {1785:43,1786:40,1787:42,1788:46,1789:53,1790:55,1791:49,1792:43,1793:49,1794:52};
const wheatOf = y => PRICES[y] || WHEAT_BEFORE[y] || 76;
const trail = (y, n) => { let s = 0; for (let i = 1; i <= n; i++) s += wheatOf(y - i); return s / n; };
/* Two indices, both 1.0 for the rent a farm in fair order paid in 1795.
   market(y): what the farm would fetch if let this Lady Day. Bidders reason from the last five years, and rents never fell of their own accord while the war lasted.
   means(y): what a tenant can find out of the harvest of year y. The same long view, knocked about by that year's price and weather. */
const warRise = y => 0.02 * Math.min(y, 1813) - 0.02 * 1795 - 0.06 * Math.max(0, y - 1813);
const structOf = y => 0.55 + 0.45 * trail(y, 5) / 50 + warRise(y);
const MARKET = {};
for (let y = FIRST_YEAR; y <= LAST_YEAR + 1; y++){
  const view = y > 1813 ? 0.6 * trail(y, 5) + 0.4 * wheatOf(y - 1) : trail(y, 5), m = 0.55 + 0.45 * view / 50 + warRise(y);
  MARKET[y] = y === FIRST_YEAR ? 1 : y <= 1813 ? Math.min(Math.max(m, MARKET[y - 1]), MARKET[y - 1] * 1.07) : m; }
const market = y => MARKET[y] || 1;
function means(y){ const pe = 0.55 * wheatOf(y) + 0.45 * trail(y, 3), wf = 1 - (1 - (WEATHER[y] || 1)) * 0.3;
  return structOf(y) * Math.pow(pe / trail(y, 5), 1.7) * wf; }

const COND = [0.70, 0.85, 1.0, 1.15, 1.30];
const ORDER_W = ['Ruinous', 'Neglected', 'In fair order', 'In good order', 'In high order'];
const MEANS_W = ['Nothing laid by', 'Pinched', 'Getting by', 'Easy', 'Warm'];
const LEVEL = {easy:0.88, fair:1.0, rack:1.13};
const MAX_FARMS = 5;
const INCOMERS = [['Mr Lanfear', 'Lambourn'], ['Mr Wicks', 'Hungerford'], ['Mr Goddard', 'Aldbourne'], ['Mr Ilsley', 'Speen'], ['Mr Nalder', 'Chieveley'], ['Mr Chivers', 'Shefford'], ['Mr Tubb', 'Inkpen'], ['Mr Hazell', 'Boxford']];
const five = n => Math.round(n / 5) * 5;

function startFarms(){ return [
  // base: the 1795 rent the farm would bear in fair order.
  {id:'longbarrow', name:'Long Barrow', acres:600, base:590, cond:2, rent:540, lease:{type:'term', ends:1802, years:14}, level:'fair', K:700, arrears:0, tenant:'Mr Thorne'},
  {id:'kennet', name:'Kennet Bottom', acres:500, base:560, cond:1, rent:470, lease:{type:'will'}, level:'fair', K:200, arrears:0, tenant:'Widow Harris', she:true},
  {id:'church', name:'Church Farm', acres:550, base:610, cond:2, rent:610, lease:{type:'will'}, level:'fair', K:500, arrears:0, tenant:'Mr Froome', common:true}
]; }
const NEW_FARMS = {
  coldharbour:{name:'Coldharbour', acres:400, base:420, cond:2, tenant:'Mr Buckeridge'},
  starveall:{name:'Starveall', acres:180, base:105, cond:1, tenant:'Mr Dewey'},
  commonpiece:{name:'Common Piece', acres:300, base:230, cond:1}
};
const farm = id => S.farms.find(f => f.id === id);
function incomer(){ const used = S.farms.map(f => f.tenant), free = INCOMERS.filter(n => !used.includes(n[0])); return pick(free.length ? free : INCOMERS); }
function addFarm(id, o){ if (farm(id) || S.farms.length >= MAX_FARMS) return null;
  const d = NEW_FARMS[id], f = Object.assign({id, name:d.name, acres:d.acres, base:d.base, cond:d.cond, level:'fair', arrears:0, own:true, lease:{type:'will'}, tenant:d.tenant || incomer()[0]}, o || {});
  if (!f.rent) f.rent = five(0.95 * lettingValue(f, S.year)); if (f.K === undefined) f.K = 0.5 * f.rent;
  S.farms.push(f); return f; }
const mortCap = () => S.mortCap || 9000;

/* What makes one farm worth more than its acres: its order, the works done on it, the common gone. */
function farmF(f){ let x = COND[f.cond] * (1 + 0.025 * Math.min(S.improve, 10));
  if (f.common && F('enclosed')) x *= 1.3;
  if (f.id === 'kennet') x *= (F('newMill') ? 1.06 : 1) * (F('meadows') ? 1.08 : 1);
  return x; }
const lettingValue = (f, y) => five(market(y) * farmF(f) * f.base);
const rentDue = f => f.rent * S.rentAdj * (f.rebate ? 0.8 : 1);
const pro = f => f.she ? {he:'she', He:'She', him:'her', his:'her'} : {he:'he', He:'He', him:'him', his:'his'};

/* Older events and works speak in flags. This turns what they said into farms. */
function estateSync(){
  if (!S.farms) { S.farms = startFarms(); S.letQueue = []; S.payQueue = []; }
  const lb = farm('longbarrow'), kb = farm('kennet');
  if (lb && S.seen.thorneLease !== undefined && !lb.thorneDone) { lb.thorneDone = true; lb.arrears = 0; delete lb.void;
    lb.lease = {type:'term', ends:S.year + 7, years:7}; lb.since = S.year;
    if (F('nephewFarm')) { S.rentAdj /= 0.96; lb.rent = five(lb.rent * 0.96); lb.tenant = F('crabbeGone') ? 'Mr Pyke' : 'young Mr Crabbe'; lb.she = false; lb.K = 0.2 * lb.rent; lb.cond = Math.max(0, lb.cond - 1); }
    else { lb.tenant = 'Mrs Thorne'; lb.she = true; } }
  if (kb && S.projectsDone.drain === 'done' && !kb.drained) { kb.drained = true; kb.cond = Math.max(kb.cond, 2); }
  if (kb && F('edmund') === 'farmer' && kb.tenant !== 'Edmund') { kb.tenant = 'Edmund'; kb.she = false; kb.arrears = 0; delete kb.void; kb.since = S.year;
    kb.rent = five(0.88 * lettingValue(kb, S.year)); kb.lease = {type:'term', ends:S.year + 14, years:14}; kb.K = kb.rent; }
  if (F('starveall') && !farm('starveall') && !S.starveallDone) { S.starveallDone = true; S.rentAdj /= 1.09; addFarm('starveall'); }
}

/* Lady Day business: leases run out, rents from year to year are moved, farms mend or go back. */
function ladyDay(){ const y = S.year, st = steward(), up = [];
  for (const f of S.farms){ if (f.void) continue; const p = pro(f);
    if (f.rebate && y >= f.rebate) delete f.rebate;
    if (f.lease.type !== 'will' && y >= f.lease.ends) { f.lease = {type:'will'}; f.level = 'fair'; askLet(f.id, 'out'); continue; }
    if (f.lease.type === 'will' && !S.letQueue.some(x => x.id === f.id)) { const target = LEVEL[f.level] * lettingValue(f, y), was = f.rent;
      f.rent = five(target > f.rent ? Math.min(target, f.rent * 1.12) : Math.max(target, f.rent * 0.9));
      if (f.rent !== was) up.push(f.name + ' to ' + fmt(f.rent));
      if (f.level === 'rack' && f.cond > 0 && chance(0.12)) { f.cond--; S.notes.push(`${f.name} is going back. ${st} counted three fields in wheat after wheat.`); }
      else if (f.level !== 'rack' && f.cond < 2 && f.id !== 'kennet' && chance(0.2)) f.cond++; }
    const secure = f.lease.type !== 'will' && f.lease.ends - y >= 5 && f.lease.years >= 14;
    if (secure && f.K > 1.4 * f.rent && f.cond >= 1 && f.cond < 4) { f.K -= 0.9 * f.rent; f.cond++;
      S.notes.push(`${f.tenant} has drained and fenced at ${f.name} at ${p.his} own cost. ${st} enters the farm as ${ORDER_W[f.cond].toLowerCase()}.`); } }
  if (up.length) S.notes.push('Rents from year to year, moved this Lady Day: ' + up.join('; ') + '.'); }

function relet(f){ const n = incomer(); f.cond = Math.max(0, f.cond - 1); f.tenant = n[0]; f.she = false; f.arrears = 0; f.lease = {type:'will'}; f.level = 'fair'; f.since = S.year; delete f.void; delete f.rebate;
  f.rent = five(0.9 * lettingValue(f, S.year)); f.K = 0.3 * f.rent;
  S.notes.push(`${f.name} is let again, to ${n[0]} of ${n[1]}, from year to year at ${fmt(f.rent)}.`); }
function quit(f){ f.void = 2; f.arrears = 0; if (f.tenant === 'Mrs Thorne') reg('thorne', -2, 'Broke at Long Barrow under your rent'); }

/* The two rent days. Called from beginSeason with the ledger's own line(). */
function rentDay(line){
  estateSync();
  const y = S.year, q = S.season, hy = q === 0 ? y - 1 : y;   // Lady Day rents are paid out of last year's harvest
  if (q === 0) ladyDay();
  let racked = 0, easy = 0, n = 0, asked = false;
  for (const f of S.farms){
    const able = means(hy) * farmF(f) * f.base * (0.94 + S.goodwill / 800);
    if (f.void) { const v = Math.max(-0.075 * f.base, 0.175 * (able - 0.4 * f.base)); line(f.name + ', in hand', v); S.yearIncome += Math.round(v); f.void--; if (!f.void) relet(f); continue; }
    if (f.lease.type === 'corn') f.rent = five(LEVEL[f.lease.level] * 0.86 * f.base * farmF(f) * (0.5 * means(hy) + 0.5 * market(y)));
    const due = rentDue(f) / 2, surplus = able / 2 - due, val = lettingValue(f, y); let got = due;
    n++; if (rentDue(f) > 1.06 * val) racked++; else if (rentDue(f) < 0.92 * val) easy++;
    if (surplus >= 0) { const back = Math.min(f.arrears, surplus * 0.5); f.arrears -= back; got += back; f.K = Math.min(1.6 * f.rent, f.K + 0.3 * (surplus - back)); }
    else { f.K += surplus; if (f.K < 0) { const short = Math.min(due, -f.K); f.K = 0; got -= short; f.arrears += short;
      if (short >= 1) S.notes.push(`${f.tenant} of ${f.name} is ${fmt(short)} short this half-year.`); } }
    line(f.name + ', ' + f.tenant, got); S.yearIncome += Math.round(got);
    if (f.arrears > 0.9 * f.rent) { S.notes.push(`${f.tenant} has left ${f.name} owing ${fmt(f.arrears)}. The key was on a nail in the porch. The farm is in hand.`); quit(f); add({goodwill:-3}); }
    else if (!asked && f.arrears > 0.25 * f.rent && (f.asked === undefined || S.t - f.asked >= 4) && !S.payQueue.includes(f.id)) { asked = true; f.asked = S.t; S.payQueue.push(f.id); later('cannotPay', 0); }
  }
  if (n) add({goodwill: Math.round(-4 * racked / n + 2 * easy / n)});
}

/* ---------- what the book shows, and what the squire may do from it ---------- */
function tenureOf(f){ if (f.void) return 'In hand'; const l = f.lease;
  return l.type === 'will' ? 'From year to year' : (l.type === 'corn' ? 'Corn rent' : 'Lease') + ' to Lady Day ' + l.ends; }
function rentRoll(){ estateSync(); const y = S.year, open = S.phase !== 'end' && !S.dead;
  return S.farms.map(f => { const will = !f.void && f.lease.type === 'will', waiting = S.letQueue.some(x => x.id === f.id);
    return {id:f.id, name:f.name, acres:f.acres, tenant:f.void ? '' : f.tenant, rent:f.void ? 0 : Math.round(rentDue(f)), value:lettingValue(f, y),
      tenure:tenureOf(f), order:ORDER_W[f.cond], means:f.void ? '' : MEANS_W[Math.min(4, Math.floor(f.K / Math.max(1, f.rent) / 0.3))],
      arrears:Math.round(f.arrears), level:f.level, own:!!f.own, abated:!!f.rebate, waiting, canLevel:open && will && !waiting, canOffer:open && will && !waiting}; }); }
const LAND = {longbarrow:'Down and sheepwalk', kennet:'Wet clay, with the mill', church:'Strips in the open field', coldharbour:'Sound loam beyond the turnpike', starveall:'Thin chalk on the hill', commonpiece:'New ground off the common'};
/* For the Farms leaf of the book. held is ready to print; the rest is there for the page to draw as it likes. */
function farmsList(){ return rentRoll().map(f => { const bits = [f.tenure === 'In hand' ? 'In hand, no tenant' : f.tenure, f.order];
    if (f.abated) bits.push('A fifth abated'); if (f.arrears) bits.push('In arrear ' + fmt(f.arrears)); if (f.waiting) bits.push('Terms to be settled this quarter');
    return Object.assign(f, {land:(f.id === 'church' && F('enclosed') ? 'Inclosed arable' : LAND[f.id]), tenant:f.tenant || 'No tenant', held:bits.join('. ')}); }); }
const rentalNow = () => rentRoll().reduce((a, f) => a + f.rent, 0);
/* The old three-way rent policy still answers: it sets every farm held from year to year. */
function setRentAll(v){ const lvl = v < 1 ? 'easy' : v > 1 ? 'rack' : 'fair'; for (const f of S.farms) if (!f.void && f.lease.type === 'will') f.level = lvl; }
function setLevel(id, lvl){ const f = farm(id); if (!f || !LEVEL[lvl] || f.void || f.lease.type !== 'will') return; f.level = lvl; save(); render(); }
function askLet(id, why){ if (S.letQueue.some(x => x.id === id)) return; S.letQueue.push({id, why}); later('leaseFalls', 0); }
function offerLease(id){ const f = farm(id); if (!f || f.void || f.lease.type !== 'will') return; askLet(id, 'offer');
  S.journal.unshift({when:stamp(), title:'Rent roll', did:'Sent word to ' + f.tenant + ' about a lease of ' + f.name}); save(); render(); }

/* ---------- papers ---------- */
function letting(){ while (S.letQueue && S.letQueue.length){ const x = S.letQueue[0], f = farm(x.id); if (f && !f.void && f.lease.type === 'will') return {f, why:x.why}; S.letQueue.shift(); } return null; }
function owing(){ while (S.payQueue && S.payQueue.length){ const f = farm(S.payQueue[0]); if (f && !f.void && f.arrears >= 1) return f; S.payQueue.shift(); } return null; }
function sign(f, type, years, level, rent){ f.lease = type === 'will' ? {type:'will'} : {type, ends:S.year + years, years, level}; f.level = level; if (rent) f.rent = rent; if (!f.since) f.since = 1788; S.letQueue.shift(); }
const covenants = `no two white straw crops together, no hay or straw sold off the farm, the hedges kept`;

ev({ id:'leaseFalls', follow:true, cond:() => !!letting(),
  get title(){ const x = letting(); return x ? 'The Letting of ' + x.f.name : 'A Letting'; },
  text:() => { const {f, why} = letting(), p = pro(f), st = steward(), val = lettingValue(f, S.year);
    if (f.tenant === 'Mrs Thorne') meet('thorne');
    if (why === 'offer') return `You have sent word to ${f.tenant} that ${p.he} may have a lease of ${f.name}. ${p.He} holds it from year to year at ${fmt(f.rent)}.

${p.He} comes up to the Hall on Saturday in ${p.his} market coat. ${st} has the valuation ready on a half sheet. He puts the farm at ${fmt(val)} on a lease. A stranger, he says, would give ${fmt(five(val * 1.13))}.

“What term, sir?” says ${f.tenant}.`;
    return `The lease of ${f.name} ${S.season === 0 ? 'is out this Lady Day' : 'ran out at Lady Day'}. ${f.tenant} has had the ${f.acres} acres at ${fmt(f.rent)} a year.

${st} has walked the farm and brings his valuation on a half sheet. He puts it at ${fmt(val)} to a good tenant on a lease. He has two letters in his pocket from men who would give ${fmt(five(val * 1.13))}.

${f.tenant} is in the hall. ${p.He} has brought the old lease with ${p.him}.`; },
  choices:[
    {t:() => letting().why === 'offer' ? 'Leave things as they are.' : `Let ${pro(letting().f).him} hold on from year to year.`, note:'The rent moves each Lady Day', go:() => { const {f} = letting(), p = pro(f); sign(f, 'will', 0, 'fair');
      return `Nothing is signed. ${f.tenant} pays the half-year and asks whether the barn roof is ${p.his} to mend or yours. ${steward()} enters ${f.name} in the book as held from year to year.`; }},
    {t:'A lease of seven years.', note:() => fmt(lettingValue(letting().f, S.year)) + ' a year', go:() => { const {f} = letting(), r = lettingValue(f, S.year); sign(f, 'term', 7, 'fair', r);
      return `The lease is engrossed on one skin at Wyvern and read over in the steward’s room. ${f.tenant} signs. The rent is ${fmt(r)} until Lady Day ${S.year + 7}.`; }},
    {t:'A lease of fourteen years.', note:() => fmt(lettingValue(letting().f, S.year)) + ' a year', go:() => { const {f} = letting(), r = lettingValue(f, S.year); sign(f, 'term', 14, 'fair', r); add({goodwill:1});
      return `Fourteen years. ${steward()} reads the covenants aloud: ${covenants}. ${f.tenant} signs below your name. The rent is ${fmt(r)} until Lady Day ${S.year + 14}.`; }},
    {t:'Fourteen years at an easy rent, the tenant to drain and fence.', note:() => fmt(five(0.88 * lettingValue(letting().f, S.year))) + ' a year', go:() => { const {f} = letting(), p = pro(f), r = five(0.88 * lettingValue(f, S.year)); sign(f, 'term', 14, 'easy', r); add({goodwill:3});
      if (f.tenant === 'Mrs Thorne') reg('thorne', 1, 'You gave her fourteen years at a rent she could mend the farm on');
      return `The rent is set at ${fmt(r)} for fourteen years. ${f.tenant} covenants to lay stone drains in the wet grounds and to plant quick along the lane. ${p.He} asks to take the lease home and read it.

On Monday there are two loads of stone at ${p.his} gate.`; }},
    {t:'Advertise the farm and take the best bidder.', note:() => fmt(five(1.13 * lettingValue(letting().f, S.year))) + ', seven years, a new tenant', go:() => { const {f} = letting(), r = five(1.13 * lettingValue(f, S.year)), old = f.tenant, n = incomer();
      if (old === 'Mrs Thorne') reg('thorne', -4, 'You advertised Long Barrow over her head'); if (old === 'Edmund') { reg('edmund', -3, 'You let Kennet Bottom over his head'); add({family:-6}); }
      f.tenant = n[0]; f.she = false; f.K = 0.3 * r; f.arrears = 0; f.since = S.year; sign(f, 'term', 7, 'rack', r); add({goodwill:-5});
      return `The notice is in the Mercury two Saturdays running. Nine letters come. The best is from a ${n[0]} of ${n[1]}, who offers ${fmt(r)} and has not seen the farm.

${old} leaves with two wagons and a crate of fowls. ${n[0]} signs for seven years.`; }},
    {t:'Fourteen years at a corn rent.', note:'The rent rises and falls with wheat at Wyvern', go:() => { const {f} = letting(); sign(f, 'corn', 14, 'fair');
      f.rent = five(0.86 * f.base * farmF(f) * (0.5 * means(S.year - 1) + 0.5 * market(S.year))); add({goodwill:2});
      return `The rent of ${f.name} is fixed in wheat and not in money. Each rent day ${steward()} is to take the Wyvern price and work the sum. He works it now, twice. This year it comes to ${fmt(f.rent)}.

${f.tenant} asks to see the working, and signs.`; }}
  ]});

ev({ id:'cannotPay', follow:true, cond:() => !!owing(),
  get title(){ const f = owing(); return f ? 'Arrears at ' + f.name : 'Arrears'; },
  text:() => { const f = owing(), p = pro(f), st = steward(), a = fmt(f.arrears);
    if (f.tenant === 'Mrs Thorne') meet('thorne');
    return (S.t + f.acres) % 2 ? `${f.tenant} is ${a} behind with the rent of ${f.name}. ${p.He} comes up on rent day and counts what ${p.he} has on to the table in notes and silver.

“That is what the corn made, sir,” ${p.he} says. “There is no more till the lambs are sold.”

${st} has the arrears book open. There is a pencil cross against the name.` : `${st} brings the arrears book. ${f.tenant} of ${f.name} owes ${a} and has sent a boy with a note in place of the money.

The note says the wheat was sold at ${PRICES[S.year]}s. the quarter and the poor rate was paid out of it first. It asks for time.

“There are eleven beasts and two ricks down there, sir,” says ${st}. “They would cover it.”`; },
  choices:[
    {t:'Forgive the arrears.', note:() => 'Strike off ' + fmt(owing().arrears), go:() => { const f = owing(), p = pro(f), a = fmt(f.arrears); f.arrears = 0; S.payQueue.shift(); add({goodwill:3});
      if (f.tenant === 'Mrs Thorne') reg('thorne', 1, 'You struck off her arrears');
      return `${steward()} draws his pen through ${a}. ${f.tenant} watches him do it. ${p.He} says the gate on the lane will be hung by Sunday.`; }},
    {t:'Forgive them, and take a fifth off the rent for two years.', note:() => fmt(Math.round(owing().rent * S.rentAdj * 0.8)) + ' a year until ' + (S.year + 2), if:() => !owing().rebate, go:() => { const f = owing(); f.arrears = 0; f.rebate = S.year + 2; f.K += 0.1 * f.rent; S.payQueue.shift(); add({goodwill:5});
      if (f.tenant === 'Mrs Thorne') reg('thorne', 2, 'You abated her rent when wheat fell');
      return `The arrears are struck off. The rent is to be ${fmt(Math.round(rentDue(f)))} until Lady Day ${f.rebate}. ${steward()} writes the figure on a slip. ${f.tenant} folds the slip twice and puts it in an inside pocket.`; }},
    {t:'Let the arrears stand over.', note:'Owed still', go:() => { const f = owing(), a = fmt(f.arrears); S.payQueue.shift();
      return `The ${a} is carried forward. ${steward()} writes “stands over” in the margin. ${f.tenant} thanks you and goes out by the yard door.`; }},
    {t:'Distrain. Send the bailiff for the stock.', note:'The farm falls in hand', go:() => { const f = owing(), p = pro(f), got = Math.round(Math.min(f.arrears, 0.45 * f.rent) / 5) * 5, who = f.tenant; S.payQueue.shift();
      if (who === 'Mrs Thorne') reg('thorne', -4, 'You sold her up for the rent'); if (who === 'Edmund') { reg('edmund', -4, 'You distrained on your own son'); add({family:-10}); }
      add({money:got, goodwill:-7}); quit(f);
      return `The bailiff goes down on Monday with two men and a cart. The sale is held in the yard on Thursday. The beasts, the ricks and the implements make ${fmt(got)}.

${who} goes to a brother at Speen. ${f.name} is in hand, and ${steward()} has put a man in to feed what is left.`; }}
  ]});

/* ---------- works that belong to a place ---------- */
PROJECTS.meadows = { name:'Float the water meadows at Kennet Bottom', seasons:2, cost:() => 300,
  blurb:`Hatches, carriers and drains, to lay the Kennet over forty acres from Christmas to Lady Day.`, gain:'Kennet Bottom worth more to let',
  done:() => { fl('meadows'); return `The hatches are drawn at Kennet Bottom for the first time. The water stands an inch deep over forty acres. There is grass for the ewes in March.`; }};
PROJECTS.commonpiece = { name:'Fence Common Piece and build a farmhouse', seasons:2, cost:() => 1000, if:() => F('enclosed') && !farm('commonpiece') && S.farms.length < MAX_FARMS,
  blurb:`Three hundred acres of the old common, staked out by the award. No hedge, no barn, no house.`, gain:'A new farm to let',
  done:() => { const f = addFarm('commonpiece', {own:false}); if (!f) return `The quick is planted round Common Piece. The land is laid to Church Farm.`;
    return `The quick is planted round Common Piece and the farmhouse has its roof on. ${f.tenant} takes the three hundred acres from year to year at ${fmt(f.rent)}. He begins by burning the furze.`; }};

/* ---------- credit, and ruin by stages ---------- */
// Years when Consols yielded five per cent or more. The law holds a mortgage to five, so nobody lends on land.
const TIGHT = [1797, 1798, 1799, 1803, 1804, 1805, 1812, 1813, 1815];
const moneyTight = y => TIGHT.includes(y);
const canBorrow = () => S.mortgage < mortCap() && !moneyTight(S.year);
const borrowWhy = () => moneyTight(S.year) ? 'The Funds pay five per cent this year. Mr Tidmarsh has nothing to lend on land.' : S.mortgage >= mortCap() ? 'The estate will carry no more.' : '';
const salePrice = f => Math.round(26 * (f.void ? 0.9 * lettingValue(f, S.year) : rentDue(f)) / 10) * 10;
const boughtFarm = () => S.farms.filter(f => f.own).sort((a, b) => b.base - a.base)[0];
const edmundSigns = () => farm('longbarrow') && !F('edmundDead') && S.chars.edmund.r > -3 && !F('soldLongBarrow');
function sellFarm(f){ const p = salePrice(f); S.farms.splice(S.farms.indexOf(f), 1); S.money += p; return p; }
/* Called each quarter before the season's paper is chosen. Bills first, then the tradesmen, then the land, then the packet to Douglas. */
function creditCheck(){
  const first = id => { S.queue = S.queue.filter(x => x.id !== id); S.queue.unshift({id, at:S.t}); };
  if (S.money < -3000) { if (boughtFarm() || edmundSigns()) first('hammer'); else S.dead = 'ruin'; }
  else if (S.money < -1500 && (S.stoppedAt === undefined || S.t - S.stoppedAt >= 8)) { S.stoppedAt = S.t; first('georgeMeeting'); }
  if (S.season === 0 && moneyTight(S.year) && !moneyTight(S.year - 1)) S.notes.push('Consols are below sixty. Mr Tidmarsh writes that he can find nothing on mortgage while the Funds pay better than five per cent.');

ev({ id:'georgeMeeting', follow:true, cond:() => S.money < -800, title:'The Meeting at the George',

    {t:'Fell the oaks in Hanger Wood.', note:() => '+' + fmt(Math.round(75 * (1 + 0.035 * (S.year - 1795))) * 10), if:() => (S.timber === undefined ? 3 : S.timber) > 0, go:() => { const t = Math.round(75 * (1 + 0.035 * (S.year - 1795))) * 10; S.timber = (S.timber === undefined ? 3 : S.timber) - 1; add({money:t, standing:-3});

The chandler is paid in part.`; }},

  ]});

ev({ id:'hammer', follow:true, cond:() => S.money < -2000 && (boughtFarm() || edmundSigns()), title:'A Sale by Order',
  text:() => `You owe ${fmt(-S.money)} in Wyvern and Reading on bills and notes of hand. Two of the holders have taken out writs.

“Something must go, sir,” he says. “The question is what.”`,

      return `${f.name} is put up at the George by Mr Skinner in one lot. It is knocked down at ${fmt(p)} to a brewer from Reading. Mr Tidmarsh pays off the writs the same afternoon and brings you a draft for the balance.`; }},
    {t:'Sell Long Barrow out of the settlement.', note:() => 'About ' + fmt(salePrice(farm('longbarrow'))) + '. Edmund must sign', if:() => !!edmundSigns(), go:() => { const p = sellFarm(farm('longbarrow')), off = Math.max(0, Math.min(S.mortgage, Math.floor((S.money - 200) / 500) * 500)); S.mortgage -= off; S.money -= off; fl('soldLongBarrow'); add({standing:-8, family:-12}); reg('edmund', -2, 'You sold Long Barrow out of his inheritance'); reg('cullerne', 1);

Long Barrow is sold by private treaty to Lord Cullerne’s agent for ${fmt(p)}. ${off ? `The mortgagees take ${fmt(off)} of it. ` : ''}The estate map is sent to Wyvern to be drawn again.`; }},

const ART = new Set(['frontispiece.jpg','icons/accounts.jpg','icons/daybook.jpg','icons/persons.jpg','icons/wheat.jpg','icons/works.jpg','portraits/crabbe.jpg','portraits/cullerne.jpg','portraits/dubreuil.jpg','portraits/edmund.jpg','portraits/gall.jpg','portraits/hartopp.jpg','portraits/henrietta.jpg','portraits/kitty.jpg','portraits/oakes.jpg','portraits/pinch.jpg','portraits/pryor.jpg','portraits/thorne.jpg','portraits/vane.jpg','seasons/0.jpg','seasons/1.jpg','seasons/2.jpg','seasons/3.jpg','ui/book-leaf.jpg','ui/book.jpg','ui/headpiece.png','ui/marble.jpg','ui/seal.png','ui/tailpiece.png']);

let TAB = 'accounts', LEAF = -1;
const TABS = [['accounts', 'Accounts'], ['farms', 'Farms'], ['works', 'Works'], ['ventures', 'Ventures'], ['persons', 'Persons'], ['wheat', 'Wheat'], ['daybook', 'Day-Book']];
// Public business is printed and posted; private business comes by hand. These arrive as handbills.
const BILLS = new Set(['speen','flour','powder','bank','defence','incomeTax','dearth','census','boulogne','beacon','trafalgar','abolition','election','election96','jubilee','peace','cornLaw','waterloo']);
const quarterDay = () => QUARTER[S.season] + ' ' + S.year;

// Pictures. build.sh lists what is in art/; anything missing falls back to an ornament drawn here.
const artURL = p => { for (const x of ['.jpg', '.webp', '.png']) if (ART.has(p + x)) return 'art/' + p + x; return ''; };
const pic = (p, alt) => { const u = artURL(p); return u ? `<img src="${u}" alt="${esc(alt || '')}" onerror="this.remove()">` : ''; };
function medal(id, big){ const n = PEOPLE[id].name; return `<span class="medal${big ? ' big' : ''}"><span aria-hidden="true">${esc(n.split(' ').pop()[0])}</span>${pic('portraits/' + id, n)}</span>`; }
function whoOf(text){ let best = null, at = Infinity;
  for (const id in PEOPLE){ if (!S.chars[id]) continue; const i = text.indexOf(PEOPLE[id].name.split(' ').pop()); if (i >= 0 && i < at) { at = i; best = id; } }
  return best; }
function sceneSVG(q){ const C = [['#cddfdd','#b6cc9c','#98b97f','#7c9f69'], ['#cde2ea','#c3cd8a','#a6b668','#5d884d'], ['#e7dab9','#d6b97b','#c39954','#b0672e'], ['#dde2e6','#eff1ee','#e0e4e2','#6b6258']][q], k = '#4b3a2a';
  const tree = (x, y, s) => q === 3 ? `<path d="M${x} ${y}v${-34 * s}m0 ${14 * s}l${-11 * s} ${-13 * s}m${11 * s} ${5 * s}l${12 * s} ${-14 * s}m${-12 * s} ${-2 * s}l${-6 * s} ${-11 * s}m${6 * s} ${4 * s}l${7 * s} ${-9 * s}" fill="none" stroke="${k}" stroke-width="1.5"/>`

  let win = ''; for (let i = 0; i < 5; i++) win += `<rect x="${302 + i * 21.5}" y="127" width="9" height="11"/><rect x="${302 + i * 21.5}" y="144" width="9" height="${i === 2 ? 18 : 11}"/>`;
  return `<svg viewBox="0 0 700 260" role="img" aria-label="Hatherley Hall and its park in ${SEASONS[q].toLowerCase()}"><rect width="700" height="260" fill="${C[0]}"/>${sky}
    <circle cx="565" cy="${[62, 44, 84, 104][q]}" r="20" fill="#f4e6b0" stroke="${k}" stroke-width=".8"/>
    <path d="M0 150C120 108 240 120 360 142S600 108 700 136V260H0Z" fill="${C[1]}" stroke="${k}" stroke-width="1"/>
    <g stroke="${k}" stroke-width="1"><rect x="302" y="104" width="9" height="16" fill="#cdbf9c"/><rect x="389" y="104" width="9" height="16" fill="#cdbf9c"/><rect x="292" y="118" width="116" height="46" fill="#ece1c6"/><path d="M328 118l22-17 22 17z" fill="#ece1c6"/><path d="M286 118h128" stroke-width="2"/></g><g fill="${k}" opacity=".75">${win}</g>
    ${tree(246, 176, .8)}${tree(456, 174, .8)}

function render(){
  const stage = $('stage');

  if (!S) { LEAF = -1; stage.classList.remove('turn'); stage.innerHTML = '<p class="titlepage">Hatherley Combe<small>A squire’s seasons, 1795 to 1815</small></p>' + introHTML();
    $('verso').innerHTML = `<div class="bookplate">${plateHTML(1, 'frontispiece', 'Hatherley Hall from the park')}<span>The Estate Book of</span><b>Hatherley Combe</b><i>in the County of Berks, kept by Mr Crabbe, steward</i></div>`;
    $('tabs').innerHTML = ''; syncTraits(); return; }
  if (S.t !== LEAF) { if (LEAF >= 0 && S.phase === 'ledger') { stage.classList.remove('turn'); void stage.offsetWidth; stage.classList.add('turn'); } LEAF = S.t; }
  stage.innerHTML = ({ledger:ledgerHTML, event:eventHTML, outcome:outcomeHTML, undertake:undertakeHTML, undone:outcomeHTML, end:endHTML})[S.phase]();
  drawBook();

function drawBook(){ $('verso').innerHTML = versoHTML();
  $('tabs').innerHTML = TABS.map(([id, n]) => `<button aria-pressed="${TAB === id}" onclick="showTab('${id}')">${pic('icons/' + id)}${n}</button>`).join(''); }
function showTab(t){ TAB = t; drawBook(); }

function introHTML(){ const has = !!load();
  return `<article class="card opening">
    <p class="kicker">Berkshire, Lady Day 1795</p>
    <h2>An Inheritance</h2>
    <p>Your uncle Barnaby is dead at seventy-one, face down in a syllabub at his own Michaelmas dinner, which the county agreed was how he would have wished to go, though perhaps not in front of the Bishop.</p>
    <p>He has left you Hatherley Combe: two thousand one hundred acres of chalk and clay, eleven tenant farms, a mill, a common that nobody owns and everybody uses, a house with a smoking chimney in every room but the one you want, a mortgage of four thousand pounds, and a steward named Crabbe who smiles as a ledger would, if it could.</p>
    <p>England has been two years at war with the French Republic. Bread is dear and growing dearer. You have a wife, Henrietta, who had hoped for a baronet; a daughter, Kitty, seventeen, who has read every novel in the Newbury circulating library and believed most of them; and a son, Edmund, nineteen, who wants very badly to be shot at.</p>
    <p>You have twenty-one years, a season at a time. Nobody will tell you what a good squire is. Several people will tell you what a bad one is, afterwards.</p>
    <form id="begin" class="names" onsubmit="event.preventDefault(); start();">
      <label for="first">Christian name</label><input id="first" value="Thomas" maxlength="18" autocomplete="off">
      <label for="sur">Surname</label><input id="sur" value="Merridew" maxlength="18" autocomplete="off">
      <fieldset class="traits">
        <legend>What manner of man inherits</legend>
        <p class="fine">You have <b id="pts">${pointsLeft(pickList())}</b> <span id="ptsw">points</span> in hand. An advantage costs them; a burden pays them back. Leave all five alone to start as plain as your uncle left you.</p>
        ${TRAIT_GROUPS.map(([g, label, plain]) => `<div class="pickrow"><label for="pick-${g}">${label}</label>
          <select id="pick-${g}" onchange="setPick('${g}', this.value)"><option value="">${plain}</option>${TRAITS.filter(t => t.group === g).map(t => `<option value="${t.id}"${PICKS[g] === t.id ? ' selected' : ''}>${esc(t.name)} (${t.cost > 0 ? 'costs ' + t.cost : 'gives ' + (-t.cost)})</option>`).join('')}</select>
          <p class="pickblurb" id="blurb-${g}"></p></div>`).join('')}
      </fieldset>
      <div class="row"><button class="go" id="takeit" type="submit">Take possession</button>${has ? '<button class="quiet" type="button" onclick="resume()">Resume the estate you left</button>' : ''}</div>
    </form>
  </article>`; }
let PICKS = {};
const pickList = () => Object.values(PICKS).filter(Boolean);
function setPick(g, id){ PICKS[g] = id || null; syncTraits(); }
function syncTraits(){ if (!$('pts')) return; const left = pointsLeft(pickList());

  $('pts').textContent = left; $('ptsw').textContent = Math.abs(left) === 1 ? 'point' : 'points'; $('pts').classList.toggle('neg', left < 0);
  $('takeit').disabled = left < 0; $('takeit').textContent = left < 0 ? 'Overdrawn. Give something up, or take on a burden' : 'Take possession'; }
function start(){ if (pointsLeft(pickList()) < 0) return; const f = ($('first').value || 'Thomas').trim(), s = ($('sur').value || 'Merridew').trim(); newGame(f, s, pickList()); render(); window.scrollTo({top:0}); }
function resume(){ const s = load(); if (s) { S = s; render(); } }

const runhead = (l, r, m) => `<p class="runhead"><span>${l}</span>${m ? `<span>${m}</span>` : ''}<span>${r}</span></p>`;

function ledgerHTML(){
  const warn = S.dead === 'ruin' ? `<p class="note bad">The tradesmen of Wyvern have met at the George and resolved, unanimously, to give no further credit. The mortgagees have sent a man to look at the roof.</p>` : '';

function eventHTML(){ const e = byId(S.pending); const cs = e.choices.filter(c => !c.if || c.if()); const bill = BILLS.has(e.id), text = e.text(), who = bill ? null : whoOf(e.title + ' ' + text);

    <article class="sheet${bill ? ' bill' : ''}">
      ${who ? `<div class="from">${medal(who, true)}<div><p class="kicker">${esc(stamp())}. ${esc(PEOPLE[who].name)}</p><h2>${esc(e.title)}</h2></div></div>` : `<p class="kicker">${esc(stamp())}</p><h2>${esc(e.title)}</h2>`}

function versoHTML(){

function worksHTML(){ const list = worksList(), hand = list.filter(w => w.state === 'inHand'), open = list.filter(w => w.state === 'open'), done = list.filter(w => w.state === 'done');

    ${open.length ? `<h3>That might be put in hand</h3>${common ? `<p class="note bad">${esc(common)}</p>` : ''}<ul class="works">${open.map(w => `<li><div><b>${esc(w.name)}</b><button class="inkbtn" onclick="beginWork('${w.id}')" ${w.can ? '' : 'disabled'}>Put in hand</button></div>
      <small>${esc(w.note)}. ${esc(w.gain)}.</small><q>${esc(w.blurb)}</q>${w.why && !common ? `<small class="why">${esc(w.why)}</small>` : ''}</li>`).join('')}</ul>` : ''}
    ${done.length ? `<h3>Finished</h3><ul class="works done">${done.map(w => `<li><div><b>${esc(w.name)}</b></div></li>`).join('')}</ul>` : ''}`; }

/* Farms and Ventures. The engine will supply farmsList() and venturesList(); until it does these leaves show the economy design's opening figures and move nothing. */
const DRAFT_FARMS = [
  {name: 'Long Barrow', land: 'Down and sheepwalk', acres: 600, tenant: 'Abigail Thorne', rent: 540, held: 'On lease, falling in 1802'},
  {name: 'Kennet Bottom', land: 'Wet clay, with the mill', acres: 500, tenant: 'Widow Harris', rent: 470, held: 'At will. Neglected'},
  {name: 'Church Farm', land: 'Strips in the open field', acres: 550, tenant: 'Not yet let', rent: 610, held: 'At will'}];
const DRAFT_VENTURES = [
  {name: 'Plough up the down', where: 'Long Barrow', cost: 250, well: 'The farm lets a quarter higher, at once.'},
  {name: 'Merinos', where: 'The home farm', cost: 420, well: 'Wool worth £110 more a year, and rams at fancy prices.'},
  {name: 'Cut the peat', where: 'Kennet Bottom', cost: 300, well: 'About £170 a year in peat and ashes.'},
  {name: 'Forage for the barracks', where: 'The estate', cost: 200, well: '£130 a year, as long as there is cavalry at Reading.'},
  {name: 'A threshing machine', where: 'The home farm', cost: 120, well: 'Saves about £50 a year in wages.'},
  {name: 'A partner’s share in the Wyvern Bank', where: 'The estate', cost: 1000, well: 'Fifteen per cent, and a seat in the bank parlour.'},
  {name: 'The Hatherley Spa', where: 'The estate', cost: 1800, well: 'If the waters take, £300 a year rising to £750.'}];
const DRAFT_NOTE = '<p class="fine">A specimen leaf. These figures come from the new economy’s design and do not yet touch the accounts.</p>';
function farmsHTML(){ const live = typeof farmsList === 'function', list = live ? farmsList() : DRAFT_FARMS, sum = list.reduce((a, f) => a + f.rent, 0);
  return `${live ? '' : DRAFT_NOTE}<table class="acct roll"><thead><tr><th>Farm and tenant</th><th class="n">Acres</th><th class="n l">£ a year</th></tr></thead><tbody>
    ${list.map(f => `<tr><td>${esc(f.name)}<small>${esc(f.land)}. ${esc(f.tenant)}.</small><em>${esc(f.held)}</em></td><td class="n">${f.acres}</td><td class="n l">${f.rent}</td></tr>`).join('')}
    <tr class="total"><td>The rental</td><td class="n">${list.reduce((a, f) => a + f.acres, 0)}</td><td class="n l">${sum.toLocaleString('en-GB')}</td></tr></tbody></table>
    <p class="fine">Room on the estate for ${list.length < 5 ? ['', 'four', 'three', 'two', 'one'][list.length] + ' more' : 'no more'}. Five farms is as far as Hatherley goes.</p>`; }
function venturesHTML(){ const live = typeof venturesList === 'function', list = live ? venturesList() : DRAFT_VENTURES;
  return `${live ? '' : DRAFT_NOTE}<p class="fine">Works are sound. These are the other kind.</p><ul class="works">${list.map(v => `<li><div><b>${esc(v.name)}</b>${live && v.id ? `<button class="inkbtn" onclick="beginVenture('${v.id}')" ${v.can ? '' : 'disabled'}>Venture ${fmt(v.cost)}</button>` : `<span class="cost">${fmt(v.cost)}</span>`}</div>
    <small>${esc(v.where)}</small><q>${esc(v.well)}</q></li>`).join('')}</ul>`; }

function peopleHTML(){
  return `<ul class="people">${Object.keys(S.chars).filter(id => S.chars[id].met).map(id => { const c = S.chars[id], p = PEOPLE[id]; const note = c.notes[c.notes.length - 1];
    return `<li>${medal(id)}<div><b>${esc(p.name)}</b><small>${esc(p.role())}</small><span class="r r${c.r + 5}">${REGARD[c.r + 5]}</span>${note ? `<q>${esc(note)}</q>` : ''}</div></li>`; }).join('')}</ul>`; }

function chartHTML(){ const W = 300, H = 110, pad = 18, n = LAST_YEAR - FIRST_YEAR + 1, bw = (W - pad) / n; let bars = '';
  const yOf = v => H - 16 - (v / 130) * (H - 28);
  for (let y = FIRST_YEAR; y <= S.year; y++){ const v = PRICES[y], x = pad + (y - FIRST_YEAR) * bw;
    bars += `<rect x="${x.toFixed(1)}" y="${yOf(v).toFixed(1)}" width="${(bw - 2).toFixed(1)}" height="${(H - 16 - yOf(v)).toFixed(1)}" class="${y === S.year ? 'now' : ''}"><title>${y}: ${v}s. the quarter</title></rect>`; }
  return `<p class="wheat"><b>${PRICES[S.year]}</b>shillings the quarter. ${PRICES[S.year] >= 100 ? 'Famine price.' : PRICES[S.year] >= 80 ? 'Dear.' : PRICES[S.year] >= 65 ? 'Middling.' : 'Cheap. The farmers are in mourning.'}</p>
    <svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Price of wheat by year, in shillings the quarter">
    <line x1="${pad}" x2="${W}" y1="${yOf(80)}" y2="${yOf(80)}" class="rule"/><text x="${W}" y="${yOf(80) - 3}" text-anchor="end">80s.</text>
    <line x1="${pad}" x2="${W}" y1="${H - 16}" y2="${H - 16}" class="axis"/>${bars}
    <text x="${pad}" y="${H - 3}">1795</text><text x="${W}" y="${H - 3}" text-anchor="end">1815</text></svg>`; }

function journalHTML(){
  return `${S.journal.length ? `<ol class="daybook">${S.journal.slice(0, 16).map(j => `<li><time>${esc(j.when)}</time><span><b>${esc(j.title)}.</b> ${esc(j.did)}</span></li>`).join('')}</ol>` : '<p class="fine">Nothing entered yet.</p>'}
    ${S.phase !== 'end' ? '<div class="row"><button class="quiet" onclick="askWipe(this)">Abandon this estate and begin again</button></div>' : ''}`; }
function askWipe(b){ if (b.dataset.sure) return wipe(); b.dataset.sure = 1; b.textContent = 'Certain? Press again to give it all up'; }

function boot(data){ indexEvents(); if (data && data.S) S = data.S; render(); }
if (window.claude && window.claude.hot && window.claude.hot.snapshot) { try { window.claude.hot.snapshot(() => ({S})); } catch (err) {} }
if (window.claude && window.claude.hot && window.claude.hot.ready) window.claude.hot.ready(boot); else boot((window.claude && window.claude.hot && window.claude.hot.data) || {});
</script>
