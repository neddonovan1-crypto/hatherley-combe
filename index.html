“They go by the Kennet to Bristol, sir, and they are in Lisbon in a month. Lord Wellington’s horses are eating chopped straw.”

Henrietta drives to church behind the bays.`,
    o:[{t:'Sell him the oats and the three horses.', note:'£190 to you', go:() => { add({money:190, family:-4, standing:1}); reg('henrietta',-1,'You sold her carriage horses to the army');
      return `It is a hundred and twenty for the horses, and seventy for the oats; and the Treasury bills are paid to the day.

The bays go down the drive behind Mr Fisk’s man, and at the lodge one of them looks round.

On Sunday the carriage goes to church behind two plough-horses, who stop of themselves at every gate.`; }},
    {t:'The oats only.', note:'£70 to you', go:() => { add({money:70});
      return `You have seventy pounds for the oats, and by Thursday the granary is swept bare.

By March there is not an oat to be had in the county under forty shillings; and you buy back twenty quarters for your own horses, of a dealer at Newbury.

The sacks have “HATHERLEY” upon them, in your own stencil.`; }},
    {t:'Neither. Send him to Hartopp.', go:() => { reg('hartopp',1);
      return `“Mr Hartopp has more oats than I have, and less use for them.”

Hartopp sells the Commissary four hundred quarters, and gives him a pamphlet upon the feeding of horses with Swedish turnips, to be forwarded to Lord Wellington.

The Commissary takes it, saying that his lordship reads everything.`; }}]},

  {id:'war-corunna', hot:true, once:true, title:'Home from Corunna', w:() => S.year === 1809, x:() => `The transports from Corunna have come into Portsmouth and Plymouth; and the men, being landed as they stood, have marched inland in what they had on.

Will Tubb of Hatherley, who went for a soldier in ’05, is at the lodge, with a blanket for a coat, and his feet tied up in a shirt, and his left arm off above the elbow. He has a paper, by which the Chelsea Board allows him ninepence a day.

“I walked the last of it on the ice, sir. From Lugo. We threw the pay-chests down the mountain to lighten the wagons. I saw twenty-five thousand pounds go over in dollars. I had not had my pay since October.”`,
    o:[{t:'Give him the lodge.', go:() => { add({goodwill:4, family:1});
      return `The old lodge-keeper being past opening gates, Will Tubb has the lodge, and the garden, and four shillings a week over his ninepence.

He opens the gate with his right hand, and salutes with it after; and he salutes the butcher’s cart.

In the evenings the boys of the parish sit along the lodge wall, while he tells them about the dollars; and by Easter it is thirty thousand pounds.`; }},
    {t:'Five guineas, and a word to the overseer.', note:'£5', go:() => { add({money:-5, goodwill:1});
      return `You put five guineas in his hand, and give him a note to Mr Nokes the overseer.

The vestry finds that a man with ninepence a day from the King cannot come upon the parish; and Mr Nokes says so twice.

Will Tubb drinks the five guineas at the Bell in eleven days. He tells the story of the dollars for a pint; and as it is a good story, he is not often thirsty.`; }},
    {t:'Ask what he saw of the 52nd.', go:() => { add({goodwill:2}); if (E() === 'army' && !F('edmundDead')) reg('edmund',1);
      return `“The 52nd, sir? They were the rear-guard. They was the last off the beach. ${E() === 'army' && !F('edmundDead') ? 'I saw Mr Edmund at Betanzos with a private’s musket on his shoulder. He had given the man his horse.' : 'They never lost a man by straggling. Not one. The Guards neither.'}”

You have him into the kitchen, where he eats for an hour, Mrs Bunce cutting up his meat without being asked.

He goes down the drive in a coat of yours, with both pockets full; and he has not asked for anything.`; }}]},

  {id:'war-wives', once:true, title:'To Go or Not to Go', w:() => yr(1808, 1813), x:() => `When a regiment embarks for foreign service, six wives in each company may go with it; and they draw for it upon the quay, the papers saying “To go” or “Not to go”.

Ann Dewey, who married a private of the 43rd at Hythe, drew “Not to go” at Portsmouth, with a child at the breast; and the regiment gave her a pass to her parish, and three halfpence a mile.

She has walked sixty miles, and is at the vestry door. But Mr Nokes the overseer says that she is a Dewey by birth, and a soldier’s wife by marriage, and that her husband’s parish is in Lancashire.

“It is four shillings a week if we own her, sir. Lancashire may own her for nothing.”`,
    o:[{t:'Hatherley owns her.', go:() => { add({goodwill:4, standing:-1});
      return `“She was christened at that font, Mr Nokes. Enter her.”

She has four shillings a week, and a room at her father’s, and takes in the Hall’s plain sewing.

In the autumn there comes a letter for her from before Burgos, in a serjeant’s hand, which she brings up to be read. It is her husband’s, by dictation; and he asks whether the child has teeth.`; }},
    {t:'Pass her on to Lancashire.', go:() => { add({goodwill:-5, standing:1});
      return `The order of removal is signed by two justices, of whom you are one.

She is passed from constable to constable, and parish to parish, a hundred and eighty miles, which takes five weeks; and at Lichfield the child dies.

In the spring the Lancashire parish writes, that it disputes the settlement, and is sending her back.`; }},
    {t:'Take her on in the Hall laundry.', note:'£8 a year', go:() => { add({money:-8, goodwill:3}); reg('henrietta',1);
      return `She has eight pounds a year, and her keep; and the child sleeps in a clothes-basket, by the copper.

She is the best ironer that the Hall has had, and irons a shirt as it is done for officers, with the frill standing.

Every Saturday she asks the footman to read her the casualty returns of the 43rd; and he reads them slowly, and while he reads she leaves off ironing.`; }}]},

  {id:'war-guineas', hot:true, once:true, title:'Guineas at Twenty-seven Shillings', w:() => yr(1811, 1812), x:() => `There is no gold to be seen. The Bank pays in paper, and has done since ’97; and a guinea is worth twenty-seven shillings in notes to anyone who will melt it, or carry it to Spain, though to sell one over twenty-one is against the law.

Lord King has given his tenants notice, that he will have his rents in gold, or in notes enough to buy it; and the House of Lords has talked of nothing else for a week.

Your tenants pay at Michaelmas, in Tidmarsh’s notes. But your uncle left a stocking of three hundred guineas behind a brick in the wine cellar; and there is a man named Levi at the back door, who is buying.`,
    o:[{t:'Give the tenants Lord King’s notice.', go:() => { add({money:150, goodwill:-8, standing:-2}); reg('thorne',-2,'You asked for your rent in gold');
      return `The notice goes out, for gold, or paper at the market rate.

The tenants cannot get gold, and they pay in notes, a fifth over; which comes to a hundred and fifty pounds.

In July Parliament passes an Act, brought in by Lord Stanhope, that a note is to be taken for what it says upon it; and he named Lord King. Your name is mentioned at the Wyvern farmers’ ordinary, and not by a lord.`; }},
    {t:'Sell Levi the stocking.', note:'£90 over the face of them', go:() => { add({money:90, standing:-1});
      return `It is three hundred guineas, at twenty-seven shillings, in Bank paper, being ninety pounds over the face of them. Levi counts in the scullery, with the door shut, and weighs every one; and eleven being light, he takes those at twenty-two.

The guineas go to Harwich in a cheese, and by Christmas are paying Lord Wellington’s muleteers; as Levi tells you himself, when he comes back to ask if there is another brick.`; }},
    {t:'Take paper, and leave the brick where it is.', go:() => { add({goodwill:3});
      return `The tenants pay at Michaelmas, in Tidmarsh’s notes, and you take them as you always have, though one has been washed in a pocket, and dried upon a hob.

It is known in the parish by evening that the Squire has not done as Lord King did.

You go down to the cellar with a candle, and count the stocking; and finding three hundred, you put the brick back.`; }}]}
];
pooled('war', WAR, 'war', {from:1797, to:1814, weight:7, repeatGap:3, cond:warOn});
/* What a man brings with him. One event for each choice made at the inheritance.
   Written in the Hatherley hand (docs/voice/VOICE.md): plain narrator, inside the year, the wit left to the people and the sums. */
const first = () => S.name.split(' ')[0];
const steward = () => F('crabbeGone') ? 'Lark' : 'Crabbe';

/* ---- his past ---- */

ev({ id:'tSoldier', from:1796, to:1801, weight:5, cond:() => T('soldier'), title:'A Man at the Kitchen Door',
  text:() => `Mrs Bunce sends up to say that there is a soldier in the yard, who will not go away, and will not come in.

He is standing by the pump with his hat off, a man of sixty, with his left sleeve pinned up at the elbow; and he has a magistrate’s pass from Portsmouth to his parish in Shropshire, at a penny a mile.

“Fogg, sir. Serjeant. Your company, the Twenty-third. I had the left of the line at Guilford.”

You had the colours; and when the ball went through your leg, it was he who carried you a quarter of a mile.

“They gave me nothing at Chelsea, sir. They said it was the wrong arm.”`,
  choices:[
    {t:'Give him the south lodge and the keeping of the gate.', note:'£12 a year', go:() => { fl('fogg'); add({money:-12, goodwill:3, family:1}); if (F('volunteers')) add({standing:2});
      return `“There is a lodge at the south gate, Serjeant. Two rooms and a copper.”

He looks at the lodge for some time before he answers.

“I can open a gate, sir.”

He is at the gate next morning before the carrier, and salutes every carriage with the arm that he has.${F('volunteers') ? ` On Sundays he drills the Volunteers on ${ground()}, from a chair.` : ''}`; }},
    {t:'Write to the Board at Chelsea in his behalf.', go:() => { if (chance(0.5 + (S.standing - 40) / 100)) { add({standing:2, goodwill:2});
        return `You write four sides to the Commissioners of Chelsea Hospital, and sign them with your rank.

The answer comes in nine weeks. “Daniel Fogg, late Serjeant, 23rd Foot, is admitted an Out-Pensioner at five pence a day from Lady Day last.”

Fogg has the letter read to him twice, and asks if he may keep the cover that it came in.`; }
      add({goodwill:1});
      return `You write four sides to the Commissioners of Chelsea Hospital, and sign them with your rank.

The answer comes in nine weeks. “The Board regrets that the Man’s name does not appear upon the Regimental return for the year in question.”

Fogg hears it standing, and thanks you for the paper and the ink; and before breakfast he is gone up the Oxford road.`; }},
    {t:'Give him a guinea and his dinner, and let him go on.', note:'£1', go:() => { add({money:-1, goodwill:-1});
      return `He eats in the kitchen, and puts the guinea inside his shoe.

“Thank you, Captain.”

You were a lieutenant. He goes out by the back drive; and for the rest of the day Mrs Bunce does not speak to anybody.`; }}
  ]});

ev({ id:'tCourt', from:1797, to:1806, weight:5, cond:() => T('court') && S.season === 1, title:'A Letter from the Board of Green Cloth',
  text:() => `Windsor Castle, the 2nd of July.

“Sir, I am commanded to acquaint you that His Majesty’s Swans upon the Thames between Staines and Henley are to be taken up, marked and numbered in the third week of this month. The Deputy Keeper is expected to attend the Royal barge in person, in the scarlet coat of his Office.

“The coat is not provided.

“I have the honour to be, Sir, your most obedient humble servant, Jno. Meux, Clerk.”

A tailor in Reading will make the coat for nineteen guineas; and a week at Windsor is forty more.`,
  choices:[
    {t:'Go to Windsor.', note:'£62', go:() => { add({money:-62, standing:6}); reg('henrietta',1);
      return `You stand five days in the bows of a barge, in a scarlet coat, while the swans are caught with a crook, and object to it.

On the Thursday the King is rowed out from Datchet, in a blue coat, with his own hat in his hand.

“What, what? ${S.sur}! The mangel-wurzel man. How do they do in Berkshire? Hey? Do the sheep eat ’em?”

“They do, sir.”

“Good. Good. Tell them to eat the tops.” He is rowed away.

The Reading Mercury prints it on the Monday.`; }},
    {t:'Plead the harvest and stay at home.', go:() => { if (chance(0.4)) { fl('courtLost'); add({standing:-4});
        return `You write that the harvest cannot spare you.

Mr Meux replies by return. “His Majesty has been pleased to appoint Colonel Disbrowe to be Deputy Keeper of the Swans, vice ${S.sur}, who has business.”

The salary stops at Michaelmas.`; }
      add({standing:-1});
      return `You write that the harvest cannot spare you.

Mr Meux replies in three lines, that the Deputy Keeper’s absence has been noted in the book, and that he is to send two guineas for the watermen’s dinner.`; }},
    {t:'Sell the place to a Windsor attorney who has asked for it.', note:'+£400', go:() => { fl('courtSold'); add({money:400, standing:-3});
      return `Mr Tebbutt of Peascod Street gives four hundred pounds for the reversion, by a deed of two skins of parchment.

He has the scarlet coat made the same week, and wears it to church.`; }}
  ]});

ev({ id:'tBred', from:1797, to:1807, weight:5, cond:() => T('bred'), title:'Mr Young Wants Particulars',
  text:() => `There is a letter, franked from the Board of Agriculture in Sackville Street.

“Dear Sir, I am told by Mr Hartopp that you have drilled wheat at nine inches upon the chalk at Hatherley these three seasons. I beg you will favour the Board with the particulars: seed per acre, produce per acre, the expence, and your failures. Gentlemen send me their successes by every post.

“Yours faithfully, Arthur Young.”

Your wheat did well. But your drilled beans upon Gallows Piece came up in June, and were dead by July; and Hartopp does not know about the beans.`,
  choices:[
    {t:'Send him everything, the beans included.', go:() => { add({standing:4}); reg('hartopp',1);
      return `You give him five sides, with the sums ruled.

The Annals of Agriculture print it in the spring number, under the head “Berkshire. Experiments of ${first()} ${S.sur}, Esq.”, with a paragraph for the beans to themselves; and Hartopp rides over with the number in his pocket.

“You told him about the beans.”

“He asked.”

“Nobody tells him about the beans.”

He stays to dinner, and asks to see Gallows Piece.`; }},
    {t:'Answer him by asking the tenants up to see the drill at work.', note:'£20', go:() => { S.improve += 1; add({money:-20, goodwill:3});
      return `Eleven farmers stand at the top of Hall Close upon a Tuesday, and watch the drill go down the field and back.

Nobody says anything. But old Dewey walks out, and puts his thumb into a row.

“How deep?”

“Two inches.”

He measures it against his thumbnail, and walks back.

Four of them send to borrow the drill before Michaelmas; and you write to Mr Young that the particulars will follow.`; }},
    {t:'Send the wheat figures and leave out the beans.', go:() => { add({standing:2});
      return `The Annals print the wheat; and beneath it Mr Young adds a line of his own.

“We should have been glad to hear of this gentleman’s beans.”`; }}
  ]});

ev({ id:'tStranger', from:1795, to:1798, weight:6, cond:() => T('stranger'), title:'Two Ears in the Corn Market',
  text:() => `It is Thursday, in Wyvern corn market, where the farmers stand along the wall of the Exchange with their sample bags open; and as you come by, old Dewey of Starveall steps out, with an ear of corn in each hand, and holds them up to you, level.

“Morning, sir. Which of these be the wheat?”

The wall has gone quiet. ${steward()} is at your elbow. One ear has a beard upon it, and the other has not; and that is all that you can see.`,
  choices:[
    {t:'Point to one.', go:() => { if (chance(0.5)) { add({goodwill:4, standing:1});
        return `You take the one without the beard.

“That.”

Dewey looks at it, and then along the wall.

“So ’tis.”

Somebody at the far end says that a London man might have a brother in the trade. But Dewey puts both ears back in his pocket, and gives you the wall.`; }
      add({goodwill:-3, standing:-1});
      return `You take the one with the beard.

“That.”

“That be barley, sir.”

Nobody laughs until you are past the pump; and then you hear it.

At the rent audit in the spring there is a bearded ear laid across your plate.`; }},
    {t:'“I cannot tell, Mr Dewey. Show me.”', go:() => { add({goodwill:6});
      return `Dewey lowers his hands.

“Well. That’s said plain.”

He gives you the bearded one. “Barley. See her whiskers.” He gives you the other. “Wheat. Bite un.”

You bite it, and it is hard and sweet.

He keeps you twenty minutes upon smut and mildew; and three of the others come off the wall to correct him.`; }},
    {t:'Let the steward answer for you.', go:() => { add({goodwill:-4}); if (!F('crabbeGone')) reg('crabbe',1);
      return `“The left, Mr Dewey,” says ${steward()}. “As you are aware.”

“I asked the squire.”

“The squire employs me to know.”

Dewey puts the ears away, and touches his hat to ${steward()}, and then to you.`; }}
  ]});

/* ---- his fortune ---- */

ev({ id:'tLegacy', from:1795, to:1797, weight:7, cond:() => T('legacy'), title:'The Residuary Legatee',
  text:() => `A hamper comes by the Bath coach, carriage unpaid, three and fourpence, with a letter tied to the handle.

“Bath, Milsom Street. Sir, By the fourth clause of the late Miss Venables’s Will, the Legacy to yourself is charged with the maintenance of her Dog, Pompey, during his natural life. I am to wait upon you each Lady Day to satisfy myself that the animal continues in health. Should he not, the Legacy passes to the Bath Infirmary.

“Your obedient servant, Saml. Stroud, Attorney.”

The hamper is growling. Pompey is a pug, fourteen years old, and very fat; and he bites the footman who lifts him out.`,
  choices:[
    {t:'Keep him at the Hall.', go:() => { fl('pompey'); add({family:-3}); reg('henrietta',-1,'Has a pug of fourteen in her drawing room');
      return `Pompey takes the hearth rug in the drawing room, and holds it.

He bites Dr Gall in October, and the piano tuner at Christmas; and he is carried up and down stairs by John.

On Lady Day Mr Stroud comes out from Bath, and having looked at the dog for a full minute, writes “Alive” in a pocket-book.`; }},
    {t:'Board him with the Widow Harris at two shillings a week.', note:'£5 a year', go:() => { fl('pompey'); add({money:-5, goodwill:2});
      return `The Widow Harris has never had two shillings a week from anybody.

Pompey sleeps in her bed, and has the top of the milk; and by Christmas he is seen walking as far as the gate.

On Lady Day Mr Stroud is taken down to Kennet Bottom to view him, and writes “Alive. Thinner.”`; }},
    {t:'Give him to Kitty for her own.', if:() => K() === 'free', go:() => { fl('pompey'); add({family:3}); reg('kitty',1,'You gave her the Bath pug');
      return `Kitty ties a blue ribbon on him, and he lets her.

She reads to him; and he is carried about the garden in a basket, and bites nobody but the curate.

On Lady Day Mr Stroud writes “Alive” in his pocket-book. Kitty asks him whether he would like to hear the dog sing; and he says that he would not.`; }}
  ]});

ev({ id:'tClear', from:1796, to:1804, weight:5, cond:() => T('clear'), title:'Starveall Comes to the Hammer',
  text:() => `A printed bill is up at the George.

“TO BE SOLD BY AUCTION, by Mr Skinner, on Thursday se’nnight, the FREEHOLD FARM called STARVEALL, 180 Acres, adjoining the Lands of ${first()} ${S.sur}, Esq., and in the occupation of Mr Dewey. None but Principals will be treated with.”

Mr Tidmarsh has come out from the bank about it, and has brought your mortgage deed with him.

“You owe two thousand upon an estate that would carry six, sir. Starveall will fetch fifteen hundred. I should be happy to find it.”`,
  choices:[
    {t:'Buy Starveall on Tidmarsh’s money.', note:'Mortgage +£1,500', go:() => { fl('starveall'); S.mortgage += 1500; S.rentAdj *= 1.09; add({standing:3});
      return `It is knocked down to you at fourteen hundred and eighty, against a brewer from Reading; and the next morning Dewey comes up to the Hall, in his market coat.

“I hear I be yours.”

“You are, Mr Dewey.”

“Same rent?”

“The same.”

He puts his hat back on.`; }},
    {t:'Let Starveall go, and pay off five hundred more instead.', note:'£500', if:() => S.money >= 500, go:() => { S.mortgage = Math.max(0, S.mortgage - 500); add({money:-500});
      return `Tidmarsh counts the notes twice, and writes the sum off upon the back of the deed.

“It is not what I came for, sir.”

Starveall goes to the brewer from Reading, who at Michaelmas raises Dewey’s rent by forty pounds.`; }},
    {t:'Do neither.', go:() => { 
      return `Tidmarsh drinks a glass of sherry, and takes the deed home.

Starveall goes to a brewer from Reading, who puts up a board at the boundary; and the board says PRIVATE.`; }}
  ]});

ev({ id:'tDebts', from:1795, to:1798, weight:6, cond:() => T('debts'), title:'A Second Note of Hand',
  text:() => `A gentleman is shown into the library, whose card says Mr Raikes, of Jermyn Street, and who does not sit down, but lays a paper upon the table.

“I promise to pay Mr Jos. Raikes or bearer Three Hundred Pounds, value received. Barnaby ${S.sur}. Brooks’s, 14th March 1794.”

“Your late uncle, sir. I held it back from the executors out of delicacy.”

You paid seven hundred at the funeral, to a colonel. The signature has your uncle’s B; but the ${S.sur} slopes the other way.`,
  choices:[
    {t:'Pay it. The name is the name.', note:'£300', go:() => { add({money:-300, standing:2});
      return `You write the draft; and he reads it through, and folds it small.

“I knew I had to do with a gentleman.”

He is seen that night at the George, buying for the room.`; }},
    {t:'Ask him to leave the note with you till Tidmarsh has compared the hand.', go:() => { if (chance(0.6)) { add({standing:3});
        return `“By all means,” says Mr Raikes; but he does not let go of the paper.

“The bank has forty of my uncle’s signatures, sir. It will take an afternoon.”

He looks at the clock, and recollects that he is expected at Marlborough.

He takes the note with him, and it is not presented again.`; }
      add({money:-340, standing:-2});
      return `Tidmarsh lays the note beside the signature book, and gets out a glass.

“It is his hand, sir. He wrote so when he had dined.”

Mr Raikes has waited at the George, at your charge; and it is three hundred, and forty more for his time and his attorney’s.`; }},
    {t:'Offer him a hundred and fifty, now, for the paper.', note:'£150', go:() => { add({money:-150});
      return `He considers the ceiling.

“Guineas.”

“Pounds.”

He takes the pounds, and hands you the note; and when you put it upon the fire, he watches it burn, with his head on one side.`; }}
  ]});

ev({ id:'tSecond', from:1796, to:1802, weight:5, cond:() => T('second'), title:'Miss Skrine Gives Notice',
  text:() => `Bath, Gay Street, the 9th of the month.

“Sir, I hold a Mortgage upon your Estate for Two Thousand Pounds at Five per Cent, made to your late Uncle in the year ’84. Money is now worth Six. I am Seventy-three and have my Chair-men to pay.

“I must therefore ask Six per Cent from Michaelmas, or my Principal in Six Months.

“I remain, Sir, your humble servant, Letitia Skrine.”

${steward()} has brought the deed up from the tin box. She may do it.`,
  choices:[
    {t:'Agree to her six per cent.', note:'£20 a year more', go:() => { fl('skrine');
      return `You write that six will be paid.

Her receipt comes at Michaelmas, in the same hand, with a line under her name.

“Punctual. I had not expected it of a ${S.sur}.”`; }},
    {t:'Have Tidmarsh take the mortgage over at five.', note:'£60 in fees', go:() => { add({money:-60});
      return `Tidmarsh pays her off in Bank paper, by a transfer of three skins, which costs sixty pounds in stamps and attorneys.

Miss Skrine sends a receipt for the principal; and having checked the interest to the day, she finds that you owe her four shillings.`; }},
    {t:'Go to Bath and wait upon her, with a basket of Hatherley pears.', note:'£15', go:() => { add({money:-15}); if (chance(0.35 + S.standing / 150)) { add({standing:1});
        return `It is a first floor in Gay Street, where she sits in a wing chair, with a rug over her knees, and a parrot behind her.

She eats a pear with a silver knife, and does not offer you one.

“Your uncle brought me a pine-apple in ’84. It was not ripe.”

“These are ripe, ma’am.”

“So I find.” She wipes the knife. “Five, then. While the pears last.”

You send a basket every October.`; }
      fl('skrine');
      return `It is a first floor in Gay Street, where she sits in a wing chair, with a rug over her knees, and a parrot behind her.

She looks at the pears.

“I cannot eat fruit, sir. Six per cent, from Michaelmas.”

The parrot says “Michaelmas”; and you bring the pears home.`; }}
  ]});

/* ---- his marriage ---- */

ev({ id:'tLove', from:1797, to:1806, weight:5, cond:() => T('lovematch'), title:'Her Mother Sends for Her',
  text:() => `There is a letter for Henrietta from Cheltenham, in her brother’s hand, which she reads standing at the window.

“My mother is sinking. She asks for you. She does not ask for Mr ${S.sur} and I think it better you should come alone. Jas. Venn.”

Mrs Venn had a baronet in view for her daughter in the year ’74; and she has not written your name in twenty years, but directs her letters to “Miss Venn, at Hatherley”.

Henrietta folds the sheet.

“I shall want the chaise at six.”`,
  choices:[
    {t:'Go with her.', go:() => { add({family:5}); if (chance(0.5)) { reg('henrietta',2,'You came with her to Cheltenham, and were let in');
        return `You wait two days in the parlour of the house in Cheltenham; and upon the third the nurse comes down for you.

Mrs Venn is very small in the bed, and looks at you for a long time.

“You have kept her well, sir. I will say that.”

She says nothing more, and on the Sunday she dies. Henrietta holds your arm the whole length of the churchyard.`; }
      reg('henrietta',1,'You came with her to Cheltenham, and waited below');
      return `You wait four days in the parlour of the house in Cheltenham, and are not sent for.

Mrs Venn dies on the Sunday; and her will leaves Henrietta a pair of candlesticks, and you a shilling.

Henrietta puts the shilling in the poor box herself. She rides home with her hand in yours, and does not speak before Cirencester.`; }},
    {t:'Let her go alone, and send a letter up to the old lady by her hand.', go:() => { add({family:3}); reg('henrietta',1);
      return `You write half a sheet, in which you say that Henrietta has been the making of Hatherley, and of you.

Henrietta is gone nine days, and comes home in black.

“Did she read it?”

“James read it to her.”

“What did she say?”

“She said you wrote a good plain hand.” Henrietta takes off her gloves. “She had him read it twice.”`; }},
    {t:'It is the week of the audit. Ask her to wait till Monday.', go:() => { add({family:-9}); reg('henrietta',-3,'You kept her from her mother’s deathbed for the rent audit');
      return `She waits till Monday.

Mrs Venn dies on the Sunday night, and the express meets the chaise at Faringdon.

Henrietta has the horses turned round; and she says nothing about it to you, then or afterwards.`; }}
  ]});

ev({ id:'tPortion', from:1796, to:1804, weight:5, cond:() => T('portion'), title:'Mr Venn Asks for an Account',
  text:() => `Henrietta’s brother writes from Lincoln’s Inn.

“Dear ${S.sur}, I am going through my late father’s papers. By the marriage articles of 1774, two thousand of my sister’s eight were to be settled to her separate use. I find no settlement. I find a receipt from a slater at Newbury.

“I am her trustee. You will oblige me with an account. Yours, Jas. Venn.”

The letter came under cover to you. Henrietta is in the next room, re-covering a chair, with a pan upon the floor beside her to catch the drip.`,
  choices:[
    {t:'Settle a thousand on her now, raised on the estate.', note:'Mortgage +£1,000', go:() => { S.mortgage += 1000; add({family:10}); reg('henrietta',3,'You settled a thousand pounds on her, twenty years late');
      return `Venn draws the deed, for a thousand pounds in the Three per Cents, to her separate use, her receipt alone to be a discharge; and you carry it in to her yourself, and she reads it to the end.

“It was to be two.”

“It was.”

She puts it in her work-box, and turns the key; and with her foot she moves the pan an inch to the left.

“Thank you, ${first()}.”`; }},
    {t:'Send Venn the roof accounts. The money is over her head.', go:() => { add({family:-7}); reg('henrietta',-2,'Learned from her brother where her two thousand pounds went');
      return `You send him nine years of slaters’ bills, tied with tape.

He does not answer you. He writes to his sister.

Henrietta comes in to dinner with the letter in her hand, and lays it by her plate; and she does not open it at table, having no need to.`; }},
    {t:'Take the letter in to her, and ask what she would have.', go:() => { add({money:-200, family:6}); reg('henrietta',2,'You showed her the letter and asked what she wanted');
      return `She reads it, and goes on with the chair until the tack that she is holding is in.

“I knew it was the roof.”

“What will you have, Hetty?”

“My pin money, that you stopped in ’89. Fifty a year. And the arrears.”

You pay her two hundred pounds that night, in notes; and she writes you a receipt.`; }}
  ]});

/* ---- his advantage ---- */

ev({ id:'tBeloved', from:1796, to:1806, weight:5, cond:() => T('beloved'), title:'Will Ayres Before the Bench',
  text:() => `It is Petty Sessions, in the justice room; and the constable has brought in Will Ayres, carter to Mr Pocock.

“Asleep on the shafts, sir, on the turnpike, at ten at night, and no lantern. The Bath mail had to take the bank.”

The fine is ten shillings, and Ayres earns nine in a week.

Now you and Will Ayres robbed the vicarage orchard together in the summer of 1760, and it was he who took the thrashing for both; and he stands with his hat in his hands, and looks at you quite easily.

“’Twas a long day, ${first()}.”

The constable looks at the ceiling.`,
  choices:[
    {t:'“Ten shillings, Ayres. And it is ‘sir’ in this room.”', go:() => { add({standing:2, goodwill:-3}); reg('pryor',-1);
      return `He pays it at a shilling a week, and says “sir” in the justice room and in the lane.

At harvest home, being asked for the song about the squire and the mill pond, he says that he has forgot the words.`; }},
    {t:'Fine him the ten shillings, and send the money down to his wife that night.', note:'10s.', go:() => { add({money:-1, goodwill:3});
      return `“Ten shillings.”

“Yes, sir.”

Mudge takes a half-guinea down to the cottage after dark, and is told to say that it comes from nobody.

On Sunday there is a basket of pippins upon the Hall steps; and they are vicarage pippins.`; }},
    {t:'Dismiss it. The mail may keep a better look-out.', go:() => { add({goodwill:3, standing:-3}); if (!F('gallDead')) reg('gall',-1);
      return `“Discharged.”

“Thankee, ${first()}.”

The constable writes it in the book, and writes the “${first()}” too.

The proprietors of the Bath mail send a letter to the Chairman of Quarter Sessions, who reads it out, at dinner, to eleven magistrates.`; }}
  ]});

ev({ id:'tConnexions', from:1796, to:1808, weight:5, cond:() => T('connexions'), title:'A Cousin of the Marquess',
  text:() => `Stanmore House, Piccadilly.

“My dear ${S.sur}, You are, I think, my cousin, through the Lofts. I write on behalf of another: Mr Peregrine Loft, a young man of the first fashion, who finds it convenient to be out of London for a twelvemonth. There was a misunderstanding at Brooks’s. There was also a tailor.

“He is no trouble in a house. He shoots a little. I shall take it very kindly.

“Stanmore.”

The Marquess has not written to you before; and Mr Loft’s valet has written already, to ask the dimensions of the bedroom.`,
  choices:[
    {t:'Have Mr Loft to stay.', note:'£160', go:() => { add({money:-160, standing:7, family:-4}); reg('henrietta',1);
      return `He comes with a valet, eleven trunks, and a parrot, and rises at one.

He drinks the ’88 claret to the last bottle; he teaches the Miss Tamworths the waltz, until their mother stops it; and the county calls every day of the week to look at his neckcloth.

In March the Marquess sends a haunch, a civil letter, and a draft for the tailor; and Mr Loft leaves on the Tuesday, taking John with him as second footman.`; }},
    {t:'Offer him the Dower House and thirty pounds, and no more.', note:'£60', go:() => { add({money:-60, standing:2});
      return `Mr Loft views the Dower House from his chaise, without getting down.

He stays a month, and is heard to say at the Wyvern Assembly that he is rusticated among the Goths; and then he goes on to a cousin in Wiltshire.

The Marquess does not write.`; }},
    {t:'Regret that the house is full.', go:() => { add({standing:-3});
      return `You regret it in the third person.

The Marquess of Stanmore regrets it also, upon a card. By Sunday Lady Cullerne is found to know the whole matter; and twice, in the church porch, she asks Henrietta after “your cousin the Marquess”.`; }}
  ]});

ev({ id:'tSilver', from:1797, to:1797, weight:9, cond:() => T('silver'), title:'The County Meeting at Reading',
  text:() => `The High Sheriff has called a meeting of the freeholders at Reading town hall, upon a requisition to petition the King to dismiss his Ministers, and make peace with France.

There are six hundred in the hall, and more upon the stairs. Lord Cullerne’s people have a Loyal Address ready to move against it, and Hartopp has the petition in his coat; and each has been to you at the inn.

“You have a voice, ${S.sur}. Speak for us.”

The Sheriff is looking down the hall for the next man; and somebody behind you says your name.`,
  choices:[
    {t:'Speak for the Loyal Address.', go:() => { add({standing:6, goodwill:-3}); reg('cullerne',2,'You spoke for the Loyal Address at Reading'); reg('hartopp',-2);
      return `You speak for twenty minutes, upon the King, the Constitution, and the guillotine; and they cheer the guillotine.

The Address is carried by a show of hats, and Lord Cullerne has you to sit beside him at the ordinary.

“Deuced good. Didn’t know you had it in you.”

Hartopp dines at the other inn.`; }},
    {t:'Speak for peace.', go:() => { add({standing:-4, goodwill:6}); reg('hartopp',2,'You spoke for peace at the county meeting'); reg('cullerne',-2,'You spoke for the peace petition at Reading');
      return `You speak for twenty minutes, and give them the price of the loaf in each year of the war.

The petition is lost by a show of hats; but the back of the hall cheers you out into the street.

The Mercury prints the speech entire; and on Saturday it is read aloud at the Bell by Mr Oakes, who does it very well.`; }},
    {t:'Speak for the King and for peace, both.', go:() => { if (chance(0.6)) { add({standing:3, goodwill:3});
        return `You say that no man loves the King better than he who would spare him a war; and you say it four ways.

Both sides cheer, and each prints the speech as its own.

“Which were you for?” says Henrietta.

“I was very well received.”`; }
      add({standing:-3});
      return `You say that no man loves the King better than he who would spare him a war.

“Which way do you vote, sir?” calls a hatter from the gallery.

You say it again; upon which the hall begins to stamp, and the Sheriff calls the next man.`; }}
  ]});

ev({ id:'tFigures', from:1797, to:1808, weight:5, cond:() => T('figures'), title:'The Overseer’s Book',
  text:() => `It is the Easter vestry; and Mr Nokes the overseer lays the poor book upon the table for the ratepayers to pass, as he has done these nine years, during which nobody has opened it.

You open it.

“To Widow Gurney, 2s. weekly, 52 weeks.” Hannah Gurney was buried in March of last year. “To shoes for Jno. Coombes’s boy, 4s. 6d.” Five times.

You add the right-hand column, upward; and it comes to thirty-eight pounds more than the parish has paid out.

Nokes is the Wyvern grocer, at whose shop half the vestry owe; and he is watching your pencil.`,
  choices:[
    {t:'Read the column out to the vestry.', go:() => { fl('nokesOut'); S.poorMult *= 0.9; add({standing:2, goodwill:4});
      return `You read it out, line by line, until you come to Widow Gurney.

“She’s dead,” says the blacksmith.

“She has had five pound four since.”

Nokes stands up, and says that he keeps the book as his father kept it, and sits down.

The vestry votes Farmer Dewey overseer for the year, and the rate comes down a penny in the pound.`; }},
    {t:'Close the book, and call at the shop tomorrow.', go:() => { S.poorMult *= 0.95; add({goodwill:1});
      return `You call at nine, and Nokes takes you through to the back, among the candles.

You put the paper upon the tea chest; and he reads it, and takes off his apron.

“I can find twenty by Midsummer.”

“Thirty-eight. And I shall add the book each Easter.”

He finds it, and the dead come off the list.`; }},
    {t:'Pass the book with the rest.', go:() => {
      return `You close it, and slide it down the table, and it is passed.

On Saturday Nokes sends a Stilton up to the Hall, with his duty, nothing having been ordered.`; }}
  ]});

/* ---- his failing ---- */

ev({ id:'tPlay', from:1796, to:1810, weight:5, repeatGap:22, cond:() => T('play'), title:'Faro at the Tamworths’',
  text:() => `It is past midnight, in the Tamworths’ card room, where a Major Cathcart of the Militia has set up a faro bank upon the green table, and is dealing from a box.

You came with forty pounds in your pocket-book, and you have eleven. But the queen has lost four times together, and cannot lose a fifth.

Cathcart squares the pack.

“Do you go on, sir? I can take your note.”

Henrietta is in the doorway, with her cloak on.`,
  choices:[
    {t:'Go on, upon a note of hand.', go:() => { if (chance(0.35)) { add({money:310, family:-2});
        return `You put two hundred upon the queen, on paper.

She wins, and wins again; and you get up three hundred and ten pounds to the good, which Cathcart pays in Bank notes, quite as civil as before.

“You will give me my revenge on Thursday.”

Henrietta counts it in the carriage, and keeps it.`; }
      add({money:-260, family:-5}); reg('henrietta',-1,'Stood in the Tamworths’ doorway while you lost two hundred and sixty pounds');
      return `You put two hundred upon the queen, on paper.

She loses; and you put fifty upon the knave, to fetch it back.

You sign for two hundred and sixty pounds at the corner of the table, and Cathcart sands the note for you.

Henrietta has gone out to the carriage, and has taken the rug.`; }},
    {t:'Give Henrietta the pocket-book and get up.', go:() => { add({family:3}); reg('henrietta',1);
      return `You hand it to her across the room, and she puts it in her muff.

“Mrs ${S.sur} does not play?” says Cathcart.

“Mrs ${S.sur} has eleven pounds, sir, and means to keep them.”

In the carriage she gives you back the book, with eleven pounds in it. She has counted.`; }},
    {t:'Ask Cathcart to let you cut the pack.', go:() => { if (chance(0.5)) { add({standing:3});
        return `“Before you deal, Major. Oblige me.”

He holds the box out; and when you turn it over, the queens are all four at the bottom, together.

Nobody speaks. Tamworth rings for the Major’s horse.

Your twenty-nine pounds are returned to you by the Colonel of the regiment, with a letter.`; }
      add({standing:-4});
      return `“Before you deal, Major. Oblige me.”

He hands you the pack, which is as honest as a prayer book.

“Are you satisfied, sir?”

You say that you are, and the table hears you say it; and Tamworth asks whether you will take a glass of something before you go.`; }}
  ]});

ev({ id:'tEnemy', from:1796, to:1806, weight:5, cond:() => T('enemy'), title:'A Pointer in Cuckoo Copse',
  text:() => `Mudge is at the gun room door, with a pointer bitch upon a length of cord, liver and white, in a brass collar.

“Took her in Cuckoo Copse, sir. She had a hen pheasant.”

You turn the collar to the light. “CULLERNE.” And under it, smaller, “Duchess.”

She is the third of that name; and you shot the first in 1768.

“I could lose her, sir,” says Mudge. “Nobody saw.”

She sits down upon your foot.`,
  choices:[
    {t:'Walk her up to the Castle yourself.', go:() => { add({standing:1}); reg('cullerne',3,'You brought his pointer home on a cord, on foot');

/* The rent roll. The squire does not farm these acres. He sets the terms on which other people do.
   Numbers and reasoning: docs/economy/DESIGN.md. The paper model they were balanced on: tools/econsim.js. */

// Wheat before the game opens. It only feeds the trailing averages.
const WHEAT_BEFORE = {1785:43,1786:40,1787:42,1788:46,1789:53,1790:55,1791:49,1792:43,1793:49,1794:52};
const wheatOf = y => PRICES[y] || WHEAT_BEFORE[y] || 76;
const trail = (y, n) => { let s = 0; for (let i = 1; i <= n; i++) s += wheatOf(y - i); return s / n; };
/* Two indices, both 1.0 for the rent a farm in fair order paid in 1795.
   market(y): what the farm would fetch if let this Lady Day. Bidders reason from the last five years, and rents never fell of their own accord while the war lasted.
   means(y): what a tenant can find out of the harvest of year y. The same long view, knocked about by that year's price and weather. */
const warRise = y => 0.02 * Math.min(y, 1813) - 0.02 * 1795 - 0.06 * Math.max(0, y - 1813);
const structOf = y => 0.55 + 0.45 * trail(y, 5) / 50 + warRise(y);
const MARKET = {};
for (let y = FIRST_YEAR; y <= LAST_YEAR + 1; y++){
  const view = y > 1813 ? 0.6 * trail(y, 5) + 0.4 * wheatOf(y - 1) : trail(y, 5), m = 0.55 + 0.45 * view / 50 + warRise(y);
  MARKET[y] = y === FIRST_YEAR ? 1 : y <= 1813 ? Math.min(Math.max(m, MARKET[y - 1]), MARKET[y - 1] * 1.07) : m; }
const market = y => MARKET[y] || 1;
function means(y){ const pe = 0.55 * wheatOf(y) + 0.45 * trail(y, 3), wf = 1 - (1 - (WEATHER[y] || 1)) * 0.3;
  return structOf(y) * Math.pow(pe / trail(y, 5), 1.7) * wf; }

const COND = [0.70, 0.85, 1.0, 1.15, 1.30];
const ORDER_W = ['Ruinous', 'Neglected', 'In fair order', 'In good order', 'In high order'];
const MEANS_W = ['Nothing laid by', 'Pinched', 'Getting by', 'Easy', 'Warm'];
const LEVEL = {easy:0.88, fair:1.0, rack:1.13};
const MAX_FARMS = 8;
const INCOMERS = [['Mr Lanfear', 'Lambourn'], ['Mr Wicks', 'Hungerford'], ['Mr Goddard', 'Aldbourne'], ['Mr Ilsley', 'Speen'], ['Mr Nalder', 'Chieveley'], ['Mr Chivers', 'Shefford'], ['Mr Tubb', 'Inkpen'], ['Mr Hazell', 'Boxford']];
const five = n => Math.round(n / 5) * 5;

function startFarms(){ return [
  // base: the 1795 rent the farm would bear in fair order.
  {id:'longbarrow', name:'Long Barrow', acres:600, base:590, cond:2, rent:540, lease:{type:'term', ends:1802, years:14}, level:'fair', K:700, arrears:0, tenant:'Mr Thorne'},
  {id:'kennet', name:'Kennet Bottom', acres:500, base:560, cond:1, rent:470, lease:{type:'will'}, level:'fair', K:200, arrears:0, tenant:'Widow Harris', she:true},
  {id:'church', name:'Church Farm', acres:550, base:610, cond:2, rent:610, lease:{type:'will'}, level:'fair', K:500, arrears:0, tenant:'Mr Froome', common:true}
]; }
const NEW_FARMS = {
  coldharbour:{name:'Coldharbour', acres:400, base:420, cond:2, tenant:'Mr Buckeridge'},
  starveall:{name:'Starveall', acres:180, base:105, cond:1, tenant:'Mr Dewey'},
  commonpiece:{name:'Common Piece', acres:300, base:230, cond:1},
  rooksnest:{name:'Rooksnest', acres:350, base:330, cond:2, tenant:'Mr Dance'},
  withymead:{name:'Withy Mead', acres:220, base:300, cond:2, tenant:'Mr Puzey'},
  maddle:{name:'Maddle Farm', acres:700, base:480, cond:1, tenant:'Mr Spanswick'}
};
const farm = id => S.farms.find(f => f.id === id);
function incomer(){ const used = S.farms.map(f => f.tenant), free = INCOMERS.filter(n => !used.includes(n[0])); return pick(free.length ? free : INCOMERS); }
function addFarm(id, o){ if (farm(id) || S.farms.length >= MAX_FARMS) return null;
  const d = NEW_FARMS[id], f = Object.assign({id, name:d.name, acres:d.acres, base:d.base, cond:d.cond, level:'fair', arrears:0, own:true, lease:{type:'will'}, tenant:d.tenant || incomer()[0]}, o || {});
  if (!f.rent) f.rent = five(0.95 * lettingValue(f, S.year)); if (f.K === undefined) f.K = 0.5 * f.rent;
  S.farms.push(f); return f; }
/* What the land will carry on mortgage moves with the land. Settled farms carry a little over a quarter of twenty years' purchase of their letting value, since a life tenant can charge only so much;
   a farm bought outright carries two thirds. Sell a farm and the ceiling comes down; buy one, drain one or see rents rise and it goes up. */
const mortCap = () => Math.floor(S.farms.reduce((a, f) => a + (f.own ? 2 / 3 : SETTLED_CARRIES) * 20 * lettingValue(f, S.year), 0) / 500) * 500;
const SETTLED_CARRIES = 0.27;

/* What makes one farm worth more than its acres: its order, the works done on it, the common gone. */
function farmF(f){ let x = COND[f.cond] * (f.mult || 1) * (1 + 0.025 * Math.min(S.improve, 10));
  if (f.common && F('enclosed')) x *= 1.3;
  if (f.id === 'kennet') x *= (F('newMill') ? 1.06 : 1) * (F('meadows') ? 1.08 : 1);
  return x; }
const lettingValue = (f, y) => five(market(y) * farmF(f) * f.base);
const rentDue = f => f.rent * S.rentAdj * (f.rebate ? 0.8 : 1);
const pro = f => f.she ? {he:'she', He:'She', him:'her', his:'her'} : {he:'he', He:'He', him:'him', his:'his'};

/* Older events and works speak in flags. This turns what they said into farms. */
function estateSync(){
  if (!S.farms) { S.farms = startFarms(); S.letQueue = []; S.payQueue = []; }
  const lb = farm('longbarrow'), kb = farm('kennet');
  if (lb && S.seen.thorneLease !== undefined && !lb.thorneDone) { lb.thorneDone = true; lb.arrears = 0; delete lb.void;
    lb.lease = {type:'term', ends:S.year + 7, years:7}; lb.since = S.year;
    if (F('nephewFarm')) { S.rentAdj /= 0.96; lb.rent = five(lb.rent * 0.96); lb.tenant = F('crabbeGone') ? 'Mr Pyke' : 'young Mr Crabbe'; lb.she = false; lb.K = 0.2 * lb.rent; lb.cond = Math.max(0, lb.cond - 1); }
    else { lb.tenant = 'Mrs Thorne'; lb.she = true; } }
  if (kb && S.projectsDone.drain === 'done' && !kb.drained) { kb.drained = true; kb.cond = Math.max(kb.cond, 2); }
  if (kb && F('edmund') === 'farmer' && kb.tenant !== 'Edmund' && !kb.edmundOut) { kb.tenant = 'Edmund'; kb.she = false; kb.arrears = 0; delete kb.void; kb.since = S.year;
    kb.rent = five(0.88 * lettingValue(kb, S.year)); kb.lease = {type:'term', ends:S.year + 14, years:14}; kb.K = kb.rent; }
  bubbleClock();
  if (!S.offered && S.t >= 6) { S.offered = true; later('farmOffered', 0); }
  if (F('starveall') && !farm('starveall') && !S.starveallDone) { S.starveallDone = true; S.rentAdj /= 1.09; addFarm('starveall'); }
}

/* Lady Day business: leases run out, rents from year to year are moved, farms mend or go back. */
function ladyDay(){ const y = S.year, st = steward(), up = [];
  for (const f of S.farms){ if (f.void) continue; const p = pro(f);
    if (f.rebate && y >= f.rebate) delete f.rebate;
    if (f.lease.type !== 'will' && y >= f.lease.ends) { f.lease = {type:'will'}; f.level = 'fair'; askLet(f.id, 'out'); continue; }
    if (f.lease.type === 'will' && !S.letQueue.some(x => x.id === f.id)) { const target = LEVEL[f.level] * lettingValue(f, y), was = f.rent;
      f.rent = five(target > f.rent ? Math.min(target, f.rent * 1.12) : Math.max(target, f.rent * 0.9));
      if (f.rent !== was) up.push(f.name + ' to ' + fmt(f.rent));
      if (f.level === 'rack' && f.cond > 0 && chance(0.12)) { f.cond--; S.notes.push(`${f.name} is going back. ${st} counted three fields in wheat after wheat.`); }
      else if (f.level !== 'rack' && f.cond < 2 && f.id !== 'kennet' && chance(0.2)) f.cond++; }
    const secure = f.lease.type !== 'will' && f.lease.ends - y >= 5 && f.lease.years >= 14;
    if (secure && f.K > 1.4 * f.rent && f.cond >= 1 && f.cond < 4) { f.K -= 0.9 * f.rent; f.cond++;
      S.notes.push(`${f.tenant} has drained and fenced at ${f.name} at ${p.his} own cost. ${st} enters the farm as ${ORDER_W[f.cond].toLowerCase()}.`); } }
  if (up.length) S.notes.push('Rents from year to year, moved this Lady Day: ' + up.join('; ') + '.'); }

function relet(f){ const n = incomer(); f.cond = Math.max(0, f.cond - 1); f.tenant = n[0]; f.she = false; f.arrears = 0; f.lease = {type:'will'}; f.level = 'fair'; f.since = S.year; delete f.void; delete f.rebate;
  f.rent = five(0.9 * lettingValue(f, S.year)); f.K = 0.3 * f.rent;
  S.notes.push(`${f.name} is let again, to ${n[0]} of ${n[1]}, from year to year at ${fmt(f.rent)}.`); }
function quit(f){ f.void = 2; f.arrears = 0; if (f.tenant === 'Mrs Thorne') reg('thorne', -2, 'Broke at Long Barrow under your rent'); }

/* The two rent days. Called from beginSeason with the ledger's own line(). */
function rentDay(line){
  estateSync();
  const y = S.year, q = S.season, hy = q === 0 ? y - 1 : y;   // Lady Day rents are paid out of last year's harvest
  if (q === 0) ladyDay();
  let racked = 0, easy = 0, n = 0, asked = false;
  for (const f of S.farms){
    const able = means(hy) * farmF(f) * f.base * (0.86 + S.goodwill / 350);
    if (f.flush) f.K = Math.max(f.K, 2 * f.rent);   // a post-captain with a prize in the agent's hands pays reliably until the peace (src/events4.js)
    if (f.void) { const v = Math.max(-0.075 * f.base, 0.175 * (able - 0.4 * f.base)); line(f.name + ', in hand', v); S.yearIncome += Math.round(v); f.void--; if (!f.void) relet(f); continue; }
    if (f.lease.type === 'corn') f.rent = five(LEVEL[f.lease.level] * 0.86 * f.base * farmF(f) * (0.5 * means(hy) + 0.5 * market(y)));
    const due = rentDue(f) / 2, surplus = able / 2 - due, val = lettingValue(f, y); let got = due;
    n++; if (rentDue(f) > 1.06 * val) racked++; else if (rentDue(f) < 0.92 * val) easy++;
    if (surplus >= 0) { const back = Math.min(f.arrears, surplus * 0.5); f.arrears -= back; got += back; f.K = Math.min(1.6 * f.rent, f.K + 0.3 * (surplus - back)); }
    else { f.K += surplus; if (f.K < 0) { const short = Math.min(due, -f.K); f.K = 0; got -= short; f.arrears += short;
      if (short >= 1) S.notes.push(`${f.tenant} of ${f.name} is ${fmt(short)} short this half-year.`); } }
    line(f.name + ', ' + f.tenant, got); S.yearIncome += Math.round(got);
    if (f.arrears > 0.9 * f.rent) { S.notes.push(`${f.tenant} has left ${f.name} owing ${fmt(f.arrears)}. The key was on a nail in the porch. The farm is in hand.`); quit(f); add({goodwill:-3}); }
    else if (!asked && f.arrears > 0.25 * f.rent && (f.asked === undefined || S.t - f.asked >= 4) && !S.payQueue.includes(f.id)) { asked = true; f.asked = S.t; S.payQueue.push(f.id); later('cannotPay', 0); }
  }
  if (S.trust) { const d = S.trust * (CONSOL_YIELD[y] || 5) / 200; line('Dividends from the trustees of the settlement', d); S.yearIncome += Math.round(d); }
  if (n) add({goodwill: Math.round(-4 * racked / n + 2 * easy / n)});
}

/* ---------- what the book shows, and what the squire may do from it ---------- */
function tenureOf(f){ if (f.void) return 'In hand'; const l = f.lease;
  return l.type === 'will' ? 'From year to year' : (l.type === 'corn' ? 'Corn rent' : 'Lease') + ' to Lady Day ' + l.ends; }
function rentRoll(){ estateSync(); const y = S.year, open = S.phase !== 'end' && !S.dead;
  return S.farms.map(f => { const will = !f.void && f.lease.type === 'will', waiting = S.letQueue.some(x => x.id === f.id);
    return {id:f.id, name:f.name, acres:f.acres, tenant:f.void ? '' : f.tenant, rent:f.void ? 0 : Math.round(rentDue(f)), value:lettingValue(f, y),
      tenure:tenureOf(f), order:ORDER_W[f.cond], means:f.void ? '' : MEANS_W[Math.min(4, Math.floor(f.K / Math.max(1, f.rent) / 0.3))],
      arrears:Math.round(f.arrears), level:f.level, own:!!f.own, abated:!!f.rebate, waiting, canLevel:open && will && !waiting, canOffer:open && will && !waiting}; }); }
const LAND = {longbarrow:'Down and sheepwalk', kennet:'Wet clay, with the mill', church:'Strips in the open field', coldharbour:'Sound loam beyond the turnpike', starveall:'Thin chalk on the hill', commonpiece:'New ground off the common', rooksnest:'Mixed land under the hanger', withymead:'Meadow and osiers on the Lambourn', maddle:'Open down, nine miles from a market'};
/* For the Farms leaf of the book. held is ready to print; the rest is there for the page to draw as it likes. */
function farmsList(){ return rentRoll().map(f => { const bits = [f.tenure === 'In hand' ? 'In hand, no tenant' : f.tenure, f.order];
    if (f.abated) bits.push('A fifth abated'); if (f.arrears) bits.push('In arrear ' + fmt(f.arrears)); if (f.waiting) bits.push('Terms to be settled this quarter');
    const s = sellState(f.id);
    return Object.assign(f, s, {evict:evictCost(f.id), land:(f.id === 'church' && F('enclosed') ? 'Inclosed arable' : LAND[f.id]), tenant:f.tenant || 'No tenant', held:bits.join('. ')}); }); }
/* Turning a tenant out. It may be done to any let farm at any time, and it is dear: the parish takes it hard and remembers it, the county thinks the less of a landlord who does it,
   a lease must be bought out at half a year's rent, arrears are lost, and the farm lies in hand a year before it lets again in worse order.
   evictCost(id) is what the page prints on the button. evictTenant(id, quiet) does it and returns what happened, or false. With quiet set it keeps no journal and draws nothing, for use from an event. */
const TENANT_IS = f => /Thorne/.test(f.tenant) ? 'thorne' : f.tenant === 'Edmund' ? 'edmund' : /Crabbe/.test(f.tenant) ? 'crabbe' : '';
function evictCost(id){ const f = farm(id), open = S.phase !== 'end' && !S.dead; if (!f) return {can:false, fx:[]};
  const can = open && !f.void && !!f.tenant && !S.letQueue.some(x => x.id === id), buy = f.lease.type === 'will' ? 0 : five(rentDue(f) / 2), who = TENANT_IS(f);
  const fx = [MINUS + (f.she ? '15' : '12') + ' Goodwill', MINUS + '4 Standing', MINUS + ' The parish remembers it', MINUS + ' In hand a year, then let in worse order'];
  if (buy) fx.push(MINUS + fmt(buy) + ' to buy out the lease'); if (f.arrears >= 1) fx.push(MINUS + fmt(f.arrears) + ' of arrears lost');
  if (who === 'thorne') fx.push(MINUS + ' Abigail Thorne'); if (who === 'edmund') fx.push(MINUS + ' Edmund', MINUS + ' Henrietta', MINUS + '8 Household'); if (who === 'crabbe') fx.push(MINUS + ' Mr Crabbe');
  return {can, fx, buy, why:can ? '' : !open ? 'The books are closed.' : f.void || !f.tenant ? 'There is no tenant to turn out.' : 'Terms are being settled this quarter.'}; }
function evictTenant(id, quiet){ const c = evictCost(id); if (!c.can) return false; const f = farm(id), p = pro(f), who = TENANT_IS(f), was = f.tenant, st = steward();
  S.money -= c.buy; add({goodwill: f.she ? -15 : -12, standing:-4}); S.evicted = (S.evicted || 0) + 1;
  if (who === 'thorne') reg('thorne', -4, 'Turned out of Long Barrow'); if (who === 'crabbe' && !F('crabbeGone')) reg('crabbe', -3, 'His nephew turned out of Long Barrow');
  if (who === 'edmund') { reg('edmund', -4, 'Turned out of Kennet Bottom by his father'); reg('henrietta', -2, 'You turned Edmund out of his farm'); add({family:-8}); f.edmundOut = true; }
  f.void = 2; f.arrears = 0; f.lease = {type:'will'}; f.level = 'fair'; delete f.rebate; S.payQueue = S.payQueue.filter(x => x !== id);
  const said = `${st} serves the notice at ${f.name} on Tuesday. ${cap1(was)} reads it in the yard and puts it in ${p.his} pocket.

The sale of stock is on the Friday week. By the month’s end the house is shut and the key hangs in the estate office. The farm is in hand.`;
  if (!quiet) { S.journal.unshift({when:stamp(), title:'The Rent Roll', did:'Turned out ' + was + ' of ' + f.name}); save(); render(); }
  return said; }
const rentalNow = () => rentRoll().reduce((a, f) => a + f.rent, 0);
/* The old three-way rent policy still answers: it sets every farm held from year to year. */
function setRentAll(v){ const lvl = v < 1 ? 'easy' : v > 1 ? 'rack' : 'fair'; for (const f of S.farms) if (!f.void && f.lease.type === 'will') f.level = lvl; }
function setLevel(id, lvl){ const f = farm(id); if (!f || !LEVEL[lvl] || f.void || f.lease.type !== 'will') return; f.level = lvl; save(); render(); }
function askLet(id, why){ if (S.letQueue.some(x => x.id === id)) return; S.letQueue.push({id, why}); later('leaseFalls', 0); }
function offerLease(id){ const f = farm(id); if (!f || f.void || f.lease.type !== 'will') return; askLet(id, 'offer');
  S.journal.unshift({when:stamp(), title:'Rent roll', did:'Sent word to ' + f.tenant + ' about a lease of ' + f.name}); save(); render(); }

/* ---------- papers ---------- */
function letting(){ while (S.letQueue && S.letQueue.length){ const x = S.letQueue[0], f = farm(x.id); if (f && !f.void && f.lease.type === 'will') return {f, why:x.why}; S.letQueue.shift(); } return null; }
function owing(){ while (S.payQueue && S.payQueue.length){ const f = farm(S.payQueue[0]); if (f && !f.void && f.arrears >= 1) return f; S.payQueue.shift(); } return null; }
function sign(f, type, years, level, rent){ f.lease = type === 'will' ? {type:'will'} : {type, ends:S.year + years, years, level}; f.level = level; if (rent) f.rent = rent; if (!f.since) f.since = 1788; S.letQueue.shift(); }
const covenants = `no two white straw crops together, no hay or straw sold off the farm, the hedges kept`;

ev({ id:'leaseFalls', follow:true, cond:() => !!letting(),

/* ---------- credit, and ruin by stages ---------- */
// Years when Consols yielded five per cent or more. The law holds a mortgage to five, so nobody lends on land.
const TIGHT = [1797, 1798, 1799, 1803, 1804, 1805, 1812, 1813, 1815];
const moneyTight = y => TIGHT.includes(y);
/* Credit never shuts altogether. When the bank will not lend at the legal five per cent, a private lender will, and his attorney takes a tenth for finding him.
   When the land will carry no more, there is still an annuity on the squire's life, and the oaks. */
const capWithout = f => { const i = S.farms.indexOf(f); S.farms.splice(i, 1); const c = mortCap(); S.farms.splice(i, 0, f); return c; };
const canBorrow = () => S.mortgage + 500 <= mortCap();
const borrowGets = () => moneyTight(S.year) || F('cut') ? 450 : 500;
const borrowNote = () => !canBorrow() ? '' : F('cut') && !moneyTight(S.year) ? 'Mr Tidmarsh is not at home to you. A lender at Newbury will find £500 on the land, and his attorney keeps £50 of it.' : moneyTight(S.year) ? 'Money is tight. A private lender at Newbury will find £500 on the land, and his attorney keeps £50 of it.' : 'Mr Tidmarsh lends at five per cent.';
const borrowWhy = () => canBorrow() ? '' : 'The land will carry no more on mortgage. An annuity may still be sold, or timber.';
const FLIP = 12;   // seasons
const lately = f => !!f.paid && S.t - f.boughtT < FLIP;
const grossPrice = f => { const g = Math.round((moneyTight(S.year) ? 17 : 20) * (f.void ? 0.9 * lettingValue(f, S.year) : Math.min(rentDue(f), lettingValue(f, S.year))) / 10) * 10; return lately(f) ? Math.min(g, f.paid) : g; };
/* A farm under lease is sold with the tenant bought out: a year's rent, and a quarter more for each further year he had to run, up to three years. */
const buyOut = f => f.void || f.lease.type === 'will' ? 0 : Math.round(Math.min(3, 1 + 0.25 * Math.max(0, f.lease.ends - S.year - 1)) * f.rent / 10) * 10;
const salePrice = f => Math.max(0, grossPrice(f) - buyOut(f));
const boughtFarm = () => S.farms.filter(f => f.own).sort((a, b) => b.base - a.base)[0];
const settledFarm = () => S.farms.length > 1 ? S.farms.filter(f => !f.own && f.tenant !== 'Edmund').sort((a, b) => b.base - a.base)[0] : null;
const edmundSigns = () => settledFarm() && (F('edmundDead') || S.chars.edmund.r > -3);
function conveyFarm(f){ const p = salePrice(f); S.farms.splice(S.farms.indexOf(f), 1);
  for (const id in VENTURES) if (VENTURES[id].of === f.id && live(id)) { stopVenture(id, 'Sold with the farm'); if (id === 'plough') delete f.mult; } S.money += p; S.soldFarms = S.soldFarms || {}; S.soldFarms[f.id] = f; return p; }
/* Called each quarter before the season's paper is chosen. Bills first, then the tradesmen, then the land, then the packet to Douglas. */
function creditCheck(){
  const first = id => { S.queue = S.queue.filter(x => x.id !== id); S.queue.unshift({id, at:S.t}); };
  if (S.money < -3000) { if (boughtFarm() || edmundSigns()) first('hammer'); else S.dead = 'ruin'; }
  else if (S.money < -1500 && (S.stoppedAt === undefined || S.t - S.stoppedAt >= 8)) { S.stoppedAt = S.t; first('georgeMeeting'); }
  if (S.season === 0 && moneyTight(S.year) && !moneyTight(S.year - 1)) S.notes.push('Consols are below sixty. Mr Tidmarsh writes that he can find nothing on mortgage while the Funds pay better than five per cent. An attorney at Newbury knows a private lender, at a price.');
}

ev({ id:'georgeMeeting', follow:true, cond:() => S.money < -800, title:'The Meeting at the George',

    {t:'Put down the carriage and shut up half the house.', note:() => '+£200, and ' + fmt(estCost(estIdx(), S.year) - estCost(estIdx() - 1, S.year)) + ' a year saved', if:() => estIdx() > 0, go:() => { stepEst(-1); add({money:200, standing:-2});

/* ---------- ventures: each can make him, and each can break him ---------- */
const wageIdx = y => 0.55 + 0.45 * trail(y, 5) / 50;
const vent = id => S.vent && S.vent[id];
const live = id => vent(id) && !vent(id).ended;

  merino:{ fx:["+£110 a year in wool", "+£150 a year in rams, 1806 to 1810", "+£400 to £1,400 if sold in time", "− Worth £60 once the fashion ends"], risk:3, odds:{"well": 0.4, "dull": 0.3, "ill": 0.3}, effects:`About £110 more wool each summer, and £150 a year in rams from 1806. The flock sells for £400 to £1,400 while the fashion lasts. If the fashion ends, the wool and the flock are worth next to nothing.`, name:'Merinos', line:'Spanish sheep of the King’s breed, small and close-woolled. You buy a ram and forty ewes from a flock in Wiltshire.', where:'The home farm', cost:420, if:() => S.year >= 1800,

    begin:() => { fl('merino'); }, state:v => 'A flock since ' + v.year,
    endLabel:'Sell the flock', end:v => { const y = S.year, p = y > 1810 ? 60 : Math.min(y <= 1805 ? 400 : 400 + 200 * (y - 1805), 400 + 200 * (y - v.year)); fl('merino', false); S.money += p;
      return `The merino flock is sold at Reading. It makes ${fmt(p)}.`; }},
  peat:{ fx:["+£170 a year, nine years", "− Kennet Bottom falls a grade after"], risk:2, odds:{"well": 0.6, "dull": 0.2, "ill": 0.2}, effects:`About £170 a year for nine years. Then the peat is gone and Kennet Bottom falls a grade, unless the water meadows have been floated.`, name:'Cut the peat', line:'Peat lies six feet deep under the river meadow. It is cut in summer, dried and sold in Newbury for firing.', where:'Kennet Bottom', cost:300, if:() => !!farm('kennet'),

  forage:{ fx:["+£130 in a year of war", "−£60 for a refused load", "−£220 in a year of peace"], risk:1, odds:{"well": 0.75, "dull": 0.15, "ill": 0.1}, effects:`£130 in a year of war. A refused delivery now and then, £60 lost. £220 lost in any year of peace.`, name:'Forage for the barracks', line:'A contract with the commissary at Reading. You deliver hay, oats and straw to the cavalry barracks at a fixed price.', where:'The estate', cost:200, if:() => S.year < 1814,
    well:'£130 a year, as long as there is cavalry at Reading.', ill:'The contract binds you to deliver at the price agreed, in peace or war.', state:v => 'Under contract since ' + v.year,

    endLabel:'Withdraw from the bank', canEnd:() => !moneyTight(S.year), endWhy:'No partner can be let go while money is tight.',

  spa:{ fx:["+£300 a year rising to £750, if the waters take", "+£90 a year if they half take", "−£60 a year if they fail"], risk:3, odds:{"well": 0.3, "dull": 0.5, "ill": 0.2}, effects:`If the waters take: £300 a year rising to £750, and standing. If they half take: £90 a year. If they fail: £60 a year lost until the pump room is shut.`, name:'The Hatherley Spa', line:'The spring below the Hall tastes of iron. You build a pump room over it and lodgings for invalids who come to drink.', where:'The estate', cost:1800,
    well:'If the waters take, £300 a year rising to £750.', ill:'Bath is thirty miles off, and Cheltenham had the King.',
    begin:v => { const r = Math.random(); v.fate = r < 0.3 ? 'hit' : r < 0.8 ? 'dull' : 'flop'; }, state:v => 'A pump room since ' + v.year,
    endLabel:'Shut the pump room', end:() => `The pump room is shut and the attendant paid off. The spring runs into the ditch as before.` }
};
function venturesList(){ const open = S.phase !== 'end' && !S.dead;
  return Object.keys(VENTURES).map(id => { const d = VENTURES[id], v = vent(id), state = !v ? 'open' : v.ended ? 'ended' : 'inHand';
    const off = state === 'open' && !!soldWhy(d); let why = ''; if (state === 'open') { if (off) why = soldWhy(d); else if (!open) why = 'The books are closed.'; else if (d.if && !d.if()) why = 'Not to be had at present.'; else if (S.money < d.cost) why = 'The purse will not stand ' + fmt(d.cost) + '.'; }

    return {id, name:d.name, where:d.where, line:d.line, cost:d.cost, well:d.well, ill:d.ill, effects:d.effects, fx:fxOf(d.fx), risk:d.risk, odds:d.odds, state, off, can:state === 'open' && !why, why,
      note:state === 'inHand' ? d.state(v) : state === 'ended' ? (v.how || 'Given up') + ', ' + v.ended : '',
      canEnd, endLabel:state === 'inHand' && d.end ? d.endLabel + (d.endCost ? ', ' + fmt(d.endCost) : '') : '', endWhy:state === 'inHand' && d.end && !canEnd && d.canEnd && !d.canEnd() ? d.endWhy : ''}; }); }
function beginVenture(id){ const x = venturesList().find(v => v.id === id); if (!x || !x.can) return false; const d = VENTURES[id];

function stopVenture(id, how){ const v = vent(id); v.ended = S.year; v.how = how; }

/* The quarter's reckoning of every venture in hand. */
function ventureTick(line){ if (!S.vent) return; const y = S.year, q = S.season, n = id => y - vent(id).year, st = steward(), earn = (label, a) => { line(label, a); if (a > 0) S.yearIncome += Math.round(a); };
  const lb = farm('longbarrow'), kb = farm('kennet');
  if (vent('plough') && lb && q === 0) { const v = vent('plough');
    if (!v.ended) { lb.mult = n('plough') <= 7 ? 1.25 : 0.7; if (n('plough') === 8) S.notes.push(`The wheat on the down at Long Barrow has come up thin and yellow. ${st} has taken near half off his valuation of the farm.`); }
    else if (lb.mult !== 1 && y >= v.heal) { lb.mult = 1; S.notes.push('There are sheep on the down at Long Barrow again.'); } }
  if (live('merino') && q === 1 && y >= 1806 && y <= 1810 && n('merino') >= 1) earn('Merino rams sold at the shearing', 150);
  if (live('merino') && !F('merino')) stopVenture('merino', 'The flock gone');
  if (live('peat') && q === 2 && n('peat') >= 1) { if (n('peat') <= 9) earn('Peat and ashes from Kennet Bottom', 170 * (0.8 + 0.4 * Math.random()));
    else { stopVenture('peat', 'Dug out'); if (kb && !F('meadows')) kb.cond = Math.max(0, kb.cond - 1);
      S.notes.push(`The peat at Kennet Bottom is dug out. Forty acres of the old meadow are water and rushes.${F('meadows') ? ' The floated meadows above are untouched.' : ''}`); } }
  if (live('forage') && q === 3 && n('forage') >= 1) {
    if (y === 1802 || y === 1814) { line('Forage left on hand at the peace', -220); S.notes.push('The cavalry have marched out of Reading barracks. The hay bought for them is sold at Newbury for what it will fetch.'); if (y === 1814) stopVenture('forage', 'Ended with the war'); }
    else if (chance(0.1)) { line('Forage refused by the commissary', -60); S.notes.push('The commissary has refused two loads of hay as mouldy.'); }
    else earn('Forage contract, Reading barracks', 130); }
  if (live('thresher') && q === 3) { earn('Wages saved by the threshing machine', 45 * wageIdx(y));
    if (y >= 1811 && S.goodwill < 45 && chance(0.25)) { stopVenture('thresher', 'Broken and burnt'); line('The great barn, and the machine in it', -300); add({goodwill:-2});
      S.notes.push('The threshing machine was broken up in the night and the great barn fired. Nobody in Hatherley saw anything.'); } }
  if (live('bank')) { const v = vent('bank');
    if (q === 3) { earn('Share of profits, Wyvern Bank', 150); add({standing:1}); }
    if (q === 1 && ((y === 1797 && chance(0.2)) || (y === 1810 && chance(0.15))) && v.year < y) { line('Paid in to meet a run on the Wyvern Bank', -500); S.notes.push('There was a run on the Wyvern Bank on Saturday. Each partner has paid in £500 to meet it.'); }
    if (q === 2 && y === 1815 && chance(0.45)) { const c = 1500 + Math.round(Math.random() * 25) * 100; stopVenture('bank', 'The bank broke'); line('Call on the partners of the Wyvern Bank', -c); add({standing:-8});
      S.notes.push(`The Wyvern Bank stopped payment on Tuesday. The shutters are up and there is a crowd in the market place holding its notes. Your share of ${fmt(1000)} is gone and the partners are called on for ${fmt(c)} each.`); } }
