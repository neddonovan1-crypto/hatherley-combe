    if (v.fate === 'hit') { earn('Hatherley Spa, the season', Math.min(750, 300 + 75 * (k - 1))); if (k === 1) { add({standing:4}); S.notes.push('A physician at Bath has published a pamphlet on the Hatherley waters. Eleven families have taken lodgings in the village for the season.'); } }
    else if (v.fate === 'dull') { earn('Hatherley Spa, the season', 90); if (k === 1) S.notes.push('The pump room at Hatherley Spa took £90 this season. Most of it came from Wyvern people on Sundays.'); }
    else { line('Hatherley Spa, the attendant and the fires', -60); if (k === 1) S.notes.push('Nine persons drank the waters at Hatherley Spa this season. One of them has written to the Mercury about the taste.'); } }
}

/* ---------- the establishment: what the Hall costs to keep, and what the county thinks of it ---------- */
const EST = [
  {id:'retrenched', name:'a retrenched household', cost:800, standing:25, line:`Half the rooms are shut and the carriage is put down. A cook, one maid and a boy.`},
  {id:'plain', name:'a plain establishment', cost:1100, standing:42, line:`A cook, two maids, a man and a gardener. One joint a day, and company once a month.`},
  {id:'handsome', name:'a handsome establishment', cost:1500, standing:60, line:`A butler, a footman and a housekeeper. Two courses at dinner, a carriage and pair, and the county asked to dine.`},
  {id:'splendid', name:'a splendid establishment', cost:2100, standing:80, line:`Eleven indoor servants in livery and a French cook. Wax candles in every room and the house open to the county.`}
];
const estIdx = () => Math.max(0, EST.findIndex(e => e.id === (S.est || 'plain')));
const priceRise = y => 1 + 0.032 * (y - FIRST_YEAR);
const estCost = (i, y) => Math.round(EST[i].cost * priceRise(y) * (T('figures') ? 0.9 : 1) * (T('captain') && !F('crewGone') ? 0.9 : 1) / 10) * 10;
function establishment(){ const i = estIdx(); return {id:EST[i].id, name:EST[i].name, cost:estCost(i, S.year), levels:EST.map((e, k) => ({id:e.id, name:e.name, cost:estCost(k, S.year), now:k === i}))}; }
const EST_DOWN = [
  `The carriage is sold and the horses with it. Three servants are paid off at the month. The family dines in the breakfast parlour on one course. Henrietta returns no calls that want a carriage.`,
  `The second footman goes, and the under-gardener. The claret is kept for company. Henrietta goes through Mrs Bunce’s book line by line and strikes out the wax candles.`,
  `The man cook is given his wages and his coach fare. The house in Brook Street is given up at Lady Day. There are still two footmen in the hall.`];
const EST_UP = [null,
  `The shutters are opened in the dining room. A footman is hired at Wyvern, and a pair of carriage horses bought at Reading fair for sixty guineas.`,
  `A second footman is hired and put into livery. The carriage is new painted, with the arms on the door. Henrietta sends cards for a dinner of sixteen.`,
  `A man cook comes down from London at eighty guineas a year. There are four horses to the carriage and a house taken in Brook Street for the season. The Mercury notices the family’s arrival in town.`];
const EST_SETUP = [0, 150, 250, 400];
function stepEst(d){ const i = estIdx() + d; S.est = EST[i].id;
  if (d < 0) { add({standing:-4, family:i === 0 ? -6 : -4}); reg('henrietta', -1, i === 0 ? 'You sold her carriage' : undefined); return EST_DOWN[i]; }
  add({money:-EST_SETUP[i], standing:3, family:4}); reg('henrietta', 1); return EST_UP[i]; }
/* Altering the establishment takes the season. These join the season's undertakings. */
function estOptions(){ const i = estIdx(), y = S.year, o = [];
  if (i > 0) o.push({t:'Reduce to ' + EST[i - 1].name, note:'Saves ' + fmt(estCost(i, y) - estCost(i - 1, y)) + ' a year', hint:'Costs Standing and Household', run:() => stepEst(-1)});
  if (i < EST.length - 1) o.push({t:'Set up ' + EST[i + 1].name, note:fmt(estCost(i + 1, y) - estCost(i, y)) + ' a year more, and ' + fmt(EST_SETUP[i + 1]) + ' down', hint:'Standing, Household', run:() => stepEst(1)});
  return o; }
/* The quarter's cost of the Hall, and the pull of the establishment on the county's opinion. */
function householdQuarter(line){ const i = estIdx(), tgt = clamp(EST[i].standing + societyMark() - 6 * (S.settledSold || 0), 5, 95);
  if (S.annuities) line(S.annuities > 1 ? 'Annuities on your life, ' + numWords(S.annuities) : 'Annuity on your life', -25 * S.annuities);
  line('The Hall: ' + EST[i].name, -(estCost(i, S.year) / 4 - (F('bricked') ? 3 : 0)));
  if (T('jointure')) line('Your uncle’s widow, her jointure', -30);
  if (T('taste')) line('Milliners and mantua-makers', -30);
  if (T('bottle')) line('The wine merchant', -10);
  if (T('lawsuit') && S.season === 3) line('Costs in the matter of the pew', -40);
  if (T('brother') && S.season === 0) line('Lent to Henrietta’s brother', -(40 + Math.floor(Math.random() * 12) * 10));
  { const sc = houseCost('schoolroom'); if (sc) line(sc > 0 ? 'The schoolroom: governess and masters' : 'Saved by sending the governess away', -sc / 4); }
  { const sv = houseCost('servants'), sb = houseCost('stables'); if (sv) line(sv > 0 ? 'Servants’ wages above the county rate' : 'Saved on servants’ wages', -sv / 4); if (sb) line(sb > 0 ? 'The stables: corn, a second groom, the farrier' : 'Saved in the stables', -sb / 4); }
  if (S.t > 0) societyQuarter(line); }
/* The home farm pays its men by the week, and the vicar his tenth. */
const weekWage = y => Math.round(9 * wageIdx(y) / wageIdx(FIRST_YEAR));
function homeFarmCosts(line){ const y = S.year, s = weekWage(y);
  const paid = s + houseOf('labour').shillings; line('Home farm wages, nine men at ' + paid + 's. the week', -(9 * paid * 13 / 20) * (live('thresher') ? 0.94 : 1));
  if (S.season === 3 && !F('enclosed')) line('Tithe on the home farm', -45 * PRICES[y] / 75); }

/* ---------- the land market: buy at any time, sell any farm ---------- */
const MARKET_FARMS = ['coldharbour', 'rooksnest', 'withymead', 'maddle'];
const landFor = id => (S.soldFarms && S.soldFarms[id]) || Object.assign({id, level:'fair', arrears:0, lease:{type:'will'}}, NEW_FARMS[id]);
const askPrice = (f, years) => Math.round((years || (moneyTight(S.year) ? 19 : 22)) * lettingValue(f, S.year) / 10) * 10;
const loanOn = price => moneyTight(S.year) ? 0 : Math.floor(price * 0.6 / 100) * 100;   // the bank lends half on the farm itself, when it lends at all
function farmsForSale(){ estateSync(); const open = S.phase !== 'end' && !S.dead;
  const ids = MARKET_FARMS.concat(Object.keys(S.soldFarms || {}).filter(id => !MARKET_FARMS.includes(id))).filter(id => !farm(id));
  return ids.map(id => { const f = landFor(id), price = askPrice(f), trust = Math.min(S.trust || 0, price), loan = loanOn(price - trust), down = price - trust - loan;
    const why = !open ? 'The books are closed.' : S.farms.length >= MAX_FARMS ? 'Eight farms is as much as one steward can ride.' : S.money < down ? 'The purse will not stand ' + fmt(down) + ' down.' : '';
    return {id, name:f.name, land:LAND[id], acres:f.acres, price, down, loan, trust, order:ORDER_W[f.cond], value:lettingValue(f, S.year), can:!why, why}; }); }
function takeFarm(id, loan, paid){ const f = landFor(id); f.paid = paid; f.boughtT = S.t; if (S.soldFarms) delete S.soldFarms[id];
  Object.assign(f, {own:true, arrears:0, level:'fair', lease:{type:'will'}, since:S.year}); delete f.void; delete f.rebate; if (!f.tenant || f.tenant === 'Edmund') f.tenant = incomer()[0];
  f.rent = five(0.95 * lettingValue(f, S.year)); f.K = 0.5 * f.rent; if (loan) S.mortgage += loan;
  S.farms.push(f); return f; }
function buyFarm(id){ const x = farmsForSale().find(r => r.id === id); if (!x || !x.can) return false;
  S.money -= x.down; const f = takeFarm(id, x.loan, x.price); if (x.trust) { S.trust -= x.trust; if (x.trust >= x.price / 2) { f.own = false; S.settledSold = Math.max(0, (S.settledSold || 0) - 1); } }
  S.journal.unshift({when:stamp(), title:'Land', did:'Bought ' + f.name + ', ' + f.acres + ' acres, for ' + fmt(x.price) + (x.loan ? ', ' + fmt(x.loan) + ' of it on mortgage' : '') + (x.trust ? ', ' + fmt(x.trust) + ' of it the trustees’ money' : '')}); save(); render(); return true; }
function sellState(id){ const f = farm(id), open = S.phase !== 'end' && !S.dead, settled = !f.own;
  const why = !open ? 'The books are closed.' : S.farms.length <= 1 ? 'The last farm cannot be sold.' : f.tenant === 'Edmund' && !f.void ? 'Edmund farms it himself.' : settled && !F('edmundDead') && S.chars.edmund.r <= -3 ? 'Settled land. Edmund will not sign.' : '';
  const sp = settled ? splitSettled(salePrice(f), S.money, 0) : {free:salePrice(f), off:0, trust:0};
  return {canSell:!why, sellPrice:salePrice(f), sellGross:grossPrice(f), sellPayout:buyOut(f), sellToYou:sp.free, sellToMortgage:sp.off, sellToTrust:sp.trust, sellWhy:why, settled,
    sellEffects:(buyOut(f) ? 'The tenant is paid ' + fmt(buyOut(f)) + ' to give up the lease. ' : '') + (settled ? 'Settled land: Edmund must sign. The price clears your debts and the mortgage. The rest goes to the trustees, who keep it in the Funds for Edmund and pay you the dividends. Standing and the household suffer, and the estate will carry ' + fmt(mortCap() - capWithout(f)) + ' less on mortgage.' : 'Your own to sell. The money is yours. Standing falls a little.')}; }
/* Settled land is not the squire's to spend. Its price clears what he owes, then the mortgage, and the rest goes to the trustees of the settlement,
   who hold it in the Funds for Edmund and pay the squire the dividends. floor: the cash he is left holding when he was in debt. */
function splitSettled(p, before, floor){ const free = Math.min(p, Math.max(0, floor - before)), off = Math.min(S.mortgage, p - free); return {free, off, trust:p - free - off}; }
function settleProceeds(p, floor){ const r = splitSettled(p, S.money - p, floor); S.money -= p - r.free; S.mortgage -= r.off; S.trust = (S.trust || 0) + r.trust; S.settledSold = (S.settledSold || 0) + 1; return r; }
const trustFund = () => ({sum:S.trust || 0, income:Math.round((S.trust || 0) * (CONSOL_YIELD[S.year] || 5) / 100)});
function sellFarm(id){ const f = farm(id); if (!f || !sellState(id).canSell) return false; const settled = !f.own, p = conveyFarm(f);
  let r = null; if (settled) { r = settleProceeds(p, 0); add({standing:-5, family:-8}); if (!F('edmundDead')) reg('edmund', -2, 'You sold ' + f.name + ' out of his inheritance'); if (f.id === 'longbarrow') fl('soldLongBarrow'); }
  else add({standing:-2});
  if (f.tenant === 'Mrs Thorne') reg('thorne', -1, 'You sold Long Barrow over her head');
  const off = Math.min(S.mortgage, Math.max(0, S.mortgage - mortCap())); S.mortgage -= off; S.money -= off;
  S.journal.unshift({when:stamp(), title:'Land', did:'Sold ' + f.name + ' for ' + fmt(p) + (r ? (r.off ? '. ' + fmt(r.off) + ' to the mortgagees' : '') + (r.trust ? '. ' + fmt(r.trust) + ' to the trustees of the settlement' : '') : off ? '. The mortgagees took ' + fmt(off) : '')}); save(); render(); return true; }

/* A fourth farm, early and on easy terms. Once, in the second year. */
const offerId = () => ['coldharbour', 'rooksnest'].find(id => !farm(id));
ev({ id:'farmOffered', follow:true, cond:() => !!offerId() && S.farms.length < MAX_FARMS, title:'The Executors’ Offer',
  text:() => { const f = landFor(offerId()), p = askPrice(f, 13);
    return `Mr Ayliffe of ${f.name} died at Bath in February, having left the farm to three nieces in equal shares; and the nieces want money.

Their attorney rides over from Newbury, and will take ${fmt(p)} for the ${f.acres} acres, if the conveyance is signed this term; for put up at the George, he says, it would fetch ${fmt(askPrice(f))}, and take till Christmas.

${f.tenant} has the farm from year to year at ${fmt(five(0.95 * lettingValue(f, S.year)))}. Mr Tidmarsh has sent a note by the attorney, to say that he will lend the whole sum upon the farm itself at five per cent.`; },
  choices:[
    {t:'Buy it on Mr Tidmarsh’s money.', note:() => fmt(askPrice(landFor(offerId()), 13)) + ', all of it on mortgage', go:() => { const p = askPrice(landFor(offerId()), 13), f = takeFarm(offerId(), p, p); add({standing:2});
      return `The conveyance is signed in the attorney’s office at Newbury, where Mr Tidmarsh’s clerk counts ${fmt(p)} in notes on to the table, and the attorney counts them again.

${steward()} rules a new page in the book, and writes “${f.name}” at the head of it.`; }},
    {t:'Buy it with your own money.', note:() => fmt(askPrice(landFor(offerId()), 13)), if:() => S.money >= askPrice(landFor(offerId()), 13), go:() => { const p = askPrice(landFor(offerId()), 13); S.money -= p; const f = takeFarm(offerId(), 0, p); add({standing:2});
      return `You give the attorney a draft upon Tidmarsh’s for ${fmt(p)}, and he, having read it twice, puts it in his pocket-book.

${f.name} is yours from quarter day, and ${f.tenant} sends up a goose.`; }},
    {t:'Let it go to the hammer.', go:() => { const f = landFor(offerId());
      return `The attorney bows, and rides back to Newbury; and on Saturday ${f.name} is in the Mercury, to be sold by private contract, the price asked being ${fmt(askPrice(f))}.`; }}
  ]});

/* ---------- more works ---------- */
PROJECTS.barns = { fx:["+ Church Farm up a grade", "+ About a seventh more rent"], effects:`Church Farm goes up a grade: worth about a seventh more to let.`, name:'A new barn and yards at Church Farm', line:'A tiled barn with a plank threshing floor, and walled yards where the cattle winter on straw.', seasons:2, cost:() => 450, if:() => !!farm('church') && farm('church').cond < 4,
  blurb:`The old barn is thatch on crucks. The corn is threshed on an earth floor and the beasts winter in the lane.`, gain:'Church Farm in better order',
  done:() => { const f = farm('church'); if (!f) return `The barn is finished. The farm it stands on is no longer yours.`; f.cond = Math.min(4, f.cond + 1);
    return `The new barn at Church Farm is tiled, with a threshing floor of oak plank and yards walled round for forty beasts. ${f.void ? 'It stands empty until the farm is let' : f.tenant + ' has carried the wheat in'}.`; }};
PROJECTS.chalk = { fx:["+ Long Barrow up a grade", "+ About a seventh more rent"], effects:`Long Barrow goes up a grade: worth about a seventh more to let.`, name:'Chalk the thin ground at Long Barrow', line:'Chalk is dug from pits on the down and spread over the sour fields. Frost breaks it and the plough turns it in.', seasons:2, cost:() => 350, if:() => !!farm('longbarrow') && farm('longbarrow').cond < 4,
  blurb:`Pits sunk on the down, and the chalk drawn out and spread at two hundred loads to the acre.`, gain:'Long Barrow in better order',
  done:() => { const f = farm('longbarrow'); if (!f) return `The chalking is finished. The farm is no longer yours.`; f.cond = Math.min(4, f.cond + 1);
    return `Four pits are open on the down at Long Barrow and the chalk from them lies white over ninety acres. The frost has broken it small. ${steward()} enters the farm as ${ORDER_W[f.cond].toLowerCase()}.`; }};

/* ---------- more ventures ---------- */
const CONSOL_YIELD = {1795:4.52,1796:4.88,1797:5.91,1798:5.93,1799:5.09,1800:4.70,1801:4.90,1802:4.23,1803:5.14,1804:5.25,1805:5.07,1806:4.89,1807:4.77,1808:4.52,1809:4.38,1810:4.41,1811:4.67,1812:5.01,1813:5.11,1814:4.52,1815:5.04};
const consolPrice = y => 300 / (CONSOL_YIELD[y] || 5);

    const why = state !== 'open' ? '' : !open ? 'The books are closed.' : d.if && !d.if() ? d.ifWhy : S.money < d.cost ? 'The purse will not stand ' + fmt(d.cost) + '.' : '';
    const canEnd = open && state === 'inHand' && !!d.end;
    return {id, house:!!d.house, name:d.name, where:d.where, line:d.line, cost:d.cost || 0, keep, sell:d.sell || 0, well:d.well, ill:d.ill, effects:d.effects, fx:societyFx(id), state, can:state === 'open' && !why, why, verb:d.verb || 'Pay for it',
      held:state === 'inHand' ? d.held : '', note:state === 'inHand' ? (keep ? 'Costs ' + fmt(keep) + ' a year to keep' : d.heir ? 'Came with the house' : 'Since ' + soc(id).year) : state === 'ended' ? (d.sell ? 'Sold' : 'Given up') + ', ' + soc(id).ended : keep ? fmt(keep) + ' a year to keep' : '',
      canEnd, endLabel:state === 'inHand' && d.end ? d.endLabel + (d.sell ? ', ' + fmt(d.sell) : '') : '', endWhy:''}; }); }

  S.soc = S.soc || {}; S.soc[id] = Object.assign(S.soc[id] || {year:FIRST_YEAR}, {ended:S.year}); S.money += d.sell || 0; add({standing:-Math.ceil(d.mark / 2)}); const said = d.end();

/* Three fates, fixed when the prospectus arrives and hidden. made: the ship comes home full. glut: the market breaks with the rest in 1810.

const ONES = ['', 'one', 'two', 'three', 'four', 'five', 'six', 'seven', 'eight', 'nine', 'ten', 'eleven', 'twelve', 'thirteen', 'fourteen', 'fifteen', 'sixteen', 'seventeen', 'eighteen', 'nineteen'];
const TENS = ['', '', 'twenty', 'thirty', 'forty', 'fifty', 'sixty', 'seventy', 'eighty', 'ninety'];
function numWords(n){ n = Math.round(n); if (n === 0) return 'nothing';
  const under = k => { const h = Math.floor(k / 100), r = k % 100, a = []; if (h) a.push((h === 1 ? 'a' : ONES[h]) + ' hundred'); if (r) a.push(r < 20 ? ONES[r] : TENS[Math.floor(r / 10)] + (r % 10 ? '-' + ONES[r % 10] : '')); return a.join(' and '); };
  if (n >= 1100 && n < 2000 && n % 100 === 0) return ONES[n / 100] + ' hundred';
  const th = Math.floor(n / 1000), r = n % 1000;
  return (th ? under(th).replace(/^a hundred/, 'one hundred') + ' thousand' : '') + (th && r ? (r < 100 ? ' and ' : ' ') : '') + (r ? (th ? under(r).replace(/^a hundred/, 'one hundred') : under(r)) : ''); }

const cap1 = s => s.charAt(0).toUpperCase() + s.slice(1);
const bub = () => S.bub || {shares:0};
function bubbleClock(){ if (!S.bub && S.t >= 52 && S.t <= 54) { const r = Math.random(); S.bub = {shares:0, fate:r < 0.2 ? 'made' : r < 0.65 ? 'glut' : 'gone'}; later('bubbleTip', 0); }
  const b = S.bub; if (!b) return;
  if (!b.done && S.t >= 61) { b.done = true;
    if (b.shares > 0) later('bubbleEnd', 0);
    else if (b.fate === 'made') S.notes.push('The Brazil Association has paid its proprietors two hundred and fifty pounds a share. Hartopp held twenty.');
    else if (b.fate === 'glut') S.notes.push('Brickwood’s bank has stopped in London, and five Manchester houses after it. Brazils are at twenty. Hartopp gave seventy.');
    else S.notes.push('The Brazil Association has stopped. Its secretary is at Calais. The proprietors are called on for seventy pounds a share, and Hartopp is on the register for twenty.'); }
  if (b.kept && S.t >= 72) { const p = 35 * b.kept; S.money += p; b.kept = 0; S.notes.push(`The Brazil Association is wound up. The proprietors are paid thirty-five pounds a share. ${cap1(pounds(p))} is passed to your account at Tidmarsh’s.`); } }

ev({ id:'bubbleTip', follow:true, cond:() => !!S.bub && !S.bub.tipped, title:'The Brazil Association',
  text:() => `A printed paper comes by the London mail under a frank, being four pages, with a map of South America upon the fourth.

“THE BRAZIL ASSOCIATION, for supplying the Dominions of His Royal Highness the PRINCE REGENT of PORTUGAL with British Manufactures. Capital £200,000, in Shares of £50 each. The Court of Lisbon being now happily removed to RIO DE JANEIRO, and the Ports of that vast Continent opened to our Flag, the Directors have chartered three Ships. A Dividend of Twenty per Cent. is confidently expected upon the first Returns. Early Application is recommended to Mr Quill, Secretary, at the Jerusalem Coffee-house, Cornhill.”

Hartopp, having had one too, brings it over folded in his hat.

    {t:'Take thirty.', note:'£1,500', if:() => S.money >= 1500, go:() => { const b = S.bub; b.tipped = true; b.shares = 30; b.paid = 1500; S.money -= 1500; later('bubbleRise', 3); reg('henrietta', 1);
      return `You write to Mr Quill for thirty shares, and enclose a draft upon Tidmarsh’s for fifteen hundred pounds; and Mr Tidmarsh pays it, but sends a note with the pass-book, asking whether the figure is right.

    {t:'Put it behind the clock.', go:() => { S.bub.tipped = true; later('bubbleRise', 3);

ev({ id:'bubbleCall', follow:true, cond:() => !!S.bub && S.bub.shares > 0 && !S.bub.called && !S.bub.done, title:'A Call of Ten Pounds',

      return `The agent sells at twenty. ${cap1(pounds(p))} is passed to your account.

    {t:'Keep them.', if:() => bub().fate === 'glut', go:() => { const b = S.bub; b.ended = true; b.kept = b.shares; b.shares = 0;

/* ---------- the rungs of credit, for the book ---------- */
const timberLeft = () => S.timber === undefined ? 3 : S.timber;
const timberNow = () => Math.round(75 * (1 + 0.035 * (S.year - FIRST_YEAR))) * 10;
function creditList(){ const open = S.phase !== 'end' && !S.dead, shut = open ? '' : 'The books are closed.', n = S.annuities || 0, g = borrowGets();
  return [
    {id:'mortgage', name:'Borrow £500 on the land', line:'A lender advances money on the security of the estate. The deeds lie with his attorney until he is paid.', gets:g, verb:'Borrow', can:open && canBorrow(), why:shut || borrowWhy(), note:borrowNote(),

    {id:'redeem', name:'Buy back an annuity', line:'The office names its price for giving up the deed. The parchment comes back with the seals cut off.', gets:-800, verb:'Buy it back', can:open && n > 0 && S.money >= 800, why:shut || (!n ? 'None is granted.' : S.money < 800 ? 'There is not £800 in hand.' : ''), note:'',
      effects:'The office takes £800 to cancel the deed.', fx:['−£800', '+£100 a year saved']},
    {id:'timber', name:'Fell the oaks in Hanger Wood', line:'Hanger Wood is oak of your great-grandfather’s planting. A merchant buys the trees standing and fells them with his own men.', gets:timberNow(), verb:'Send for the timber merchant', can:open && timberLeft() > 0, why:shut || (timberLeft() ? '' : 'There is nothing left standing worth the felling.'), note:timberLeft() + ' falls left',
      effects:'Two hundred oaks, paid for standing. Standing in the county falls. There are three falls in the wood and no more in your lifetime.', fx:['+' + fmt(timberNow()), '− Standing']}
  ]; }
function takeCredit(id){ const x = creditList().find(r => r.id === id); if (!x || !x.can) return false; let did = x.name;
  if (id === 'mortgage') { S.mortgage += 500; S.money += x.gets; }
  else if (id === 'repay') { S.mortgage -= 500; S.money -= 500; }
  else if (id === 'annuity') { S.annuities = (S.annuities || 0) + 1; S.money += 700; add({standing:-1}); }
  else if (id === 'redeem') { S.annuities--; S.money -= 800; }
  else if (id === 'timber') { S.timber = timberLeft() - 1; add({money:x.gets, standing:-3}); }
  S.journal.unshift({when:stamp(), title:'Credit', did}); save(); render(); return true; }

/* What a farm would let for if something about it were changed, less what it lets for now. */
function rentGain(id, change){ const f = farm(id); if (!f) return 0; const now = lettingValue(f, S.year), was = {cond:f.cond, mult:f.mult}; change(f); const then = lettingValue(f, S.year); f.cond = was.cond; f.mult = was.mult; if (was.mult === undefined) delete f.mult; return then - now; }
const whenOf = id => { const f = farm(id); return f && !f.void && f.lease.type !== 'will' ? ', once the lease is out in ' + f.lease.ends : ''; };

Object.assign(VENTURES.bank, {fx:['+£150 a year', '+1 Standing a year', MINUS + '£500 in a run', MINUS + '£2,500 to £5,000 if the bank breaks']});

Object.assign(VENTURES.funds, {fx:() => ['+' + fmt(Math.round(500 / consolPrice(S.year) * 3)) + ' a year in dividends', '+ or ' + MINUS + ' the price of the day when sold. It is ' + Math.round(consolPrice(S.year)) + ' now']});
const SOCIETY_FX = {

  presentation:['+3 Household', '+1 Kitty', '+1 Henrietta'], deputy:['+1 Lord Cullerne'], knight:['+5 Household', '+2 Henrietta'], baronet:['+8 Household', '+3 Henrietta', '+1 Edmund'] };

/* ---------- standing, goodwill and peace ----------
   Each of the three has a mark it settles at, set by how the squire lives: his establishment and honours, his rents and what he has built for the parish,
   his wife's regard and the state of the purse. What he does in a season lifts a figure above its mark for a while, and it sinks back, faster the higher it stands.
   One undertaking a season will not hold all three up. To keep a figure high he must move its mark, and every mark is moved with money or at the cost of another.
   Below a line each of the three bites: the parish breaks and burns, the county shuts its doors and the bank calls for its money, and Henrietta goes to Bath. */
function marks(){ const i = estIdx(), why = {standing:[], goodwill:[], family:[]}; const put = (k, n, t) => { if (n) why[k].push((n > 0 ? '+' : MINUS) + Math.abs(n) + ' ' + t); return n; };
  let st = EST[i].standing; why.standing.push(EST[i].standing + ' ' + cap1(EST[i].name));
  st += put('standing', societyMark(), 'Society'); st += put('standing', -6 * (S.settledSold || 0), 'Settled land sold');
  st += put('standing', live('turnpike') ? 2 : 0, 'A trustee of the turnpike'); st += put('standing', live('racecourse') ? 3 : 0, 'Hatherley races'); st += put('standing', live('telegraph') ? 1 : 0, 'The Admiralty on the Down'); st += put('standing', F('hallPew') ? 1 : 0, 'The Hall pew'); st += put('standing', F('churchRoof') ? 1 : 0, 'The church roof');
  st += put('standing', F('wages') ? -2 : 0, 'The farmers dislike your wages'); st += put('standing', idle('county', 2) ? -4 : 0, 'Not seen in the county this half-year'); st += put('standing', S.money < 0 ? -4 : 0, 'Living on credit'); st += put('standing', F('henriettaAway') ? -5 : 0, 'Henrietta at Bath');
  let g = 44; why.goodwill.push('44 The parish as you found it');

ev({ id:'captainAfter', follow:true, cond:() => ['kept', 'lent', 'ship'].includes(S.flags.captainPath) && !F('captainEnded'), get title(){ return S.flags.captainPath === 'lent' ? 'The Captain’s Bond' : 'A Letter from the Captain'; },
  text:() => { const path = S.flags.captainPath, war = S.year >= 1803 && S.year <= 1813;
    if (path === 'lent') return S.capRepays
      ? `A bill of exchange comes to Mr Tidmarsh’s from a Lisbon house, drawn by Captain Lyle upon Cooke and Weddell’s assignees, for ${fmt(Math.round(S.capDebt * 1.05))}; and a note comes with it.

“Sir, The assignees have paid eleven shillings in the pound upon the Spaniard. I have taken it all and a good deal of my pride and I send you what is yours. I am to be at sea by the week’s end. R. L.”`
      : `A bill of exchange comes to Mr Tidmarsh’s from Plymouth, drawn upon Cooke and Weddell’s assignees, for ${fmt(Math.round(S.capDebt / 4))}; and a note comes with it.

“Sir, The assignees have paid two shillings and sixpence in the pound upon the Spaniard. I send you the whole of what I have received. The remainder stands upon the bond. I shall write again. R. L.”

Mr Tidmarsh, holding the bill to the light, says it is good; but of the remainder he says nothing.`;
    if (path === 'ship' && !war) return `Bristol, Friday.

Sir, I have taken a house in Clifton, and sit three days in the week in a room over a ropewalk, taking the names of men who do not wish to be taken; and Mrs Lyle pays the rent of the Grange upon the day from my salary. I am sorry to say the girls find Bristol gayer.

I enclose a cheese, that being the best thing in the town.

Your servant, R. Lyle.`;
    return war
      ? `Portsmouth, Friday.

Sir, I am appointed to the Blanche, thirty-six, and am to sail upon the first fair wind. I take my plate to sea; but I leave Mrs Lyle and the girls at the Grange, and she will pay the rent from my Navy Office remittance, half-yearly, to Mr Crabbe.

I send by the carrier half a pipe of Madeira, taken by me off a Dutchman. I am obliged to you. I am not used to it.

Your servant, R. Lyle.

The Madeira arrives upon a dray, and the carrier asks if it is meant to be drunk by the pint.`
      : `Hatherley Grange, Michaelmas.

Sir, The rent is enclosed, in silver, and I have counted it twice. Mrs Lyle has let the second drawing-room to a Lieutenant’s widow and her mother, by which we shall find the next half-year; and two of my girls are learning the harp from a French refugee, who is paid in salmon.

I have put my name down at the Admiralty every Tuesday. I am told there are two hundred and nine above me.

Your servant, R. Lyle.`; },
  choices:[
    {t:() => S.year >= 1803 && S.year <= 1813 ? 'Write him joy of the ship, and send a ham.' : 'Send him a brace of pheasants and your compliments.', note:'+2 Standing', if:() => S.flags.captainPath !== 'lent', go:() => { fl('captainEnded'); add({standing:2, goodwill:1});
      return `The ham goes to Portsmouth by the coach, in a cloth, with a letter; and the Madeira being opened at Christmas, Crabbe is asked to take a glass, and drinks it standing.`; }},
    {t:'Ask him to take Edmund for his Lieutenant.', note:'+Edmund’s regard, +Household', if:() => S.flags.captainPath !== 'lent' && at('navy') && !F('edmundDead'), go:() => { fl('captainEnded'); add({family:3, standing:1}); reg('edmund', 2, 'The Captain took him as First Lieutenant');
      return `The Captain answers by return of post. “I have a vacancy for a First Lieutenant. I should be glad of a Hatherley.” Edmund is appointed in a fortnight, and writes from the ship that he has a cabin the size of a hip-bath, and a Captain who talks to the barometer.`; }},
    {t:'Enter it in the book.', if:() => S.flags.captainPath === 'lent', go:() => { fl('captainEnded'); const back = S.capRepays ? Math.round(S.capDebt * 1.05) : Math.round(S.capDebt / 4);
      add({money:back, goodwill:1, standing:S.capRepays ? 1 : 0});
      return `Crabbe writes ${fmt(back)} upon the credit side, and carries the rest, if any, to the page headed “Doubtful”. ${S.capRepays ? 'The bond is returned across the table, and Mr Tidmarsh tears it in two.' : 'The bond stays in the drawer.'}`; }}
  ]});
/* How the life ends. One ending is chosen from where the squire stands when the book is shut: by ruin, by a pistol ball, or at the
   close of 1815. Each has its own plate at art/endings/<id>, struck as the last of The Progress.
   The table is read from the top and the first ending whose test holds is taken, so the order is the order of precedence.
   The book reads ending(); the page shows endPlateHTML() above the cutting from the Mercury. */
const endNet = () => S.money - S.mortgage + (typeof ownLandValue === 'function' ? ownLandValue() : 0);
const endHas = id => typeof held === 'function' && typeof SOCIETY !== 'undefined' && SOCIETY[id] && !SOCIETY[id].heir && held(id);
const endTitled = () => endHas('baronet') || endHas('knight');
const endFront = () => !!(F('newFront') || (S.projectsDone && S.projectsDone.front === 'done'));
const endWorks = () => Object.keys(S.projectsDone || {}).filter(id => S.projectsDone[id] === 'done').length;
const endGrand = () => endTitled() || S.standing >= 68 || (S.est === 'splendid');
const endFirst = () => S.name.split(' ')[0];
const endSir = () => 'Sir ' + endFirst();
const endVicar = () => F('edmundVicar') ? 'Edmund' : F('oakesVicar') ? 'Mr Oakes' : F('gallDead') ? 'The vicar' : 'Dr Gall';
const endCount = n => ['no', 'one', 'two', 'three', 'four', 'five', 'six', 'seven', 'eight', 'nine', 'ten'][n] || String(n);
const endAway = () => !!F('henriettaAway');

const ENDINGS = [
  /* ---------- by a pistol ball ---------- */
  { id:'duel', title:'Shot at Dawn', did:'Met Captain Vane on Hatherley Down.', if:() => S.dead === 'duel',
    text:() => `The surgeon, having set down his green baize bag in the wet grass, does not open it.

The lieutenant with the clean gloves picks up both pistols, and having wiped them, lays them in their case; but Captain Vane is already in the chaise.

A shepherd coming over the Down with forty ewes takes off his hat; and the ewes go round you upon both sides.` },

  /* ---------- sold up: four ways out of the Hall ---------- */
  { id:'tenant', title:'A Tenant on His Own Land', did:'Sold up, and stayed in the parish.', if:() => S.dead === 'ruin' && S.goodwill >= 58,
    news:() => `${S.name}, Esquire, late of that place, has taken the bailiff’s house at Church Farm, at a rent of twenty pounds.`,
    text:() => `Upon the morning of the sale there are three wagons at the door, that nobody sent for; and into these the tenants load what Mr Skinner has left, and carry it to the bailiff’s house at Church Farm.

The rent of the house is twenty pounds a year, and the purchaser’s agent, taking it at Lady Day, writes you a receipt.

On Sunday you walk to church, where the Hall pew is found to have a new lock upon the door; and the blacksmith moves along his bench.

“There’s room here, sir.”` },
  { id:'bath', title:'The Second Floor in Gay Street', did:'Sold up, and went to Bath on Henrietta’s money.', if:() => S.dead === 'ruin' && S.family >= 52 && !endAway(),
    news:() => `${S.name}, Esquire, late of that place, has removed with his lady to Bath.`,
    text:() => `Mrs Tamworth has the first floor in Gay Street, and you the second, to which there are forty-one stairs; and she has counted them for you.

Henrietta’s settlement brings two hundred a year, and being beyond the reach of the creditors, has been mentioned by her as such to the landlady, and to the butcher.

You drink the waters at eight in the morning, when the Pump Room is empty; and in the evening Henrietta does the accounts upon the tea table, out of which she allows you sixpence a week for the newspaper room.

“We shall do,” she says.` },
  { id:'bench', title:'A Room in the King’s Bench', did:'Sold up, and taken for debt.', if:() => S.dead === 'ruin' && S.standing < 42 && S.goodwill < 45,
    news:() => `${S.name}, Esquire, late of that place, is lodged in the King’s Bench Prison, at the suit of nine tradesmen of Wyvern and a coachmaker of Long Acre.`,
    text:() => `The turnkey at the King’s Bench wants half a crown for the room, and a shilling for the key of it.

There are two beds, the other being that of a hop factor from the Borough, who has been here since the Peace of Amiens; and who shows you the racket court, the pump, and the window where the beer is passed in.

“You’ll want a chair,” he says. “I can let you have a chair at fourpence a week.”

Mr Spurling writes on Tuesday that the sale is made up, and that the creditors are to have fourteen shillings in the pound.` },
  { id:'soldup', title:'Sold Up', did:'Sold up, and crossed to the Isle of Man.', if:() => S.dead === 'ruin',
    news:() => `${S.name}, Esquire, late of that place, has removed with his family to Douglas in the Isle of Man. The King’s writ for debt does not run there. He walks on the pier most mornings.`,
    text:() => `The Liverpool packet lands you at Douglas with nine trunks, one of them holding the rent books.

There are forty English gentlemen in the town, who meet upon the pier at ten; and each of them having asked what you owed, and been told, two of them bow lower the next morning.

The lodging is fourteen shillings a week with fish, and has a window from which England may be seen upon a clear day. There have been three clear days since Michaelmas.` },

  /* ---------- the close of 1815 ---------- */
  { id:'hollow', title:'Splendour on Credit', did:'Kept a great figure on borrowed money.', if:() => endGrand() && endNet() < -2500,
    text:() => `Forty sit down at the Hall upon Twelfth Night to two courses and a dessert, the pineapple in the midst of it being hired from a fruiterer in Reading at half a guinea, and to go back on Thursday.

Lord Cullerne has the chair upon your right, and the footmen are in new liveries; but the tailor who made them is in the servants’ hall with his bill, and the wine merchant beside him, and Mrs Bunce has given them both cold beef.

Mr Tidmarsh, being among the company, counts the candles.` },
  { id:'baronet', title:'The Bloody Hand over the Door', did:'A baronet, behind six columns.', if:() => endHas('baronet') && endFront(),
    text:() => `A mason is upon a ladder over the great door with a mallet, having the red hand of Ulster to cut into the shield upon the pediment; and finding he has chalked it in backwards, he rubs it out with his sleeve.

The six columns are of Bath stone, the colour of a new loaf. The rooks left the elms the week the scaffolding came, and have not been back.

Mrs Bunce has the servants out upon the steps in a row.

“Good morning, ${endSir()}.”

“Good morning, ${endSir()}.”

The boot boy, saying it wrong, is sent to the end of the row.` },
  { id:'rackrent', title:'The Rack-Renter', did:'Grew rich, and was not thanked for it.', if:() => endNet() > 8000 && S.goodwill < 40,
    text:() => `Rent day. ${steward()} has the table set across the door of the estate office, and the tenants come up to it one at a time.

Every farm upon the roll pays to the day, and the sum is entered and ruled off before noon; and there being no audit dinner this year, each man has a glass of beer in the yard, and drinks it standing.

In the afternoon you ride down the lane, where a woman at the pump turns her back, and her three children turn theirs.

The purse stands at ${fmt(S.money)}.` },
  { id:'good', title:'The Good Squire of Hatherley', did:'Held Hatherley one-and-twenty years, and was liked.', if:() => S.goodwill >= 68 && S.family >= 55,
    text:() => `Snow having fallen in the night, the lane is by nine o’clock dug out from the village to the Hall door, though nobody was sent for.

Eleven men stand at the back door with spades, to whom Mrs Bunce gives beer; but they will not take the shilling.

The ringers have had the bells up since seven, and ring one-and-twenty rounds, being a round for every year you have had the place. The treble is cracked, and you paid for the rope.

${endAway() ? 'You stand at the window and count them.' : 'Henrietta counts on her fingers and makes it twenty-two.'}` },
  { id:'knight', title:'The Loyal Address', did:'Rose a Sir.', if:() => endTitled(),
    text:() => `The Wyvern carrier brings a letter directed to ${endSir()} ${S.sur}, ${endHas('baronet') ? 'Baronet' : 'Knight'}, for which he asks ninepence, having always asked eightpence.

The engraver has sent two hundred cards with Lady ${S.sur} upon them in the copperplate hand. ${endAway() ? 'They lie upon the hall table, Henrietta being in Gay Street.' : 'Henrietta leaves them at thirteen houses in one morning, at four of which there was nobody at home to her last year.'}

In church ${endVicar() === 'The vicar' ? 'the vicar' : endVicar()} prays for the King, the Prince Regent, and all the nobility, and looks at the Hall pew when he comes to it.` },
  { id:'member', title:'The Member for Wyvern', did:'Sat for the borough.', if:() => !!F('mp'),
    text:() => `Fourteen people are in the hall before breakfast, each with a letter in his hand; and a Member being allowed to frank ten in a day, you write your name across ten corners, and the other four are told to come tomorrow.

At noon a clerk rides over with a paper, setting out how the Member for Wyvern will vote upon the Property Tax. You had not been asked.

The London coach leaves the George at six, and your place is taken inside, the borough having paid for it.` },
  { id:'acres', title:'From the Down to the River', did:'Added farm to farm.', if:() => S.farms.length >= 6,
    text:() => `The surveyor from Reading unrolls the new plan upon the dining table; and finding that it hangs over both ends, asks for two chairs.

There are ${endCount(S.farms.length)} farms upon it, each in its own colour, where your uncle’s plan showed three; and that is still upon the office wall, under the almanack.

You set out at eight to ride the boundary, and at four, when the light goes, are at the far hedge, with the Hall six miles off. The tenant’s wife gives you a bed, having had it aired since Tuesday.` },
  { id:'empty', title:'Master of an Empty House', did:'Kept the house and lost the household.', if:() => S.family < 30 || endAway(),
    text:() => `Dinner is laid for one at the end of the long table, the other eleven chairs standing against the wall in holland covers.

${endAway() ? 'Henrietta is in Gay Street, and writes upon the first of the month; and the letter is about the linen.' : 'Henrietta dines upstairs upon a tray, and sends down to ask whether the fire in the blue room may be lit.'}

The butler, having brought the port, stays by the door; and you ask him the news of the servants’ hall.

“The kitchen cat has kittened, sir.”

The clock in the hall strikes nine, and you count it.` },
  { id:'song', title:'The Man in the Song', did:'Was sung about at the Bell.', if:() => S.goodwill < 30,
    text:() => `You come through Hatherley at dusk upon the cob, and they are singing in the Bell, with the window open an inch.

The tune you know, for it is “The Vicar of Bray”; but the words are new, and of the nine verses your name ends every one.

When the cob’s shoes strike the bridge the singing stops, except that a boy upon the churchyard wall goes on alone for two lines, until somebody takes him down by the leg.

At the lodge gate you find you are humming it.` },
  { id:'cut', title:'Not at Home', did:'Was dropped by the county.', if:() => S.standing < 33,
    text:() => `The chaise is out four mornings in the first week of the year, and you leave a card at nine houses; at each of which the footman looks at the card, and then at the horses, and his lady is not at home. At Cullerne Castle there is a face at the morning-room window.

No card comes back; and the silver tray in the hall has one letter upon it, from a hatter at Reading.

The Wyvern assembly is held upon the nineteenth, and you read of it in the Mercury upon the twenty-second.` },
  { id:'debts', title:'Mr Tidmarsh’s Tin Box', did:'Kept the land, and owed for all of it.', if:() => endNet() < -1500,
    text:() => `Mr Tidmarsh comes out from Wyvern upon the first Monday of the quarter, not sending his clerk; and having walked through the house with his hands behind him, he stops at the damp in the east passage.

The interest is ${fmt(Math.round(S.mortgage / 20))} a year, and leaves upon quarter day before the butcher is paid.

“A fine property,” says Mr Tidmarsh upon the steps; but he says it to the roof.

You have kept the land. The deeds are at the Bank, in a tin box with your name upon the lid.` },
  { id:'warm', title:'A Warm Man', did:'Left the estate richer than he found it.', if:() => endNet() > 9000,
    text:() => `Three gentlemen call in one week, of whom each admires the dogs, each stays to dinner, and each, over the port, asks for the loan of five hundred pounds until harvest.

At the Bank Mr Tidmarsh gives you the chair by the fire, and shuts the door himself, and asks your opinion of Exchequer bills.

${steward()} casts the year, and finds that, clear of every charge, there is ${fmt(Math.round(endNet() / 100) * 100)} to the good; and having written the sum, and blotted it, he writes it again larger.` },
  { id:'improver', title:'The Improver', did:'Drained, built and mended.', if:() => endWorks() >= 5,
    text:() => `Mr Hartopp brings nine gentlemen of the Bath and West Society in two chaises, who walk the estate from ten until three, Mr Hartopp going before them backwards, and talking.

One gentleman measures a turnip with a tape, and another puts a stone from the mended road in his pocket.

At dinner they vote you the Society’s silver medal, that may be had of the secretary upon payment of the engraver.

The old carter watches the chaises go down the drive.

“They never asked what un cost,” he says.` },
  { id:'dynasty', title:'Three Generations at Table', did:'Saw his grandchildren at the Hall.', if:() => !F('edmundDead') && (S.flags.edmund === 'farmer' || F('edmundMarried')) && S.family >= 55,
    text:() => `Fourteen sit down upon Twelfth Night, of whom five are under ten years old.

Edmund carves, where last year you carved; and nobody has remarked upon it.

The smallest grandchild, being put in your uncle’s chair upon two volumes of the county history, bites the footman who brings the pudding.

After dinner ${endAway() ? 'Kitty' : 'Henrietta'} has the family Bible down; and there being half a page left under your name, she rules a line across it for the next.` },
  { id:'funds', title:'A Gentleman in the Funds', did:'Sold the farms and lived on the dividends.', if:() => S.farms.length <= 1,
    text:() => `The dividends are paid at the Bank of England upon the fifth of January, and the trustees send a draft by Tuesday’s mail. ${steward()} has nothing else to enter this quarter, and enters it slowly.

After breakfast you walk to the park pale, a matter of eleven minutes. The wheat upon the far side is a Reading brewer’s, whose man touches his hat, and goes on hedging.

Three per cent. Consols are at sixty; and in the Mercury you look for the price of them before you look for the deaths.` },
  { id:'button', title:'The Button-Maker’s Expectations', did:'Kept it all for a cousin in Birmingham.', if:() => S.flags.heir === 'cousin',
    text:() => `Your cousin comes from Birmingham by the coach, outside, with a two-foot rule in his coat.

Having measured the dining room, he counts the chimneys from the lawn, and writes the number upon his cuff, and asks Mrs Bunce what the coals come to.

At dinner he asks after your health, and at breakfast he asks again.

“You look uncommon well, cousin.”

He takes the outside place home, it being four shillings cheaper.` },
  { id:'tolerable', title:'A Tolerable Squire', did:'Held Hatherley one-and-twenty years.', if:() => true,
    text:() => `Rain upon quarter day; but the rents are in by four, though two of them are a pound short.

You dine at three upon a boiled fowl, and afterwards sleep in the chair with the Mercury over your face, the news in it being nine days old.

${steward()} casts the one-and-twenty years upon a single sheet: received, so much; laid out, so much; and the difference would buy a good horse.

At six the dogs are let in.` }
];

/* The ending as things stand: {id, title, did, text, news, plate}. */
function ending(){ const e = ENDINGS.find(x => x.if()) || ENDINGS[ENDINGS.length - 1];
  return {id:e.id, title:e.title, did:e.did, text:e.text(), news:e.news ? e.news() : '', plate:'endings/' + e.id}; }

/* Struck once, when the book is shut for good, so that the ending is the last plate of The Progress. It is then held up over the book. */
function strikeEnding(){ if (!S) return; if (!S.plates) S.plates = [];
  if (!S.plates.some(p => p.key === 'end')) { const e = ending(), src = typeof artURL === 'function' && !artURL(e.plate) ? 'frontispiece' : e.plate;
    S.plates.push({key:'end', title:e.title, src, did:e.did, pub:S.dead ? SEASONS[S.season] + ' ' + S.year : 'January 1816', say:''}); }
  showLastPlate(); }

/* The last plate is held up in its own frame, laid out as the other plates are: the print, and beside it what is seen that day. */
function showLastPlate(){ if (typeof document === 'undefined' || !S || S.phase !== 'end') return;
  let el = document.getElementById('lastplate'); if (!el) { el = document.createElement('div'); el.id = 'lastplate'; document.body.appendChild(el); }
  const e = ending(), u = artURL(e.plate) || artURL('frontispiece'), n = (S.plates || []).length, when = S.dead ? stamp() : 'January 1816';
  el.innerHTML = `<div class="pcard"><figure class="print"><div class="mark"><span class="pn">${n ? 'Plate ' + n + ', and the last' : 'The last plate'}</span><div class="cutwrap">${u ? `<img src="${u}" alt="${esc(e.title)}">` : ''}</div><figcaption><b>${esc(e.title)}</b><small>Publish’d as the Act directs, ${esc(when)}</small></figcaption></div></figure>
    <div class="pside"><article class="sheet came"><p class="kicker">${esc(when)}</p><div class="prose lead">${paras(e.text)}</div></article>
    <div class="answer"><div class="row"><button class="go" onclick="shutLastPlate()"><span>Read the Mercury</span></button></div></div></div></div>`;
  el.hidden = false; document.body.classList.add('plateup'); el.scrollTop = 0; const b = el.querySelector('.go'); if (b) b.focus({preventScroll:true}); }
function shutLastPlate(){ const el = document.getElementById('lastplate'); if (el) { el.hidden = true; el.innerHTML = ''; } document.body.classList.remove('plateup'); }

/* On the last leaf of the book, the way back to the plate. */
function endPlateHTML(){ return `<p class="lastlink"><button class="quiet" onclick="showLastPlate()">${esc(ending().title)}: the last plate</button></p>`; }

      <div class="row"><button class="go" id="takeit" type="submit">Take possession</button>${has ? '<button class="quiet" type="button" onclick="resume()">Resume the estate you left</button>' : ''}</div>
    </form>
  </article>`; }
let PICKS = {};
const pickList = () => Object.values(PICKS).filter(Boolean);
/* Favours: three to begin. An advantage spends one or two, a burden earns them back. Each row opens a list; what cannot be afforded is greyed. */
const favour = n => n ? `<span class="fav ${n > 0 ? 'neg' : 'pos'}">${n > 0 ? '−' : '+'}${'●'.repeat(Math.abs(n))}</span>` : '';
function picksHTML(){ const left = pointsLeft(pickList());
  return `<p class="favours"><span>Favours in hand</span><b id="pts" aria-label="${left}">${'●'.repeat(Math.max(0, left))}<i>${'○'.repeat(Math.max(0, TRAIT_POINTS - Math.max(0, left)))}</i></b><small>An advantage spends them. A burden earns them back.</small></p>
    ${TRAIT_GROUPS.map(([g, label, plain], gi) => { const cur = PICKS[g] && traitById(PICKS[g]), room = left + (cur ? cur.cost : 0);
      const opt = (id, name, cost, fx) => `<button type="button" role="option" aria-selected="${(PICKS[g] || '') === id}" ${cost > room ? 'disabled' : ''} onclick="setPick('${g}', '${id}')"><b>${esc(name)}</b>${favour(cost)}${fx && fx.length ? `<small>${fx.map(t => `<i class="${t[0] === '+' ? 'pos' : 'neg'}">${esc(t)}</i>`).join('')}</small>` : ''}</button>`;
      return `<div class="pickrow"><span class="plabel" id="pl-${g}">${label}</span><details class="pick${gi >= TRAIT_GROUPS.length - 3 ? ' up' : ''}" name="pick"><summary aria-labelledby="pl-${g}"><b>${esc(cur ? cur.name : plain)}</b>${cur ? favour(cur.cost) : ''}</summary>
        <div class="opts" role="listbox">${opt('', plain, 0, '')}${[1, -1].map(sg => `<div>${TRAITS.filter(t => t.group === g && Math.sign(t.cost) === sg).map(t => opt(t.id, t.name, t.cost, t.fx)).join('')}</div>`).join('')}</div></details>
        <p class="pickblurb">${cur ? esc(cur.blurb) + ' <span>' + esc(cur.effect) + '</span>' : ''}</p></div>`; }).join('')}`; }
function setPick(g, id){ PICKS[g] = id || null; if ($('picks')) { $('picks').innerHTML = picksHTML(); fitLeaf(); } }
function syncTraits(){ if ($('picks')) $('picks').innerHTML = picksHTML(); }
document.addEventListener('click', e => { if (!e.target.closest('details.pick')) document.querySelectorAll('details.pick[open]').forEach(d => d.open = false); });
function start(){ if (pointsLeft(pickList()) < 0) return; const f = ($('first').value || 'Thomas').trim(), s = ($('sur').value || 'Merridew').trim(); newGame(f, s, pickList()); render(); window.scrollTo({top:0}); }
function resume(){ const s = load(); if (s) { S = s; render(); } }

const runhead = (l, r, m) => `<p class="runhead"><span>${l}</span>${m ? `<span>${m}</span>` : ''}<span>${r}</span></p>`;
/* A choice's sum: a plus or "Saves" or a sale is money in and goes green; a bare sum is money out and goes red. Rents on a letting are money in. */
const RENT_PAPERS = new Set(['leaseFalls', 'cannotPay']);
/* What an undertaking touches: gains in green with a plus, losses in red with a minus. */
function hintHTML(h){ if (!h) return ''; const m = /^Costs (.+)$/.exec(h);
  const bits = m ? m[1].split(' and ').map(x => '−' + x) : h.split(', ');
  return `<small class="fxs">${bits.map(b => /^−/.test(b) ? `<b class="neg">${esc(b)}</b>` : `<b class="pos">+${esc(b.replace(/^\+/, ''))}</b>`).join(' ')}</small>`; }
function noteOf(c){ if (!c.note) return ''; const n = typeof c.note === 'function' ? c.note() : c.note, M = /[+−-]?(£[\d,]+|\d+ guineas?|\d+s\.(?: \d+d\.)?)/g;
  if (/^Mortgage /.test(n) || !n.match(M)) return `<em>${esc(n)}</em>`;
  const rent = S.phase === 'event' && RENT_PAPERS.has(S.pending) && / a year/.test(n) && !/^Strike/.test(n);
  const gain = /^(\+|Saves|About)/.test(n) || rent;
  return `<em>${esc(n).replace(M, (m, a) => { const g = /^\+/.test(m) ? true : /^[−-]/.test(m) ? false : gain; return `<span class="amt ${g ? 'pos' : 'neg'}">${g ? '+' : '−'}${a}</span>`; })}</em>`; }

function accountHTML(){ let rows = '', tot = 0;
  const cells = a => `<td class="n l">${a < 0 ? '<span class="sr">paid </span>' : ''}${Math.abs(a).toLocaleString('en-GB')}</td><td class="n z">0</td><td class="n z">0</td>`;
  for (const [l, a] of S.ledger){ tot += a; rows += `<tr class="${a < 0 ? 'neg' : ''}"><td>${esc(l)}</td>${cells(a)}</tr>`; }
  rows += `<tr class="total${tot < 0 ? ' neg' : ''}"><td>Carried to the purse</td>${cells(tot)}</tr>`;
  return `<div class="tablewrap"><table class="acct"><thead><tr><th>Particulars</th><th class="n l">£</th><th class="n">s.</th><th class="n">d.</th></tr></thead><tbody>${rows}</tbody></table></div>`; }

/* The right-hand leaf, under the plate: what the quarter came to, and what was lately done. */
function digestHTML(){ let inn = 0, out = 0; for (const [, a] of S.ledger) { if (a > 0) inn += a; else out -= a; }
  const net = inn - out, last = S.journal.slice(0, 3);
  return `<div class="digest"><dl class="bal slim"><div><dt>Received</dt><dd>${inn ? amt(inn, 1) : fmt(0)}</dd></div><div><dt>Paid away</dt><dd>${out ? amt(out, -1) : fmt(0)}</dd></div><div><dt>The quarter</dt><dd>${net ? amt(net, net) : fmt(0)}</dd></div></dl>
    ${last.length ? `<h3 class="orn">Lately</h3><ol class="daybook">${last.map(j => `<li><time>${esc(j.when)}</time><span><b>${esc(j.title)}.</b> ${esc(j.did)}</span></li>`).join('')}</ol>` : ''}</div>`; }
function ledgerHTML(){
  const warn = S.dead === 'ruin' ? `<p class="note bad">The tradesmen of Wyvern met at the George on Tuesday. They resolved to give the Hall no more credit. No hand was raised against it. The mortgagees have sent a man to look at the roof.</p>` : '';
  return `${runhead('Papers received this quarter', 'Cr.')}
    ${plateHTML(S.season, 'seasons/' + S.season, 'Hatherley in ' + SEASONS[S.season].toLowerCase())}
    <p class="platecap"><span>Hatherley, ${esc(stamp())}</span><span>fo. ${Math.min(S.t + 1, 84)} of 84</span></p>
    ${S.notes.map(n => `<p class="note">${esc(n)}</p>`).join('')}${warn}
    ${S.news ? `<aside class="sheet clip"><span>The Reading Mercury</span><p>${esc(S.news)}</p></aside>` : ''}
    ${S.vignette ? `<div class="prose vignette">${paras(S.vignette)}</div>` : ''}
    ${digestHTML()}
    <div class="row">${S.dead ? `<button class="go" onclick="next()"><span>Face the creditors</span></button>` : `<button class="go" onclick="shutBook()"><span>Shut the book</span></button>`}</div>`; }

function paperHTML(){ const e = byId(S.pending), bill = BILLS.has(e.id), text = e.text(), who = bill ? null : whoOf(e.title + ' ' + text);
  return `${runhead(bill ? 'Posted this quarter' : 'Papers received this quarter', `fo. ${Math.min(S.t + 1, 84)}`)}
    <article class="sheet${bill ? ' bill' : ''}">
      ${who ? `<div class="from">${medal(who, true)}<div><p class="kicker">${esc(stamp())}. ${esc(PEOPLE[who].name)}</p><h2>${esc(e.title)}</h2></div></div>` : `<p class="kicker">${esc(stamp())}</p><h2>${esc(e.title)}</h2>`}
      <div class="prose">${(e.cut && pic('events/' + e.cut(), '')) || pic('events/' + e.id, '')}${paras(text)}</div>
    </article>`; }
function eventHTML(){ const e = byId(S.pending); const cs = e.choices.filter(c => !c.if || c.if());
  return `${runhead('Your answer', 'Cr.')}
    <dl class="bal slim"><div><dt>In hand</dt><dd class="${S.money < 0 ? 'neg' : ''}">${fmt(S.money)}</dd></div><div><dt>Owing on the mortgage</dt><dd class="owe">${fmt(S.mortgage)}</dd></div></dl>
    <div class="choices">${cs.map((c, i) => `<button class="choice" onclick="choose(${i})"><span>${esc(lab(c))}</span>${noteOf(c)}</button>`).join('')}</div>`; }

function outcomeHTML(){ const o = S.outcome;
  return `${runhead(S.phase === 'undone' ? 'The season’s undertaking' : 'What came of it', 'Cr.')}
    <p class="kicker">${esc(stamp())}</p><h2>${esc(o.title)}</h2><div class="swell"></div>
    <div class="prose lead">${o.cut ? pic('undertakings/' + o.cut, '') : ''}${paras(o.text)}</div>
    ${o.d.length ? `<ul class="deltas">${o.d.map(([t, up]) => `<li class="${up ? 'up' : 'down'}">${esc(t)}</li>`).join('')}</ul>` : ''}
    <div class="row"><button class="go" onclick="next()"><span>${S.dead ? 'And then' : S.phase === 'undone' ? (S.t === 83 ? 'Close the books' : 'Turn the page') : 'Carry on'}</span></button></div>`; }

const ridesLine = () => { const n = typeof ridesLeft === 'function' ? ridesLeft() : 1, first = !(S.rides || 0); return `${['Nothing more', first ? 'One thing' : 'One thing more', 'Two things', 'Three things'][Math.max(0, Math.min(3, n))]} may be undertaken this quarter.`; };
function undertakeHTML(){ const o = undertakingOptions();
  return `${runhead('The season’s undertaking', 'Cr.')}
    <p class="kicker">${esc(stamp())}</p><h2>The Season Is Yours</h2>

    <div class="choices">${o.map((c, i) => `<button class="choice" onclick="undertake(${i})"><span>${esc(c.t)}${hintHTML(c.hint)}</span>${noteOf(c)}</button>`).join('')}</div>`; }

function endHTML(){ const r = reckoning();

function meter(label, v, words, key, flag, trouble){ const m = typeof marks === 'function' && key ? marks() : null, at = m ? Math.max(0, Math.min(100, m[key])) : null;

    <ul class="fx"><li>Stands at ${Math.round(v)}, settles at ${at}</li>${m.why[key].map(t => `<li class="${/^\+/.test(t) ? 'pos' : /^[−-]/.test(t) ? 'neg' : ''}">${esc(t)}</li>`).join('')}</ul></details>`; }

function versoHTML(){
  const head = runhead('Dr.', `fo. ${Math.min(S.t + 1, 84)}`, `Hatherley Combe, in Account with ${esc(S.name)}, Esq.`);

  if (TAB === 'persons') return head + `<h2 class="qtitle">Persons of Consequence</h2>` + peopleHTML();

      ${over || typeof creditList === 'function' ? '' : `<div class="mort" role="group" aria-label="Mortgage"><button class="inkbtn" onclick="mortgage(-1)" ${S.money >= 500 && S.mortgage >= 500 ? '' : 'disabled'}>Pay off £500</button><button class="inkbtn" onclick="mortgage(1)" ${(typeof canBorrow === 'function' ? canBorrow() : S.mortgage < 9000) ? '' : `disabled title="${esc(typeof borrowWhy === 'function' ? borrowWhy() : '')}"`}>Borrow £500</button></div>`}${over || typeof creditList !== 'function' ? '' : creditHTML()}</dl>

    <div class="memo"><h3 class="orn">${esc('Mr ' + steward())}’s memoranda</h3>
      ${meter('Standing in the county', S.standing, STANDING_W, 'standing', 'cut', 'Cut by the county')}
      ${meter('Goodwill of the parish', S.goodwill, GOODWILL_W, 'goodwill', 'sullen', 'The parish is sullen')}
